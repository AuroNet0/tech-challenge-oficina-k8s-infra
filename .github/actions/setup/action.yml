name: Setup environment executor
description: Shared tools; does not authenticate or mutate infrastructure
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.15.8
        terraform_wrapper: false
    - uses: azure/setup-kubectl@v4
      with:
        version: v1.35.0
    - uses: azure/setup-helm@v4.3.1
    - shell: bash
      run: python -m pip install -r scripts/environment-actions/requirements.txt
