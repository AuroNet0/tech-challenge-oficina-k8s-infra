name: Infra

on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform operation for phase4/stacks/infra
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan
      confirm:
        description: Type DESTROY when action is destroy
        required: false
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: phase4-demo-a-mutation
  cancel-in-progress: false

jobs:
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
        working-directory: phase4/stacks/infra
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_WORKSPACE: default
      AWS_REGION: us-east-1
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      INFRA_ACTION: ${{ inputs.action }}
      INFRA_CONFIRM: ${{ inputs.confirm }}
      INFRA_LOG: ${{ runner.temp }}/infra.log
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check operation and confirmation
        run: |
          set -euo pipefail
          {
            echo '::group::Check operation and confirmation'
            case "$INFRA_ACTION" in
              plan|apply) ;;
              destroy) test "$INFRA_CONFIRM" = DESTROY ;;
              *) echo '::error::Unknown operation'; exit 1 ;;
            esac
            test -n "$AWS_ROLE_ARN" || { echo '::error::Configure repository variable AWS_ROLE_ARN'; exit 1; }
            echo '::endgroup::'
          } 2>&1 | tee -a "$INFRA_LOG"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: infra-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: us-east-1
          role-duration-seconds: 14400
          unset-current-credentials: true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Generate Terraform inputs
        run: |
          set -euo pipefail
          {
            echo '::group::Generate Terraform inputs'
            identity=$(aws sts get-caller-identity --output json)
            account_id=$(jq -er '.Account' <<< "$identity")
            caller_arn=$(jq -er '.Arn' <<< "$identity")
            [[ "$AWS_ROLE_ARN" =~ ^arn:aws:iam::${account_id}:role/[A-Za-z0-9+=,.@_/-]+$ ]]
            role_name=${AWS_ROLE_ARN##*/}
            [[ "$caller_arn" == "arn:aws:sts::${account_id}:assumed-role/${role_name}/"* ]]
            jq -n \
              --arg account_id "$account_id" \
              --arg revision "$GITHUB_SHA" \
              --arg role_arn "$AWS_ROLE_ARN" \
              '{environment_id: "demo-a", aws_region: "us-east-1",
                aws_account_id: $account_id, git_revision: $revision,
                availability_zones: ["us-east-1a", "us-east-1b"],
                eks_admin_role_arn: $role_arn,
                eks_public_access_cidrs: ["0.0.0.0/0"]}' > tfvars.json
            echo '::endgroup::'
          } 2>&1 | tee -a "$INFRA_LOG"

      - name: Terraform init
        run: |
          set -euo pipefail
          {
            echo '::group::Terraform init'
            terraform init -input=false -no-color \
              -backend-config=bucket=tech-challenge-oficina-terraform-state-b1cfa326 \
              -backend-config=key=phase4/environments/demo-a/infra.tfstate \
              -backend-config=region=us-east-1 \
              -backend-config=encrypt=true \
              -backend-config=use_lockfile=true
            echo '::endgroup::'
          } 2>&1 | tee -a "$INFRA_LOG"

      - name: Terraform fmt
        run: |
          set -euo pipefail
          {
            echo '::group::Terraform fmt'
            terraform fmt -check -diff
            echo '::endgroup::'
          } 2>&1 | tee -a "$INFRA_LOG"

      - name: Terraform validate
        run: |
          set -euo pipefail
          {
            echo '::group::Terraform validate'
            terraform validate -no-color
            echo '::endgroup::'
          } 2>&1 | tee -a "$INFRA_LOG"

      - name: Terraform plan
        run: |
          set -euo pipefail
          {
            echo '::group::Terraform plan'
            plan_args=()
            if [[ "$INFRA_ACTION" == destroy ]]; then plan_args+=(-destroy); fi
            terraform plan -input=false -no-color -lock-timeout=5m \
              -var-file=tfvars.json -out=tfplan "${plan_args[@]}"
            terraform show -no-color tfplan > plan.txt
            echo '::endgroup::'
          } 2>&1 | tee -a "$INFRA_LOG"

      - name: Terraform apply
        if: inputs.action == 'apply'
        run: |
          set -euo pipefail
          {
            echo '::group::Terraform apply'
            terraform apply -input=false -no-color -lock-timeout=5m tfplan
            echo '::endgroup::'
          } 2>&1 | tee -a "$INFRA_LOG"

      - name: Terraform destroy
        if: inputs.action == 'destroy'
        run: |
          set -euo pipefail
          {
            echo '::group::Terraform destroy'
            test "$INFRA_CONFIRM" = DESTROY
            terraform destroy -input=false -no-color -auto-approve \
              -lock-timeout=5m -var-file=tfvars.json
            echo '::endgroup::'
          } 2>&1 | tee -a "$INFRA_LOG"

      - name: Failure diagnostics
        if: failure()
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          {
            echo '::group::Failure diagnostics'
            {
              printf '### Terraform state list\n\n```text\n'
              if command -v terraform >/dev/null && test -d phase4/stacks/infra; then
                terraform -chdir=phase4/stacks/infra state list -no-color || true
              else
                echo 'Terraform or checkout unavailable.'
              fi
              printf '```\n\n### Last 200 log lines\n\n```text\n'
              if test -f "$INFRA_LOG"; then tail -n 200 "$INFRA_LOG"; fi
              printf '```\n'
            } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
            echo '::endgroup::'
          } 2>&1 | tee -a "$INFRA_LOG"

      - name: Upload plan and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infra-${{ inputs.action }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            phase4/stacks/infra/plan.txt
            ${{ runner.temp }}/infra.log
          if-no-files-found: warn
          retention-days: 7
