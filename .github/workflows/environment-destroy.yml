name: Environment Destroy
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DESTROY demo-a
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: phase4-demo-a-mutation
  cancel-in-progress: false
jobs:
  teardown:
    environment: phase4-demo-a-provision
    runs-on: ${{ fromJSON(vars.PHASE4_EXECUTOR_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    env:
      EXECUTOR_ROLE: provision
      CONFIRMATION: ${{ inputs.confirmation }}
      PHASE4_EXECUTION_APPROVED: ${{ vars.PHASE4_EXECUTION_APPROVED }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node scripts/environment-actions/control.mjs destroy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: node --test scripts/environment-actions/control.test.mjs
      - run: python -m unittest discover -s scripts/environment-actions -p 'test_*.py'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4.3.1
      - run: python -m pip install -r scripts/environment-actions/requirements.txt
      - uses: aws-actions/configure-aws-credentials@v4
        id: aws
        with:
          role-to-assume: arn:aws:iam::446517826146:role/tc-oficina-p4-demo-a-provision
          role-session-name: teardown-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: us-east-1
          allowed-account-ids: '446517826146'
          unset-current-credentials: true
      - run: python scripts/environment-actions/runtime.py teardown
      - if: ${{ always() && steps.aws.outcome == 'success' }}
        env:
          REPORT_DIR: actions-report/endpoint-close
        run: python scripts/environment-actions/runtime.py close
      - if: ${{ always() }}
        run: node scripts/environment-actions/diagnostics.mjs fallback teardown
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: teardown-demo-a-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            actions-report/report.json
            actions-report/summary.md
            actions-report/identity-inventory.json
            actions-report/kubernetes-diagnostic/
            actions-report/endpoint-close/
          retention-days: 7
  destroy:
    needs: teardown
    environment: phase4-demo-a-destroy
    runs-on: ${{ fromJSON(vars.PHASE4_EXECUTOR_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      EXECUTOR_ROLE: destroy
      CONFIRMATION: ${{ inputs.confirmation }}
      PHASE4_EXECUTION_APPROVED: ${{ vars.PHASE4_EXECUTION_APPROVED }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authorization and scope gate
        run: node scripts/environment-actions/control.mjs destroy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4.3.1
      - run: python -m pip install -r scripts/environment-actions/requirements.txt
      - uses: aws-actions/configure-aws-credentials@v4
        id: aws
        with:
          role-to-assume: arn:aws:iam::446517826146:role/tc-oficina-p4-demo-a-destroy
          role-session-name: destroy-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: us-east-1
          allowed-account-ids: '446517826146'
          role-duration-seconds: 3600
          unset-current-credentials: true
      - name: Recoverable ordered destruction
        run: python scripts/environment-actions/runtime.py destroy
      - name: Independently verify endpoint closure
        if: ${{ always() && steps.aws.outcome == 'success' }}
        env:
          REPORT_DIR: actions-report/endpoint-close
        run: python scripts/environment-actions/runtime.py close
      - name: Setup failure summary
        if: ${{ always() }}
        run: node scripts/environment-actions/diagnostics.mjs fallback destroy
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: destroy-demo-a-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            actions-report/report.json
            actions-report/summary.md
            actions-report/identity-inventory.json
            actions-report/kubernetes-diagnostic/
            actions-report/endpoint-close/
          if-no-files-found: error
          retention-days: 7
