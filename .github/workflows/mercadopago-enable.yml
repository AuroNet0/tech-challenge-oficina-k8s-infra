name: Mercado Pago enable (live)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: phase4-demo-a-mutation
  cancel-in-progress: false

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      AWS_REGION: us-east-1
      AWS_PAGER: ''
      CLUSTER: tc-oficina-p4-demo-a
      NAMESPACE: tc-oficina-p4-demo-a
      CONFIGMAP: billing-service-config
      DEPLOYMENT: billing-service
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Configurar kubeconfig
        run: |
          set -Eeuo pipefail
          aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"
          kubectl get deployment "$DEPLOYMENT" -n "$NAMESPACE" --request-timeout=30s

      - name: Habilitar Mercado Pago no billing-service
        run: |
          set -Eeuo pipefail
          kubectl get configmap "$CONFIGMAP" -n "$NAMESPACE" -o json > /tmp/config-before.json
          api=$(jq -er '.data.BILLING_JWT_ISSUER' /tmp/config-before.json)
          [[ "$api" =~ ^https://[a-z0-9]+\.execute-api\.us-east-1\.amazonaws\.com$ ]]
          jq -n --arg api "$api" '{data: {
            MERCADO_PAGO_ENABLED: "true", MERCADO_PAGO_RECONCILIATION_ENABLED: "true",
            MERCADO_PAGO_NOTIFICATION_URL: ($api + "/api/v1/webhooks/mercado-pago"),
            MERCADO_PAGO_SUCCESS_URL: "https://example.com/success",
            MERCADO_PAGO_FAILURE_URL: "https://example.com/failure",
            MERCADO_PAGO_PENDING_URL: "https://example.com/pending"}}' > /tmp/patch.json
          kubectl patch configmap "$CONFIGMAP" -n "$NAMESPACE" --type merge --patch-file /tmp/patch.json
          kubectl rollout restart "deployment/${DEPLOYMENT}" -n "$NAMESPACE"
          if kubectl rollout status "deployment/${DEPLOYMENT}" -n "$NAMESPACE" --timeout=420s; then
            {
              echo '### Mercado Pago habilitado no billing-service'
              echo
              echo '```'
              kubectl get configmap "$CONFIGMAP" -n "$NAMESPACE" -o json | jq -r '.data | to_entries[] | select(.key | startswith("MERCADO_PAGO")) | "\(.key)=\(.value)"'
              kubectl get pods -n "$NAMESPACE" -l app.kubernetes.io/name="$DEPLOYMENT"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error::billing-service nao ficou pronto com o Mercado Pago habilitado; revertendo a configuracao."
          {
            echo '### Falha ao habilitar; configuracao revertida'
            echo
            echo '```'
            kubectl get pods -n "$NAMESPACE" -l app.kubernetes.io/name="$DEPLOYMENT" || true
            kubectl logs -n "$NAMESPACE" -l app.kubernetes.io/name="$DEPLOYMENT" --tail=40 2>/dev/null \
              | grep -i -E 'mercado|IllegalArgument|APPLICATION FAILED|Caused by|Error' | cut -c1-300 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          jq '{data: (.data | with_entries(select(.key | startswith("MERCADO_PAGO"))))}' /tmp/config-before.json > /tmp/revert.json
          kubectl patch configmap "$CONFIGMAP" -n "$NAMESPACE" --type merge --patch-file /tmp/revert.json
          kubectl rollout restart "deployment/${DEPLOYMENT}" -n "$NAMESPACE"
          kubectl rollout status "deployment/${DEPLOYMENT}" -n "$NAMESPACE" --timeout=420s || true
          exit 1