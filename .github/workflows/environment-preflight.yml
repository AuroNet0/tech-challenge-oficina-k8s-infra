name: Environment Preflight
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      scope:
        type: string
        default: full
    secrets:
      SOURCE_READ_TOKEN:
        required: false
permissions:
  contents: read
concurrency:
  group: phase4-demo-a-preflight-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  preflight:
    environment: phase4-demo-a-provision
    runs-on: ${{ fromJSON(vars.PHASE4_PREFLIGHT_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Approve read-only AWS inspection
        env:
          READONLY_APPROVED: ${{ vars.PHASE4_READONLY_APPROVED }}
        run: |
          test "$GITHUB_REPOSITORY" = 'AuroNet0/tech-challenge-oficina-k8s-infra'
          test "$GITHUB_REF" = 'refs/heads/homolog'
          test "$READONLY_APPROVED" = 'true'
      - name: Assume provision role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::446517826146:role/tc-oficina-p4-demo-a-provision
          role-session-name: preflight-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: us-east-1
          allowed-account-ids: '446517826146'
          unset-current-credentials: true
          mask-aws-account-id: true
      - name: Inspect account without creating resources
        env:
          GH_TOKEN: ${{ secrets.SOURCE_READ_TOKEN || github.token }}
          PREFLIGHT_SCOPE: ${{ inputs.scope || 'full' }}
        run: node scripts/environment-actions/control.mjs preflight
      - name: Report setup failure
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: node scripts/environment-actions/diagnostics.mjs fallback preflight
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: preflight-demo-a-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            actions-report/report.json
            actions-report/summary.md
          if-no-files-found: error
          retention-days: 7
