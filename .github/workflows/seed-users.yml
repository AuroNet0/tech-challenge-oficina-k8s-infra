name: Seed users

on:
  workflow_dispatch:
    inputs:
      smoke_secret_arn:
        description: ARN do segredo de smoke (a senha dele e reutilizada para os usuarios de demonstracao)
        required: true
        type: string
      filial_id:
        description: UUID da filial criada (vazio concede so o necessario para criar filial)
        required: false
        type: string
        default: ''
      cliente_id:
        description: UUID do cliente criado a vincular ao usuario CLIENTE (vazio nao vincula)
        required: false
        type: string
        default: ''
      os_id:
        description: UUID da OS aberta para atribuir ao mecanico (vazio nao atribui)
        required: false
        type: string
        default: ''

permissions:
  id-token: write
  contents: read

concurrency:
  group: phase4-demo-a-mutation
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_WORKSPACE: default
      AWS_REGION: us-east-1
      AWS_PAGER: ''
      SMOKE_SECRET_ARN: ${{ inputs.smoke_secret_arn }}
      FILIAL_ID: ${{ inputs.filial_id }}
      CLIENTE_ID: ${{ inputs.cliente_id }}
      OS_ID: ${{ inputs.os_id }}
      KUBECONFIG: /tmp/seed-kubeconfig
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: seed-users-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validar entradas
        run: |
          set -Eeuo pipefail
          uuid_pattern='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          for name in FILIAL_ID CLIENTE_ID OS_ID; do
            value="${!name}"
            if [ -n "$value" ] && ! [[ "$value" =~ $uuid_pattern ]]; then
              echo "::error::${name} nao e um UUID valido."
              exit 1
            fi
          done
          if [ -n "$OS_ID" ] && [ -z "$FILIAL_ID" ]; then
            echo "::error::os_id exige filial_id."
            exit 1
          fi

      - name: Ler outputs da infra e da plataforma
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao ler outputs; confira se o Deploy esta de pe e as permissoes AWS."' ERR
          umask 077
          for stack in infra platform; do
            terraform -chdir="phase4/stacks/${stack}" init -input=false -no-color \
              -backend-config=bucket=tech-challenge-oficina-terraform-state-b1cfa326 \
              -backend-config="key=phase4/environments/demo-a/${stack}.tfstate" \
              -backend-config=region=us-east-1 \
              -backend-config=encrypt=true \
              -backend-config=use_lockfile=true > /dev/null
          done
          terraform -chdir=phase4/stacks/infra output -json platform_contract > /tmp/infra_contract.json
          terraform -chdir=phase4/stacks/platform output -json manifests > /tmp/platform-manifests.json
          account_id=$(aws sts get-caller-identity --query Account --output text)
          jq -e --arg account "$account_id" '.environment_id == "demo-a" and
            .aws_account_id == $account and .aws_region == "us-east-1" and
            (.name_prefix | type == "string" and length > 0)' /tmp/infra_contract.json > /dev/null
          jq -e '.bootstrap | fromjson | .items[0] | select(.kind == "Job")' \
            /tmp/platform-manifests.json > /tmp/job-base.json

      - name: Ler credenciais de smoke
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao ler smoke_secret_arn; exige email @example.invalid e senha de 12 a 1024 caracteres."' ERR
          umask 077
          account_id=$(jq -er '.aws_account_id' /tmp/infra_contract.json)
          secret_pattern="^arn:aws:secretsmanager:${AWS_REGION}:${account_id}:secret:[A-Za-z0-9/_+=.@!-]+-[A-Za-z0-9]{6}$"
          [[ "$SMOKE_SECRET_ARN" =~ $secret_pattern ]]
          aws secretsmanager get-secret-value --secret-id "$SMOKE_SECRET_ARN" \
            --query SecretString --output text > /tmp/credentials.json
          jq -e 'type == "object" and
            (.email | type == "string" and test("^[a-z0-9.+_-]+@example\\.invalid$")) and
            (.password | type == "string" and length >= 12 and length <= 1024)' \
            /tmp/credentials.json > /dev/null 2>&1
          masked_password=$(jq -jr '.password | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A")' /tmp/credentials.json)
          printf '::add-mask::%s\n' "$masked_password"

      - name: Conferir pre-requisitos do cluster
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha nos pre-requisitos; confira EKS, Secrets auth-postgres e os-postgres e ConfigMap rds-ca."' ERR
          cluster_name=$(jq -er '.eks.name' /tmp/infra_contract.json)
          namespace=$(jq -er '.name_prefix' /tmp/infra_contract.json)
          aws eks update-kubeconfig --name "$cluster_name" --region "$AWS_REGION"
          kubectl get secret auth-postgres -n "$namespace" -o json --request-timeout=30s \
            | jq -e '.data | (.username | type == "string" and length > 0) and (.password | type == "string" and length > 0)' > /dev/null
          kubectl get secret os-postgres -n "$namespace" -o json --request-timeout=30s \
            | jq -e '.data | (.username | type == "string" and length > 0) and (.password | type == "string" and length > 0)' > /dev/null
          kubectl get configmap rds-ca -n "$namespace" -o json --request-timeout=30s \
            | jq -e '.data["ca.pem"] | type == "string" and length > 0' > /dev/null

      - name: Gerar SQL dos usuarios e permissoes
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao gerar SQL; detalhes omitidos para proteger senha e hash."' ERR
          umask 077
          python -m pip install --disable-pip-version-check cryptography==50.0.1
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import uuid
          from cryptography.hazmat.primitives.kdf.argon2 import Argon2id

          try:
              infra = json.loads(Path("/tmp/infra_contract.json").read_text())
              credentials = json.loads(Path("/tmp/credentials.json").read_text())
              prefix = infra["name_prefix"]

              def optional_uuid(name):
                  value = os.environ.get(name, "").strip()
                  return str(uuid.UUID(value)) if value else ""

              filial_id = optional_uuid("FILIAL_ID")
              cliente_id = optional_uuid("CLIENTE_ID")
              os_id = optional_uuid("OS_ID")

              def literal(value):
                  return "'" + str(value).replace("'", "''") + "'"

              def user_uuid(email):
                  return str(uuid.uuid5(uuid.NAMESPACE_URL, prefix + "/" + email))

              smoke_id = user_uuid(credentials["email"])
              users = {
                  "mecanico": ("demo.mecanico@example.invalid", "Demo FIAP Mecanico", "MECANICO"),
                  "gerente": ("demo.gerente@example.invalid", "Demo FIAP Gerente", "GERENTE"),
                  "cliente": ("demo.cliente@example.invalid", "Demo FIAP Cliente", "CLIENTE"),
              }
              ids = {key: user_uuid(value[0]) for key, value in users.items()}
              actor = str(uuid.uuid5(uuid.NAMESPACE_URL, prefix + "/seed-grant-actor"))

              auth = ["BEGIN;", "SELECT pg_advisory_xact_lock(hashtextextended('oficina-demo-users',0));"]
              for key, (email, nome, papel) in users.items():
                  password_hash = Argon2id(salt=os.urandom(16), length=32, iterations=2,
                                           lanes=1, memory_cost=19456).derive_phc_encoded(credentials["password"].encode())
                  auth.append("INSERT INTO usuarios(id,email,nome,password_hash,ativo,criado_em,atualizado_em) VALUES ("
                              + ",".join(map(literal, (ids[key], email, nome, password_hash)))
                              + ",true,now(),now()) ON CONFLICT DO NOTHING;")
                  auth.append("DO $$ BEGIN IF NOT EXISTS(SELECT 1 FROM usuarios WHERE id=" + literal(ids[key])
                              + " AND email=" + literal(email)
                              + " AND nome LIKE 'Demo FIAP %') THEN RAISE EXCEPTION 'DEMO_IDENTITY_OWNERSHIP_REJECTED'; END IF; END $$;")
                  auth.append("INSERT INTO usuario_papeis(usuario_id,papel) VALUES (" + literal(ids[key])
                              + "," + literal(papel) + ") ON CONFLICT DO NOTHING;")
                  if key == "cliente" and cliente_id:
                      auth.append("INSERT INTO usuario_clientes(usuario_id,papel,cliente_id,criado_em) VALUES ("
                                  + literal(ids[key]) + ",'CLIENTE'," + literal(cliente_id)
                                  + ",now()) ON CONFLICT DO NOTHING;")
              auth.append("COMMIT;")

              def operational(usuario, filial, capability):
                  return ("INSERT INTO operational_grants(id,usuario_id,filial_id,capability,concedido_por,concedido_em) VALUES ("
                          + ",".join(map(literal, (uuid.uuid4(), usuario, filial, capability, actor)))
                          + ",now()) ON CONFLICT DO NOTHING;")

              def administrative(usuario, capability, filial):
                  return ("INSERT INTO administrative_grants(id,usuario_id,capability,filial_id,concedido_por,concedido_em) VALUES ("
                          + literal(uuid.uuid4()) + "," + literal(usuario) + "," + literal(capability) + ","
                          + (literal(filial) if filial else "NULL") + "," + literal(actor) + ",now()) ON CONFLICT DO NOTHING;")

              os_sql = ["BEGIN;", "SELECT pg_advisory_xact_lock(hashtextextended('oficina-demo-grants',0));",
                        administrative(ids["gerente"], "BRANCH_CREATE", "")]
              if filial_id:
                  os_sql.append("DO $$ BEGIN IF NOT EXISTS(SELECT 1 FROM filiais WHERE id=" + literal(filial_id)
                                + ") THEN RAISE EXCEPTION 'FILIAL_NOT_FOUND'; END IF; END $$;")
                  for capability in ("OS_READ", "OS_OPEN", "CLIENT_READ", "CLIENT_CREATE", "VEHICLE_READ",
                                     "VEHICLE_CREATE", "BRANCH_READ"):
                      os_sql.append(operational(smoke_id, filial_id, capability))
                  for capability in ("OS_READ", "BRANCH_READ"):
                      os_sql.append(operational(ids["gerente"], filial_id, capability))
                  os_sql.append(administrative(ids["gerente"], "SAGA_INSPECT", filial_id))
              if os_id:
                  os_sql.append("DO $$ BEGIN IF NOT EXISTS(SELECT 1 FROM ordens_servico WHERE id=" + literal(os_id)
                                + ") THEN RAISE EXCEPTION 'OS_NOT_FOUND'; END IF; END $$;")
                  for capability in ("OPERATIONAL_READ", "VEHICLE_OPERATIONAL_READ", "DIAGNOSTIC_READ",
                                     "DIAGNOSTIC_WRITE", "DIAGNOSTIC_COMPLETE", "REPAIR_READ", "REPAIR_WRITE",
                                     "REPAIR_COMPLETE", "HISTORY_READ"):
                      os_sql.append("INSERT INTO mechanic_assignments(id,usuario_id,os_id,capability,concedido_por,concedido_em) VALUES ("
                                    + ",".join(map(literal, (uuid.uuid4(), ids["mecanico"], os_id, capability, actor)))
                                    + ",now()) ON CONFLICT DO NOTHING;")
              os_sql.append("COMMIT;")
              Path("/tmp/seed-auth.sql").write_text("\n".join(auth), encoding="utf-8")
              Path("/tmp/seed-os.sql").write_text("\n".join(os_sql), encoding="utf-8")
          except Exception:
              print("::error::Falha ao gerar SQL; detalhes omitidos para proteger senha e hash.")
              raise SystemExit(1)
          PY

      - name: Executar seed via Job psql
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no Job de seed; confira o RDS, as permissoes dos Secrets auth-postgres e os-postgres e se filial/OS informadas existem."' ERR
          umask 077
          namespace=$(jq -er '.name_prefix' /tmp/infra_contract.json)
          kubectl create secret generic demo-users-sql -n "$namespace" \
            --from-file=auth.sql=/tmp/seed-auth.sql --from-file=os.sql=/tmp/seed-os.sql \
            --dry-run=client -o json | \
            jq '.metadata.labels = {"oficina/managed-by": "actions-seed-users"}' | \
            kubectl apply -f - > /dev/null
          sql_digest=$(cat /tmp/seed-auth.sql /tmp/seed-os.sql | sha256sum)
          job_name="demo-users-seed-${sql_digest:0:12}"
          jq --arg namespace "$namespace" --arg name "$job_name" --slurpfile infra /tmp/infra_contract.json '
            .metadata.name = $name | .metadata.namespace = $namespace |
            .spec.template.spec.containers[0].command = ["sh", "-ec", "export PGHOST PGPORT PGSSLMODE PGSSLROOTCERT; PGDATABASE=\"$AUTH_DB\" PGUSER=\"$AUTH_USER\" PGPASSWORD=\"$AUTH_PASSWORD\" psql -Xq --set=ON_ERROR_STOP=1 --file=/demo/auth.sql >/dev/null; PGDATABASE=\"$OS_DB\" PGUSER=\"$OS_USER\" PGPASSWORD=\"$OS_PASSWORD\" psql -Xq --set=ON_ERROR_STOP=1 --file=/demo/os.sql >/dev/null"] |
            .spec.template.spec.containers[0].envFrom = [] |
            .spec.template.spec.containers[0].env = [
              {name: "PGHOST", value: $infra[0].rds.address}, {name: "PGPORT", value: "5432"},
              {name: "PGSSLMODE", value: "verify-full"}, {name: "PGSSLROOTCERT", value: "/rds-ca/ca.pem"},
              {name: "AUTH_DB", value: $infra[0].rds.application_databases.auth.database},
              {name: "OS_DB", value: $infra[0].rds.application_databases.os.database},
              {name: "AUTH_USER", valueFrom: {secretKeyRef: {name: "auth-postgres", key: "username"}}},
              {name: "AUTH_PASSWORD", valueFrom: {secretKeyRef: {name: "auth-postgres", key: "password"}}},
              {name: "OS_USER", valueFrom: {secretKeyRef: {name: "os-postgres", key: "username"}}},
              {name: "OS_PASSWORD", valueFrom: {secretKeyRef: {name: "os-postgres", key: "password"}}}] |
            .spec.template.spec.containers[0].volumeMounts = [
              {name: "rds-ca", mountPath: "/rds-ca", readOnly: true},
              {name: "demo-sql", mountPath: "/demo", readOnly: true}] |
            .spec.template.spec.volumes = [
              {name: "rds-ca", configMap: {name: "rds-ca"}},
              {name: "demo-sql", secret: {secretName: "demo-users-sql"}}]
          ' /tmp/job-base.json > /tmp/seed-job.json
          printf '%s\n' "$job_name" > /tmp/seed-job-name
          kubectl delete job "$job_name" -n "$namespace" --ignore-not-found --wait=true --timeout=60s
          kubectl apply -f /tmp/seed-job.json
          kubectl wait --for=condition=complete "job/${job_name}" -n "$namespace" --timeout=300s
          kubectl get job "$job_name" -n "$namespace" -o json --request-timeout=30s | \
            jq -e '.status.succeeded == 1' > /dev/null
          {
            echo '### Usuarios e permissoes de demonstracao'
            echo
            echo 'Senha: a mesma do segredo de smoke.'
            echo
            echo '| Papel | Email |'
            echo '|---|---|'
            echo '| MECANICO | demo.mecanico@example.invalid |'
            echo '| GERENTE | demo.gerente@example.invalid |'
            echo '| CLIENTE | demo.cliente@example.invalid |'
            echo
            echo "- Gerente pode criar filial: sim"
            echo "- Filial com permissoes de Atendente e Gerente: ${FILIAL_ID:-nenhuma}"
            echo "- Cliente vinculado: ${CLIENTE_ID:-nenhum}"
            echo "- OS atribuida ao Mecanico: ${OS_ID:-nenhuma}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Limpar Job e Secret temporarios
        if: always()
        run: |
          namespace=$(jq -er '.name_prefix' /tmp/infra_contract.json 2>/dev/null) || exit 0
          job_name=$(cat /tmp/seed-job-name 2>/dev/null || true)
          if [ -n "$job_name" ]; then
            kubectl delete job "$job_name" -n "$namespace" --ignore-not-found --wait=false || true
          fi
          kubectl delete secret demo-users-sql -n "$namespace" --ignore-not-found || true