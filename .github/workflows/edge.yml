name: Edge (temporary)

on:
  workflow_dispatch:
    inputs:
      auth_release_run_id:
        description: Successful auth-artifact.yml run containing auth_release.json
        required: true
        type: string
      stage:
        description: Edge deployment stage
        required: true
        type: choice
        options:
          - auth
          - alb
          - business
        default: auth
      mode:
        description: Terraform operation for phase4/stacks/edge (publish_auth)
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: phase4-demo-a-mutation
  cancel-in-progress: false

jobs:
  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_WORKSPACE: default
      AWS_REGION: us-east-1
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EDGE_MODE: ${{ inputs.mode }}
      EDGE_STAGE: ${{ inputs.stage }}
      AUTH_RELEASE_RUN_ID: ${{ inputs.auth_release_run_id }}
      EDGE_LOG: /tmp/edge.log
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@v4
        id: credentials
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: edge-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: us-east-1
          role-duration-seconds: 14400
          unset-current-credentials: true

      - uses: hashicorp/setup-terraform@v3
        id: terraform
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Check inputs and Auth release run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao validar inputs ou o run de auth-artifact.yml; confira auth_release_run_id, mode e AWS_ROLE_ARN."' ERR
          {
            [[ "$EDGE_MODE" == plan || "$EDGE_MODE" == apply ]]
            [[ "$AUTH_RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            test -n "$AWS_ROLE_ARN"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${AUTH_RELEASE_RUN_ID}" > /tmp/edge-auth-run.json
            jq -e '.path == ".github/workflows/auth-artifact.yml" and
              .status == "completed" and .conclusion == "success"' /tmp/edge-auth-run.json
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Download auth_release.json
        id: auth_release
        uses: actions/download-artifact@v4
        with:
          name: auth_release.json
          run-id: ${{ inputs.auth_release_run_id }}
          github-token: ${{ github.token }}
          path: /tmp/edge-auth-release

      - name: Read infra and Platform contracts
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao inicializar infra/platform ou ler platform_contract e edge_contract; confira os states de demo-a e permissoes AWS."' ERR
          {
            for stack in infra platform; do
              terraform -chdir="phase4/stacks/${stack}" init -input=false -no-color \
                -backend-config=bucket=tech-challenge-oficina-terraform-state-b1cfa326 \
                -backend-config="key=phase4/environments/demo-a/${stack}.tfstate" \
                -backend-config=region=us-east-1 \
                -backend-config=encrypt=true \
                -backend-config=use_lockfile=true
            done
            terraform -chdir=phase4/stacks/infra output -json platform_contract > /tmp/infra_contract.json
            terraform -chdir=phase4/stacks/platform output -json > /tmp/edge-platform-outputs.json
            jq -e '.edge_contract | select(.sensitive == false) | .value | select(type == "object")' \
              /tmp/edge-platform-outputs.json > /tmp/edge-platform-contract.json
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Generate Terraform inputs
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao gerar tfvars.json; confira identidade AWS, contratos infra/platform, GitRevision e auth_release.json. Nenhum valor ausente sera presumido."' ERR
          {
            account_id=$(aws sts get-caller-identity --query Account --output text)
            [[ "$account_id" =~ ^[0-9]{12}$ ]]
            [[ "$AWS_ROLE_ARN" =~ ^arn:aws:iam::${account_id}:role/[A-Za-z0-9+=,.@_/-]+$ ]]
            jq -e --arg account "$account_id" '
              .environment_id == "demo-a" and .aws_region == "us-east-1" and
              .aws_account_id == $account and (.tags.GitRevision | test("^[0-9a-f]{40}$"))
            ' /tmp/infra_contract.json
            jq -e --slurpfile infra /tmp/infra_contract.json '
              .environment_id == $infra[0].environment_id and
              .aws_account_id == $infra[0].aws_account_id and .aws_region == $infra[0].aws_region and
              .namespace == $infra[0].name_prefix and .vpc_id == $infra[0].vpc_id and
              ((.private_subnet_ids | sort) == ([$infra[0].private_subnets[].id] | sort))
            ' /tmp/edge-platform-contract.json
            jq -e --slurpfile infra /tmp/infra_contract.json '
              (keys == ["bootstrap_layer_arn", "bootstrap_revision", "bucket", "key", "revision", "sha256_base64", "version_id"]) and
              all(.[]; type == "string") and
              .bucket == ($infra[0].name_prefix + "-artifacts") and
              (.revision | test("^[0-9a-f]{40}$")) and .key == ("auth/" + .revision + "/auth.jar") and
              (.version_id | length > 0) and .version_id != "null" and
              (.sha256_base64 | test("^[A-Za-z0-9+/]{43}=$")) and
              (.bootstrap_revision | test("^[0-9a-f]{40}$")) and
              (.bootstrap_layer_arn | test("^arn:aws:lambda:" + $infra[0].aws_region + ":" +
                $infra[0].aws_account_id + ":layer:" + $infra[0].name_prefix + "-auth-bootstrap:[1-9][0-9]*$"))
            ' /tmp/edge-auth-release/auth_release.json > /dev/null
            jq -n --slurpfile infra /tmp/infra_contract.json \
              --slurpfile platform /tmp/edge-platform-contract.json \
              --slurpfile release /tmp/edge-auth-release/auth_release.json '
              {environment_id: $infra[0].environment_id, aws_region: $infra[0].aws_region,
                aws_account_id: $infra[0].aws_account_id, git_revision: $infra[0].tags.GitRevision,
                approval_source: "catalog", auth_permissions_boundary_arn: null,
                infra_contract: $infra[0], platform_contract: $platform[0],
                publish_auth: true, prepare_alb: false, publish_business: false, publish_webhook: false,
                readiness: {}, auth_release: $release[0], alb_tls: null, alb_listener_arn: null}
            ' > phase4/stacks/edge/tfvars.json
            if [[ "$EDGE_STAGE" == alb || "$EDGE_STAGE" == business ]]; then
              jq '.prepare_alb = true' phase4/stacks/edge/tfvars.json > /tmp/edge-alb-tfvars.json
              mv /tmp/edge-alb-tfvars.json phase4/stacks/edge/tfvars.json
            fi
            declared_variables=$(sed -n 's/^variable "\([^"]*\)".*/\1/p' phase4/stacks/edge/*.tf | sort)
            supplied_variables=$(jq -r 'keys[]' phase4/stacks/edge/tfvars.json | sort)
            [[ "$declared_variables" == "$supplied_variables" ]]
            if [[ "$EDGE_STAGE" == alb || "$EDGE_STAGE" == business ]]; then
              if [[ "$EDGE_STAGE" == business ]]; then
                printf '### Edge publish_business\n\nMode: `%s`; Auth release run: `%s`.\n\nAuth e preparacao ALB mantidos; business habilitado; webhook desabilitado; TLS null; readiness sem atestacoes. Listener descoberto antes do plan.\n' \
                  "$EDGE_MODE" "$AUTH_RELEASE_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
              else
                printf '### Edge prepare_alb\n\nMode: `%s`; Auth release run: `%s`.\n\nAuth mantido; ALB habilitado; business e webhook desabilitados; TLS e listener null; readiness sem atestacoes.\n' \
                  "$EDGE_MODE" "$AUTH_RELEASE_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              printf '### Edge publish_auth\n\nMode: `%s`; Auth release run: `%s`.\n\nBusiness, ALB e webhook desabilitados; TLS e listener null; readiness sem atestacoes.\n' \
                "$EDGE_MODE" "$AUTH_RELEASE_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
            fi
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Discover business listener before plan
        if: inputs.stage == 'business'
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao descobrir ou validar listener de negocio antes do plan; confira ALB existente, HTTP/80 e contrato infra."' ERR
          {
            name_prefix=$(jq -er '.name_prefix' /tmp/infra_contract.json)
            region=$(jq -er '.aws_region' /tmp/infra_contract.json)
            account_id=$(jq -er '.aws_account_id' /tmp/infra_contract.json)
            alb_name="${name_prefix}-edge"
            if ! aws elbv2 describe-load-balancers --names "$alb_name" > /tmp/edge-business-alb.json; then
              echo "::error::ALB ${alb_name} deve existir para publicar negocio; rode stage=alb mode=apply antes e confira as permissoes AWS."
              exit 1
            fi
            if ! jq -e '.LoadBalancers | length == 1' /tmp/edge-business-alb.json > /dev/null; then
              echo '::error::Esperado exatamente um ALB existente; rode stage=alb mode=apply antes.'
              exit 1
            fi
            alb_arn=$(jq -er '.LoadBalancers[0].LoadBalancerArn' /tmp/edge-business-alb.json)
            aws elbv2 describe-listeners --load-balancer-arn "$alb_arn" > /tmp/edge-business-listeners.json
            if ! listener_arn=$(jq -er '[.Listeners[] | select(.Protocol == "HTTP" and .Port == 80)] |
              if length == 1 then .[0].ListenerArn else error("Esperado exatamente um listener HTTP/80") end' \
              /tmp/edge-business-listeners.json); then
              echo '::error::Publicacao de negocio exige exatamente um listener HTTP/80 no ALB existente.'
              exit 1
            fi
            listener_pattern="^arn:aws:elasticloadbalancing:${region}:${account_id}:listener/app/${name_prefix}-edge/[0-9a-f]{16}/[0-9a-f]{16}$"
            if [[ ! "$listener_arn" =~ $listener_pattern ]]; then
              echo '::error::ARN do listener rejeitado pelo formato exigido em phase4/stacks/edge/variables.tf.'
              exit 1
            fi
            jq --arg listener "$listener_arn" '.publish_business = true | .alb_listener_arn = $listener' \
              phase4/stacks/edge/tfvars.json > /tmp/edge-business-tfvars.json
            mv /tmp/edge-business-tfvars.json phase4/stacks/edge/tfvars.json
            printf '\nListener de negocio observado antes do plan: `%s`.\n' "$listener_arn" >> "$GITHUB_STEP_SUMMARY"
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Terraform init
        working-directory: phase4/stacks/edge
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no terraform init de edge; confira backend e permissoes AWS."' ERR
          {
            terraform init -input=false -no-color \
              -backend-config=bucket=tech-challenge-oficina-terraform-state-b1cfa326 \
              -backend-config=key=phase4/environments/demo-a/edge.tfstate \
              -backend-config=region=us-east-1 \
              -backend-config=encrypt=true \
              -backend-config=use_lockfile=true
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Terraform validate
        working-directory: phase4/stacks/edge
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no terraform validate de edge; confira o diagnostico no log."' ERR
          { terraform validate -no-color; } 2>&1 | tee -a "$EDGE_LOG"

      - name: Terraform plan
        working-directory: phase4/stacks/edge
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no terraform plan de edge; confira contratos, artefato Auth e permissoes AWS."' ERR
          {
            terraform plan -input=false -no-color -lock-timeout=5m -var-file=tfvars.json -out=tfplan
            terraform show -no-color tfplan > /tmp/edge-plan.txt
            {
              printf '\n### Terraform plan\n\n```text\n'
              cat /tmp/edge-plan.txt
              printf '```\n'
            } >> "$GITHUB_STEP_SUMMARY"
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Terraform apply
        if: inputs.mode == 'apply'
        working-directory: phase4/stacks/edge
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no terraform apply de edge; confira log e state antes de repetir."' ERR
          { terraform apply -input=false -no-color -lock-timeout=5m tfplan; } 2>&1 | tee -a "$EDGE_LOG"

      - name: Export edge outputs
        if: inputs.mode == 'apply'
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao exportar outputs de edge ou resumir endpoint, issuer e JWKS sem valores sensiveis."' ERR
          {
            terraform -chdir=phase4/stacks/edge output -json > /tmp/edge-outputs.json
            jq -er '
              if .edge_contract.sensitive == false and .jwt_contract.sensitive == false then
                "\n### Edge endpoints\n\nAPI Gateway: " + .edge_contract.value.api_endpoint +
                "\n\nIssuer: " + .jwt_contract.value.issuer + "\n\nJWKS: " + .jwt_contract.value.jwks_uri
              else error("Outputs ausentes ou sensiveis") end
            ' /tmp/edge-outputs.json >> "$GITHUB_STEP_SUMMARY"
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Upload edge-outputs.json
        id: outputs
        if: inputs.mode == 'apply'
        uses: actions/upload-artifact@v4
        with:
          name: edge-outputs.json
          path: /tmp/edge-outputs.json
          if-no-files-found: error
          retention-days: 7

      - name: Smoke test JWKS
        if: inputs.mode == 'apply'
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no smoke test JWKS; endpoint deve responder com .keys contendo pelo menos uma chave em ate 120s."' ERR
          {
            jwks_uri=$(jq -er '.jwt_contract | select(.sensitive == false) | .value.jwks_uri |
              select(type == "string" and startswith("https://"))' /tmp/edge-outputs.json)
            deadline=$((SECONDS + 120))
            ready=false
            while (( SECONDS < deadline )); do
              remaining=$((deadline - SECONDS))
              if curl --fail --silent --show-error --proto '=https' --connect-timeout 10 \
                --max-time "$remaining" "$jwks_uri" -o /tmp/edge-jwks.json &&
                jq -e '.keys | type == "array" and length >= 1' /tmp/edge-jwks.json > /dev/null; then
                ready=true
                break
              fi
              remaining=$((deadline - SECONDS))
              if (( remaining > 0 )); then
                sleep "$((remaining < 5 ? remaining : 5))"
              fi
            done
            [[ "$ready" == true ]]
            printf '\n### Smoke test\n\nJWKS respondeu com pelo menos uma chave.\n' >> "$GITHUB_STEP_SUMMARY"
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Apply ALB manifests
        if: inputs.mode == 'apply' && (inputs.stage == 'alb' || inputs.stage == 'business')
        env:
          KUBECONFIG: /tmp/edge-kubeconfig
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao exportar ou aplicar manifests ALB; confira contrato EKS, namespaces e controller."' ERR
          {
            terraform -chdir=phase4/stacks/edge output -json manifests > /tmp/edge-manifests-output.json
            jq -e 'fromjson | select(.kind == "List" and (.items | length > 0))' \
              /tmp/edge-manifests-output.json > /tmp/edge-manifests.json
            jq -er '[.items[] | select(.kind == "Ingress" or .kind == "NetworkPolicy") |
              .metadata.namespace] | unique |
              if length > 0 and all(.[]; type == "string" and length > 0)
                then .[] else error("Namespaces ausentes nos manifests ALB") end' \
              /tmp/edge-manifests.json > /tmp/edge-alb-namespaces.txt
            jq -e '[.items[] | select(.kind == "Ingress") | . as $ingress |
              .spec.rules[].http.paths[] |
              {namespace: $ingress.metadata.namespace, service: .backend.service.name,
                port: .backend.service.port.number}] | unique |
              select(length > 0 and all(.[];
                (.service | type == "string" and length > 0) and (.port | type == "number")))' \
              /tmp/edge-manifests.json > /tmp/edge-alb-services.json
            cluster_name=$(jq -er '.eks.name' /tmp/infra_contract.json)
            aws eks update-kubeconfig --name "$cluster_name" --region "$AWS_REGION"
            while IFS= read -r namespace; do
              kubectl get namespace "$namespace" -o name --request-timeout=30s
            done < /tmp/edge-alb-namespaces.txt
            kubectl apply -f /tmp/edge-manifests.json
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Wait for ALB and discover HTTP listener
        if: inputs.mode == 'apply' && (inputs.stage == 'alb' || inputs.stage == 'business')
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao aguardar ALB interno ou descobrir listener HTTP/80 unico; confira VPC, SG, controller e permissoes AWS."' ERR
          {
            alb_name=$(jq -er '.edge_contract | select(.sensitive == false) | .value.alb_name' /tmp/edge-outputs.json)
            deadline=$((SECONDS + 300))
            found=false
            while (( SECONDS < deadline )); do
              remaining=$((deadline - SECONDS))
              if timeout "${remaining}s" aws elbv2 describe-load-balancers --names "$alb_name" \
                > /tmp/edge-alb.json 2> /tmp/edge-alb-discovery-error.txt; then
                jq -e '.LoadBalancers | length == 1' /tmp/edge-alb.json > /dev/null
                found=true
                break
              elif ! grep -q 'LoadBalancerNotFound' /tmp/edge-alb-discovery-error.txt; then
                cat /tmp/edge-alb-discovery-error.txt
                echo '::error::Falha na consulta do ALB; somente LoadBalancerNotFound permite nova tentativa.'
                exit 1
              fi
              remaining=$((deadline - SECONDS))
              if (( remaining > 0 )); then sleep "$((remaining < 5 ? remaining : 5))"; fi
            done
            if [[ "$found" != true ]]; then
              echo "::error::ALB ${alb_name} nao foi encontrado em ate 5 minutos."
              exit 1
            fi
            alb_arn=$(jq -er '.LoadBalancers[0].LoadBalancerArn' /tmp/edge-alb.json)
            aws elbv2 wait load-balancer-available --load-balancer-arns "$alb_arn"
            aws elbv2 describe-load-balancers --load-balancer-arns "$alb_arn" > /tmp/edge-alb.json
            jq -e --slurpfile infra /tmp/infra_contract.json --slurpfile edge /tmp/edge-outputs.json '
              .LoadBalancers | length == 1 and all(.[];
                .Scheme == "internal" and .Type == "application" and .State.Code == "active" and
                .VpcId == $infra[0].vpc_id and .LoadBalancerName == $edge[0].edge_contract.value.alb_name and
                .SecurityGroups == [$edge[0].edge_contract.value.alb_security_group_id])
            ' /tmp/edge-alb.json > /dev/null
            aws elbv2 describe-listeners --load-balancer-arn "$alb_arn" > /tmp/edge-alb-listeners.json
            listener_arn=$(jq -er '[.Listeners[] | select(.Protocol == "HTTP" and .Port == 80)] |
              if length == 1 then .[0].ListenerArn else error("Esperado exatamente um listener HTTP/80") end' \
              /tmp/edge-alb-listeners.json)
            alb_dns=$(jq -er '.LoadBalancers[0].DNSName' /tmp/edge-alb.json)
            printf '\n### ALB interno\n\nDNS: `%s`\n\nListener HTTP/80: `%s`\n' \
              "$alb_dns" "$listener_arn" | tee -a "$GITHUB_STEP_SUMMARY"
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Wait for healthy ALB targets
        if: inputs.mode == 'apply' && (inputs.stage == 'alb' || inputs.stage == 'business')
        env:
          KUBECONFIG: /tmp/edge-kubeconfig
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao verificar targets do ALB; todos os servicos devem ter target group e todos os groups devem ter targets healthy em ate 5 minutos."' ERR
          {
            alb_arn=$(jq -er '.LoadBalancers[0].LoadBalancerArn' /tmp/edge-alb.json)
            service_count=$(jq -er 'length | select(. > 0)' /tmp/edge-alb-services.json)
            deadline=$((SECONDS + 300))
            ready=false
            target_rows=()
            while (( SECONDS < deadline )); do
              remaining=$((deadline - SECONDS))
              timeout "${remaining}s" aws elbv2 describe-target-groups --load-balancer-arn "$alb_arn" \
                > /tmp/edge-alb-target-groups.json
              all_healthy=true
              target_rows=()
              group_count=$(jq -er '.TargetGroups | length' /tmp/edge-alb-target-groups.json)
              if (( group_count < service_count )); then all_healthy=false; fi
              jq -r '.TargetGroups[].TargetGroupArn' /tmp/edge-alb-target-groups.json > /tmp/edge-alb-target-group-arns.txt
              while IFS= read -r group_arn; do
                remaining=$((deadline - SECONDS))
                if (( remaining <= 0 )); then all_healthy=false; break; fi
                timeout "${remaining}s" aws elbv2 describe-target-health --target-group-arn "$group_arn" \
                  > /tmp/edge-alb-target-health.json
                total=$(jq -er '.TargetHealthDescriptions | length' /tmp/edge-alb-target-health.json)
                healthy=$(jq -er '[.TargetHealthDescriptions[] | select(.TargetHealth.State == "healthy")] | length' \
                  /tmp/edge-alb-target-health.json)
                target_rows+=("| ${group_arn} | ${healthy}/${total} |")
                if (( total == 0 || healthy != total )); then all_healthy=false; fi
              done < /tmp/edge-alb-target-group-arns.txt
              bindings='[]'
              while IFS= read -r namespace; do
                remaining=$((deadline - SECONDS))
                if (( remaining <= 0 )); then all_healthy=false; break; fi
                timeout "${remaining}s" kubectl get targetgroupbindings.elbv2.k8s.aws -n "$namespace" \
                  -o json --request-timeout=30s > /tmp/edge-alb-namespace-bindings.json
                bindings=$(jq -c --argjson existing "$bindings" '$existing + .items' /tmp/edge-alb-namespace-bindings.json)
              done < /tmp/edge-alb-namespaces.txt
              printf '%s\n' "$bindings" > /tmp/edge-alb-bindings.json
              if ! jq -e --slurpfile groups /tmp/edge-alb-target-groups.json --slurpfile bindings /tmp/edge-alb-bindings.json '
                all(.[]; . as $service | any($bindings[0][];
                  .metadata.namespace == $service.namespace and .spec.serviceRef.name == $service.service and
                  .spec.serviceRef.port == $service.port and
                  (.spec.targetGroupARN as $arn | any($groups[0].TargetGroups[]; .TargetGroupArn == $arn))))
              ' /tmp/edge-alb-services.json > /dev/null; then
                all_healthy=false
              fi
              if [[ "$all_healthy" == true ]] && (( SECONDS < deadline )); then ready=true; break; fi
              remaining=$((deadline - SECONDS))
              if (( remaining > 0 )); then sleep "$((remaining < 5 ? remaining : 5))"; fi
            done
            {
              printf '\n### Target groups ALB\n\nServicos derivados dos Ingresses: %s.\n\n' "$service_count"
              printf '| Target group | Targets healthy/total |\n| --- | --- |\n'
              if (( ${#target_rows[@]} > 0 )); then printf '%s\n' "${target_rows[@]}"; fi
            } | tee -a "$GITHUB_STEP_SUMMARY"
            if [[ "$ready" != true ]]; then
              echo '::error::ALB nao ficou pronto em ate 5 minutos: servico sem target group, group vazio ou target nao healthy.'
              exit 1
            fi
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Smoke test business
        if: inputs.mode == 'apply' && inputs.stage == 'business'
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no smoke test de negocio; confira status HTTP e corpos resumidos no log."' ERR
          {
            api=$(jq -er '.edge_contract | select(.sensitive == false) | .value.api_endpoint |
              select(type == "string" and startswith("https://"))' /tmp/edge-outputs.json)
            paths=(/api/v1/clientes /actuator/health /.well-known/jwks.json)
            statuses=(000 000 000)
            deadline=$((SECONDS + 120))
            ready=false
            attempt=0
            while (( SECONDS < deadline )); do
              attempt=$((attempt + 1))
              for index in "${!paths[@]}"; do
                remaining=$((deadline - SECONDS))
                if (( remaining <= 0 )); then break; fi
                : > /tmp/edge-business-smoke-body.txt
                if status=$(curl --silent --show-error --proto '=https' --connect-timeout 10 \
                  --max-time "$remaining" --output /tmp/edge-business-smoke-body.txt \
                  --write-out '%{http_code}' "${api%/}${paths[index]}"); then
                  statuses[index]=$status
                else
                  statuses[index]=${status:-000}
                fi
                body=$(head -c 512 /tmp/edge-business-smoke-body.txt | tr '\r\n' '  ')
                printf 'Tentativa %s; GET %s; status %s; corpo (ate 512 bytes): %s\n' \
                  "$attempt" "${paths[index]}" "${statuses[index]}" "$body"
              done
              if [[ ( "${statuses[0]}" == 401 || "${statuses[0]}" == 403 ) &&
                "${statuses[1]}" == 404 && "${statuses[2]}" == 200 ]]; then
                ready=true
                break
              fi
              if [[ "${statuses[0]}" == 2?? ]]; then break; fi
              remaining=$((deadline - SECONDS))
              if (( remaining > 0 )); then sleep "$((remaining < 5 ? remaining : 5))"; fi
            done
            {
              printf '\n### Smoke test business\n\n| Rota GET | Esperado | Obtido |\n| --- | --- | --- |\n'
              printf '| /api/v1/clientes sem Authorization | 401 ou 403 | %s |\n' "${statuses[0]}"
              printf '| /actuator/health | 404 | %s |\n' "${statuses[1]}"
              printf '| /.well-known/jwks.json | 200 | %s |\n' "${statuses[2]}"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            if [[ "$ready" != true ]]; then
              case "${statuses[0]}" in
                401|403) ;;
                404) echo '::error::rota nao publicada no API Gateway: GET /api/v1/clientes permaneceu 404.' ;;
                502|503|504) echo '::error::VPC Link/ALB/pod inacessivel: GET /api/v1/clientes retornou erro de integracao.' ;;
                2??) echo '::error::rota de negocio sem autenticacao: GET /api/v1/clientes aceitou requisicao sem Authorization.' ;;
                *) echo "::error::Status inesperado em GET /api/v1/clientes: ${statuses[0]}." ;;
              esac
              if [[ "${statuses[1]}" != 404 ]]; then
                echo "::error::GET /actuator/health deve permanecer nao publicado (404); obtido ${statuses[1]}."
              fi
              if [[ "${statuses[2]}" != 200 ]]; then
                echo "::error::GET /.well-known/jwks.json deve continuar 200; obtido ${statuses[2]}."
              fi
              exit 1
            fi
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Failure diagnostics
        if: failure()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          CREDENTIALS_OUTCOME: ${{ steps.credentials.outcome }}
          TERRAFORM_OUTCOME: ${{ steps.terraform.outcome }}
          RELEASE_OUTCOME: ${{ steps.auth_release.outcome }}
          OUTPUTS_OUTCOME: ${{ steps.outputs.outcome }}
          KUBECONFIG: /tmp/edge-kubeconfig
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao registrar diagnosticos de edge."' ERR
          for action in CHECKOUT CREDENTIALS TERRAFORM RELEASE OUTPUTS; do
            outcome_variable="${action}_OUTCOME"
            if [[ "${!outcome_variable}" == failure ]]; then
              echo "::error::Falha na action ${action}; confira checkout, OIDC, instalacao do Terraform ou transferencia de artifacts conforme o passo indicado."
            fi
          done
          {
            printf '\n### Last 200 log lines\n\n```text\n'
            if test -f "$EDGE_LOG"; then tail -n 200 "$EDGE_LOG"; fi
            printf '```\n'
            lambda_name=''
            if test -s /tmp/edge-outputs.json; then
              lambda_name=$(jq -r '
                [.lambda_function_name?, .auth_lambda_function_name?,
                  (.edge_contract? | select(.sensitive == false) | .value |
                    {sensitive: false, value: (.lambda_function_name? // .auth_lambda_function_name?)})] |
                map(select(.sensitive == false and (.value | type == "string" and length > 0))) |
                .[0].value // empty
              ' /tmp/edge-outputs.json) || lambda_name=''
            fi
            if [[ -n "$lambda_name" ]]; then
              printf '\n### Lambda: ultimas 50 linhas\n\n```text\n'
              aws logs tail "/aws/lambda/${lambda_name}" --since 1h --format short 2>&1 | tail -n 50 || \
                echo '::error::Nao foi possivel consultar o log group da Lambda.'
              printf '```\n'
            else
              printf '\nDiagnostico Lambda pulado: nome nao disponivel nos outputs do edge.\n'
            fi
            if [[ "$EDGE_STAGE" == alb || "$EDGE_STAGE" == business ]]; then
              printf '\n### Diagnosticos ALB\n\n```text\n'
              if test -s /tmp/infra_contract.json; then
                if cluster_name=$(jq -er '.eks.name' /tmp/infra_contract.json); then
                  aws eks update-kubeconfig --name "$cluster_name" --region "$AWS_REGION" || \
                    echo '::error::Nao foi possivel preparar kubeconfig para diagnosticos ALB.'
                fi
                if alb_name=$(jq -er '.name_prefix + "-edge"' /tmp/infra_contract.json) &&
                  aws elbv2 describe-load-balancers --names "$alb_name" > /tmp/edge-diagnostic-alb.json &&
                  alb_arn=$(jq -er '.LoadBalancers[0].LoadBalancerArn' /tmp/edge-diagnostic-alb.json) &&
                  aws elbv2 describe-target-groups --load-balancer-arn "$alb_arn" > /tmp/edge-diagnostic-groups.json; then
                  while IFS= read -r group_arn; do
                    printf '\nTarget group: %s\n' "$group_arn"
                    if aws elbv2 describe-target-health --target-group-arn "$group_arn" > /tmp/edge-diagnostic-health.json; then
                      cat /tmp/edge-diagnostic-health.json
                      jq '[.TargetHealthDescriptions[] | select(.TargetHealth.State != "healthy") |
                        {Target: .Target, State: .TargetHealth.State, Reason: .TargetHealth.Reason,
                          Description: .TargetHealth.Description}]' /tmp/edge-diagnostic-health.json
                    else
                      echo "::error::Nao foi possivel consultar targets de ${group_arn}."
                    fi
                  done < <(jq -r '.TargetGroups[].TargetGroupArn' /tmp/edge-diagnostic-groups.json)
                else
                  echo '::error::Nao foi possivel descobrir ALB/target groups para diagnosticos.'
                fi
              fi
              kubectl get ingress -A --request-timeout=30s || echo '::error::Nao foi possivel listar Ingresses.'
              kubectl describe ingress -A --request-timeout=30s || echo '::error::Nao foi possivel descrever Ingresses.'
              kubectl logs -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller \
                --tail=100 --all-containers=true --request-timeout=30s || \
                echo '::error::Nao foi possivel obter logs do ALB Controller.'
              printf '```\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY" 2>&1
