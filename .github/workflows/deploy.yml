name: Deploy

on:
  workflow_dispatch:
    inputs:
      services_ref:
        description: Branch, tag or commit in the public service repositories
        type: string
        default: homolog
      mercado_pago_secret_arn:
        description: ARN do segredo Mercado Pago
        type: string
        required: true
      smoke_secret_arn:
        description: ARN do segredo de smoke
        type: string
        required: true

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: phase4-demo-a-mutation
  cancel-in-progress: false

jobs:
  resolve:
    name: 1 Resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    outputs:
      os_sha: ${{ steps.revisions.outputs.os_sha }}
      execution_sha: ${{ steps.revisions.outputs.execution_sha }}
      billing_sha: ${{ steps.revisions.outputs.billing_sha }}
      auth_sha: ${{ steps.revisions.outputs.auth_sha }}
    env:
      AWS_REGION: us-east-1
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AWS_PAGER: ''
      SERVICES_REF: ${{ inputs.services_ref }}
      MERCADO_PAGO_SECRET_ARN: ${{ inputs.mercado_pago_secret_arn }}
      SMOKE_SECRET_ARN: ${{ inputs.smoke_secret_arn }}
      RESOLVE_LOG: /tmp/resolve.log
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validar AWS_ROLE_ARN
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::AWS_ROLE_ARN ausente ou invalido; configure a variavel de repositorio com um ARN de role IAM."' ERR
          {
            test -n "$AWS_ROLE_ARN"
            [[ "$AWS_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$ ]]
          } 2>&1 | tee -a "$RESOLVE_LOG"

      - name: Credenciais AWS OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: resolve-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: us-east-1
          role-duration-seconds: 14400
          unset-current-credentials: true

      - name: Validar identidade e catalogo
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao validar conta/regiao do catalogo ou identidade STS da role AWS_ROLE_ARN."' ERR
          {
            catalog=phase4/environments/catalog.json
            account_id=$(aws sts get-caller-identity --query Account --output text)
            caller_arn=$(aws sts get-caller-identity --query Arn --output text)
            jq -e --arg account "$account_id" --arg region "$AWS_REGION" '
              .environments["demo-a"] | .aws_account_id == $account and .aws_region == $region
            ' "$catalog" > /dev/null
            [[ "$AWS_ROLE_ARN" =~ ^arn:aws:iam::${account_id}:role/[A-Za-z0-9+=,.@_/-]+$ ]]
            role_name=${AWS_ROLE_ARN##*/}
            [[ "$caller_arn" == "arn:aws:sts::${account_id}:assumed-role/${role_name}/"* ]]
            state_bucket=$(jq -er '.environments["demo-a"].backend_bucket' "$catalog")
            printf 'ACCOUNT_ID=%s\nSTATE_BUCKET=%s\n' "$account_id" "$state_bucket" >> "$GITHUB_ENV"
          } 2>&1 | tee -a "$RESOLVE_LOG"

      - name: Validar ARNs e existencia dos segredos de entrada
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao validar os ARNs ou consultar os metadados dos segredos de entrada; nenhum valor foi lido."' ERR
          {
            account_id="$ACCOUNT_ID"
            secret_pattern="^arn:aws:secretsmanager:${AWS_REGION}:${account_id}:secret:[A-Za-z0-9/_+=.@!-]+-[A-Za-z0-9]{6}$"
            for input_name in MERCADO_PAGO_SECRET_ARN SMOKE_SECRET_ARN; do
              secret_arn=${!input_name}
              if [[ ! "$secret_arn" =~ $secret_pattern ]]; then
                echo "::error::${input_name}: ARN invalido para a conta/regiao do catalogo."
                exit 1
              fi
              if ! aws secretsmanager describe-secret --secret-id "$secret_arn" > /dev/null; then
                echo "::error::${input_name}: segredo inexistente ou sem permissao para describe-secret."
                exit 1
              fi
            done
          } 2>&1 | tee -a "$RESOLVE_LOG"

      - name: Verificar segredo auth-signing
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao verificar a existencia do segredo auth-signing."' ERR
          {
            if aws secretsmanager describe-secret --secret-id /oficina/phase4/demo-a/auth-signing \
              > /dev/null 2> /tmp/resolve-auth-signing.err; then
              echo 'Segredo auth-signing existente.'
            elif grep -q 'ResourceNotFoundException' /tmp/resolve-auth-signing.err; then
              echo '::error::O segredo /oficina/phase4/demo-a/auth-signing nao existe; crie-o antes de executar o deploy.'
              exit 1
            else
              cat /tmp/resolve-auth-signing.err
              echo '::warning::Nao foi possivel confirmar auth-signing por describe-secret; erro diferente de ResourceNotFoundException.'
            fi
          } 2>&1 | tee -a "$RESOLVE_LOG"

      - name: Verificar buckets de artefatos e state
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Bucket de artefatos ou de state inexistente ou inacessivel; verifique head-bucket na conta do catalogo."' ERR
          {
            aws s3api head-bucket --bucket tc-oficina-p4-demo-a-artifacts --expected-bucket-owner "$ACCOUNT_ID"
            aws s3api head-bucket --bucket "$STATE_BUCKET" --expected-bucket-owner "$ACCOUNT_ID"
          } 2>&1 | tee -a "$RESOLVE_LOG"

      - name: Resolver SHAs dos servicos
        id: revisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao resolver services_ref em um SHA completo para um dos quatro repositorios."' ERR
          {
            test -n "$SERVICES_REF"
            printf '### Revisions\n\n| repo | ref | sha |\n|---|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
            for service in os execution billing auth; do
              case "$service" in
                os) repository=AuroNet0/tech-challenge-oficina-os-service ;;
                execution) repository=AuroNet0/tech-challenge-oficina-execution-service ;;
                billing) repository=AuroNet0/tech-challenge-oficina-billing-service ;;
                auth) repository=AuroNet0/tech-challenge-oficina-auth ;;
              esac
              sha=$(gh api "repos/${repository}/commits/${SERVICES_REF}" --jq .sha)
              if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::SHA invalido ao resolver ${repository} para services_ref."
                exit 1
              fi
              printf '%s_sha=%s\n' "$service" "$sha" >> "$GITHUB_OUTPUT"
              printf '| %s | %s | `%s` |\n' "$repository" "$SERVICES_REF" "$sha" >> "$GITHUB_STEP_SUMMARY"
            done
          } 2>&1 | tee -a "$RESOLVE_LOG"

      - name: Failure diagnostics
        if: failure()
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao registrar os diagnosticos de resolve."' ERR
          {
            echo '::group::Failure diagnostics'
            {
              printf '### Last 200 log lines\n\n```text\n'
              if test -f "$RESOLVE_LOG"; then tail -n 200 "$RESOLVE_LOG"; fi
              printf '```\n'
            } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
            echo '::endgroup::'
          } 2>&1 | tee -a "$RESOLVE_LOG"

  infra:
    name: 2 Infra
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
        working-directory: phase4/stacks/infra
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_WORKSPACE: default
      AWS_REGION: us-east-1
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      INFRA_ACTION: apply
      INFRA_LOG: /tmp/infra.log
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validar AWS_ROLE_ARN
        run: |
          set -euo pipefail
          {
            echo '::group::Validar AWS_ROLE_ARN'
            test -n "$AWS_ROLE_ARN" || { echo '::error::Configure a variavel de repositorio AWS_ROLE_ARN'; exit 1; }
            echo '::endgroup::'
          } 2>&1 | tee -a "$INFRA_LOG"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: infra-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: us-east-1
          role-duration-seconds: 14400
          unset-current-credentials: true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Generate Terraform inputs
        run: |
          set -euo pipefail
          {
            echo '::group::Generate Terraform inputs'
            identity=$(aws sts get-caller-identity --output json)
            account_id=$(jq -er '.Account' <<< "$identity")
            caller_arn=$(jq -er '.Arn' <<< "$identity")
            [[ "$AWS_ROLE_ARN" =~ ^arn:aws:iam::${account_id}:role/[A-Za-z0-9+=,.@_/-]+$ ]]
            role_name=${AWS_ROLE_ARN##*/}
            [[ "$caller_arn" == "arn:aws:sts::${account_id}:assumed-role/${role_name}/"* ]]
            jq -n \
              --arg account_id "$account_id" \
              --arg revision "0000000000000000000000000000000000000000" \
              --arg role_arn "$AWS_ROLE_ARN" \
              '{environment_id: "demo-a", aws_region: "us-east-1",
                aws_account_id: $account_id, git_revision: $revision,
                availability_zones: ["us-east-1a", "us-east-1b"],
                eks_admin_role_arn: $role_arn,
                eks_public_access_cidrs: ["0.0.0.0/0"],
                node_count: 2}' > tfvars.json
            echo '::endgroup::'
          } 2>&1 | tee -a "$INFRA_LOG"

      - name: Terraform init
        run: |
          set -euo pipefail
          {
            echo '::group::Terraform init'
            terraform init -input=false -no-color \
              -backend-config=bucket=tech-challenge-oficina-terraform-state-b1cfa326 \
              -backend-config=key=phase4/environments/demo-a/infra.tfstate \
              -backend-config=region=us-east-1 \
              -backend-config=encrypt=true \
              -backend-config=use_lockfile=true
            echo '::endgroup::'
          } 2>&1 | tee -a "$INFRA_LOG"

      - name: Terraform fmt
        run: |
          set -euo pipefail
          {
            echo '::group::Terraform fmt'
            terraform fmt -check -diff
            echo '::endgroup::'
          } 2>&1 | tee -a "$INFRA_LOG"

      - name: Terraform validate
        run: |
          set -euo pipefail
          {
            echo '::group::Terraform validate'
            terraform validate -no-color
            echo '::endgroup::'
          } 2>&1 | tee -a "$INFRA_LOG"

      - name: Terraform plan
        run: |
          set -euo pipefail
          {
            echo '::group::Terraform plan'
            terraform plan -input=false -no-color -lock-timeout=5m \
              -var-file=tfvars.json -out=tfplan
            terraform show -no-color tfplan > plan.txt
            echo '::endgroup::'
          } 2>&1 | tee -a "$INFRA_LOG"

      - name: Terraform apply
        run: |
          set -euo pipefail
          {
            echo '::group::Terraform apply'
            terraform apply -input=false -no-color -lock-timeout=5m tfplan
            echo '::endgroup::'
          } 2>&1 | tee -a "$INFRA_LOG"

      - name: Verify cluster access
        run: |
          set -euo pipefail
          {
            echo '::group::Verify cluster access'
            aws eks update-kubeconfig --name tc-oficina-p4-demo-a --region us-east-1
            kubectl get nodes -o wide
            kubectl auth can-i '*' '*' --all-namespaces
            kubectl get pods -A
            echo '::endgroup::'
          } 2>&1 | tee -a "$INFRA_LOG"

      - name: Upload plan and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infra-${{ env.INFRA_ACTION }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            phase4/stacks/infra/plan.txt
            /tmp/infra.log
          if-no-files-found: warn
          retention-days: 7

      - name: Failure diagnostics
        if: failure()
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          {
            echo '::group::Failure diagnostics'
            {
              printf '### Terraform state list\n\n```text\n'
              if command -v terraform >/dev/null && test -d phase4/stacks/infra; then
                terraform -chdir=phase4/stacks/infra state list -no-color || true
              else
                echo 'Terraform or checkout unavailable.'
              fi
              printf '```\n\n### Last 200 log lines\n\n```text\n'
              if test -f "$INFRA_LOG"; then tail -n 200 "$INFRA_LOG"; fi
              printf '```\n'
            } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
            echo '::endgroup::'
          } 2>&1 | tee -a "$INFRA_LOG"

  auth_artifact:
    name: 2 Auth artifact
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      AWS_REGION: us-east-1
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ARTIFACT_BUCKET: tc-oficina-p4-demo-a-artifacts
      LAYER_NAME: tc-oficina-p4-demo-a-auth-bootstrap
      AUTH_JAR: auth/target/tech-challenge-oficina-auth.jar
      ARTIFACT_LOG: /tmp/auth-artifact.log
    steps:
      - name: Checkout infra
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout Auth
        uses: actions/checkout@v4
        with:
          repository: AuroNet0/tech-challenge-oficina-auth
          ref: ${{ needs.resolve.outputs.auth_sha }}
          path: auth
          persist-credentials: false

      - name: Record revisions
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao registrar os SHAs completos da infra e do Auth ou AWS_ROLE_ARN ausente."' ERR
          {
            echo '::group::Record revisions'
            test -n "$AWS_ROLE_ARN"
            infra_sha=$(git rev-parse HEAD)
            auth_sha=$(git -C auth rev-parse HEAD)
            [[ "$infra_sha" =~ ^[0-9a-f]{40}$ ]]
            [[ "$auth_sha" =~ ^[0-9a-f]{40}$ ]]
            printf 'INFRA_SHA=%s\nAUTH_SHA=%s\n' "$infra_sha" "$auth_sha" >> "$GITHUB_ENV"
            printf 'Infra SHA: %s\nAuth SHA: %s\n' "$infra_sha" "$auth_sha"
            printf '### Sources\n\nInfra: `%s`\n\nAuth: `%s`\n' "$infra_sha" "$auth_sha" >> "$GITHUB_STEP_SUMMARY"
            echo '::endgroup::'
          } 2>&1 | tee -a "$ARTIFACT_LOG"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: auth-artifact-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: us-east-1
          role-duration-seconds: 14400
          unset-current-credentials: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            auth/pom.xml
            phase4/stacks/edge/lambda-bootstrap/pom.xml

      - name: Ensure owned artifact bucket
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao preparar o bucket de artefatos; confira propriedade, regiao e permissoes S3."' ERR
          {
            echo '::group::Ensure owned artifact bucket'
            account_id=$(aws sts get-caller-identity --query Account --output text)
            [[ "$account_id" =~ ^[0-9]{12}$ ]]
            printf 'AWS_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
            if aws s3api head-bucket --bucket "$ARTIFACT_BUCKET" --expected-bucket-owner "$account_id" \
              2>/tmp/auth-artifact-bucket.err; then
              echo "Bucket existente e pertencente a conta STS: $ARTIFACT_BUCKET"
            elif grep -Eq '\((404|NoSuchBucket|NotFound)\)' /tmp/auth-artifact-bucket.err; then
              if ! aws s3api create-bucket --bucket "$ARTIFACT_BUCKET" --region us-east-1 \
                2>/tmp/auth-artifact-bucket.err; then
                cat /tmp/auth-artifact-bucket.err
                echo '::error::Nao foi possivel criar o bucket; se o nome pertencer a outra conta, ele nao pode ser usado.'
                exit 1
              fi
              aws s3api head-bucket --bucket "$ARTIFACT_BUCKET" --expected-bucket-owner "$account_id"
            else
              cat /tmp/auth-artifact-bucket.err
              echo '::error::Propriedade do bucket nao confirmada: nome de outra conta ou acesso negado. Nenhuma configuracao sera alterada.'
              exit 1
            fi
            location=$(aws s3api get-bucket-location --bucket "$ARTIFACT_BUCKET" \
              --expected-bucket-owner "$account_id" --query LocationConstraint --output text)
            [[ "$location" == None || "$location" == null || "$location" == us-east-1 ]]
            aws s3api put-bucket-versioning --bucket "$ARTIFACT_BUCKET" --expected-bucket-owner "$account_id" \
              --versioning-configuration Status=Enabled
            aws s3api put-public-access-block --bucket "$ARTIFACT_BUCKET" --expected-bucket-owner "$account_id" \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
            aws s3api put-bucket-encryption --bucket "$ARTIFACT_BUCKET" --expected-bucket-owner "$account_id" \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api get-bucket-versioning --bucket "$ARTIFACT_BUCKET" --expected-bucket-owner "$account_id" |
              jq -e '.Status == "Enabled"'
            aws s3api get-public-access-block --bucket "$ARTIFACT_BUCKET" --expected-bucket-owner "$account_id" |
              jq -e '.PublicAccessBlockConfiguration | .BlockPublicAcls and .IgnorePublicAcls and .BlockPublicPolicy and .RestrictPublicBuckets'
            aws s3api get-bucket-encryption --bucket "$ARTIFACT_BUCKET" --expected-bucket-owner "$account_id" |
              jq -e '.ServerSideEncryptionConfiguration.Rules | length > 0 and all(.[]; .ApplyServerSideEncryptionByDefault.SSEAlgorithm == "AES256")'
            echo '::endgroup::'
          } 2>&1 | tee -a "$ARTIFACT_LOG"

      - name: Build Auth JAR
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no build do Auth; deve existir exatamente um JAR final chamado tech-challenge-oficina-auth.jar."' ERR
          {
            echo '::group::Build Auth JAR'
            mvn -B -ntp -f auth/pom.xml clean package -DskipTests
            mapfile -t jars < <(find auth/target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*' -print)
            [[ "${#jars[@]}" == 1 && "${jars[0]}" == "$AUTH_JAR" ]]
            test -s "$AUTH_JAR"
            echo '::endgroup::'
          } 2>&1 | tee -a "$ARTIFACT_LOG"

      - name: Validate RDS CA bundle
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no download TLS ou validacao X.509/expiracao do bundle RDS."' ERR
          {
            echo '::group::Validate RDS CA bundle'
            curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
              --connect-timeout 15 --max-time 60 \
              https://truststore.pki.rds.amazonaws.com/us-east-1/us-east-1-bundle.pem \
              -o /tmp/auth-artifact-rds-ca.pem
            mkdir -p /tmp/auth-artifact-certificates
            awk -v directory=/tmp/auth-artifact-certificates '
              /^-----BEGIN CERTIFICATE-----\r?$/ {
                if (inside) { invalid = 1; exit 1 }
                inside = 1; count++
                destination = sprintf("%s/certificate-%03d.pem", directory, count)
              }
              /-----BEGIN / && !/^-----BEGIN CERTIFICATE-----\r?$/ { invalid = 1; exit 1 }
              /-----END / && !/^-----END CERTIFICATE-----\r?$/ { invalid = 1; exit 1 }
              inside { print > destination }
              /^-----END CERTIFICATE-----\r?$/ {
                if (!inside) { invalid = 1; exit 1 }
                close(destination); inside = 0; next
              }
              !inside && /[^[:space:]]/ { invalid = 1; exit 1 }
              END { if (invalid || inside || count < 1) exit 1 }
            ' /tmp/auth-artifact-rds-ca.pem
            for certificate in /tmp/auth-artifact-certificates/certificate-*.pem; do
              openssl x509 -in "$certificate" -noout
              openssl x509 -in "$certificate" -noout -checkend 0
            done
            sha256sum /tmp/auth-artifact-rds-ca.pem
            printf '\n### RDS CA\n\nsem checksum pinado (decisão para demo)\n' >> "$GITHUB_STEP_SUMMARY"
            echo '::endgroup::'
          } 2>&1 | tee -a "$ARTIFACT_LOG"

      - name: Build bootstrap layer
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao compilar ou empacotar a layer bootstrap Java 21."' ERR
          {
            echo '::group::Build bootstrap layer'
            mvn -B -ntp -f phase4/stacks/edge/lambda-bootstrap/pom.xml clean package
            mkdir -p /tmp/auth-artifact-layer/bin /tmp/auth-artifact-layer/java/lib \
              /tmp/auth-artifact-layer/auth-home/.postgresql
            sed 's/\r$//' phase4/stacks/edge/lambda-bootstrap/bin/auth-bootstrap \
              > /tmp/auth-artifact-layer/bin/auth-bootstrap
            chmod 0755 /tmp/auth-artifact-layer/bin/auth-bootstrap
            install -m 0644 phase4/stacks/edge/lambda-bootstrap/target/auth-bootstrap.jar \
              /tmp/auth-artifact-layer/java/lib/auth-bootstrap.jar
            install -m 0644 /tmp/auth-artifact-rds-ca.pem /tmp/auth-artifact-layer/auth-home/.postgresql/root.crt
            test "$(stat -c '%a' /tmp/auth-artifact-layer/bin/auth-bootstrap)" = 755
            test "$(head -n 1 /tmp/auth-artifact-layer/bin/auth-bootstrap)" = '#!/bin/bash'
            if LC_ALL=C grep -q $'\r' /tmp/auth-artifact-layer/bin/auth-bootstrap; then
              echo '::error::O wrapper da layer deve usar somente finais de linha LF.'
              exit 1
            fi
            bash -n /tmp/auth-artifact-layer/bin/auth-bootstrap
            (
              cd /tmp/auth-artifact-layer
              zip -X /tmp/layer.zip bin/auth-bootstrap java/lib/auth-bootstrap.jar auth-home/.postgresql/root.crt
            )
            unzip -t /tmp/layer.zip
            echo '::endgroup::'
          } 2>&1 | tee -a "$ARTIFACT_LOG"

      - name: Publish and verify versioned Auth JAR
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao publicar ou verificar a versao S3 do JAR; VersionId real e SHA256 identico sao obrigatorios."' ERR
          {
            echo '::group::Publish and verify versioned Auth JAR'
            key="auth/${AUTH_SHA}/auth.jar"
            jar_checksum=$(openssl dgst -sha256 -binary "$AUTH_JAR" | openssl base64 -A)
            aws s3api put-object --bucket "$ARTIFACT_BUCKET" --expected-bucket-owner "$AWS_ACCOUNT_ID" \
              --key "$key" --body "$AUTH_JAR" --server-side-encryption AES256 \
              --checksum-algorithm SHA256 --checksum-sha256 "$jar_checksum" > /tmp/auth-artifact-upload.json
            version_id=$(jq -er '.VersionId | select(type == "string" and length > 0 and . != "null")' /tmp/auth-artifact-upload.json)
            aws s3api get-object --bucket "$ARTIFACT_BUCKET" --expected-bucket-owner "$AWS_ACCOUNT_ID" \
              --key "$key" --version-id "$version_id" /tmp/auth-artifact-readback.jar > /tmp/auth-artifact-readback.json
            jq -e --arg version "$version_id" '.VersionId == $version' /tmp/auth-artifact-readback.json
            readback_checksum=$(openssl dgst -sha256 -binary /tmp/auth-artifact-readback.jar | openssl base64 -A)
            [[ "$jar_checksum" == "$readback_checksum" ]]
            printf 'JAR_SHA256_BASE64=%s\n' "$jar_checksum" >> "$GITHUB_ENV"
            echo '::endgroup::'
          } 2>&1 | tee -a "$ARTIFACT_LOG"

      - name: Publish and verify bootstrap layer
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao publicar a layer ou verificar Content.CodeSha256 da versao publicada."' ERR
          {
            echo '::group::Publish and verify bootstrap layer'
            layer_checksum=$(openssl dgst -sha256 -binary /tmp/layer.zip | openssl base64 -A)
            aws lambda publish-layer-version --layer-name "$LAYER_NAME" --zip-file fileb:///tmp/layer.zip \
              --description "phase4-demo-a:${INFRA_SHA}" --compatible-runtimes java21 \
              --compatible-architectures x86_64 > /tmp/auth-artifact-layer-published.json
            layer_arn=$(jq -er '.LayerVersionArn' /tmp/auth-artifact-layer-published.json)
            version=$(jq -er '.Version | select(type == "number" and . > 0 and floor == .)' /tmp/auth-artifact-layer-published.json)
            aws lambda get-layer-version --layer-name "$LAYER_NAME" --version-number "$version" \
              > /tmp/auth-artifact-layer-verified.json
            jq -e --arg checksum "$layer_checksum" --arg arn "$layer_arn" \
              '.Content.CodeSha256 == $checksum and .LayerVersionArn == $arn' /tmp/auth-artifact-layer-verified.json
            echo '::endgroup::'
          } 2>&1 | tee -a "$ARTIFACT_LOG"

      - name: Generate validated auth_release.json
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao gerar auth_release.json; os sete campos devem atender ao contrato exato do edge."' ERR
          {
            echo '::group::Generate validated auth_release.json'
            version_id=$(jq -er '.VersionId' /tmp/auth-artifact-upload.json)
            layer_arn=$(jq -er '.LayerVersionArn' /tmp/auth-artifact-layer-verified.json)
            jq -en --arg bucket "$ARTIFACT_BUCKET" --arg revision "$AUTH_SHA" \
              --arg key "auth/${AUTH_SHA}/auth.jar" --arg version_id "$version_id" \
              --arg sha256_base64 "$JAR_SHA256_BASE64" --arg bootstrap_revision "$INFRA_SHA" \
              --arg bootstrap_layer_arn "$layer_arn" --arg account "$AWS_ACCOUNT_ID" --arg region "$AWS_REGION" '
              {bucket: $bucket, revision: $revision, key: $key, version_id: $version_id,
                sha256_base64: $sha256_base64, bootstrap_revision: $bootstrap_revision,
                bootstrap_layer_arn: $bootstrap_layer_arn} |
              if .bucket == "tc-oficina-p4-demo-a-artifacts" and
                (.revision | test("^[0-9a-f]{40}$")) and .key == ("auth/" + .revision + "/auth.jar") and
                (.version_id | length > 0) and .version_id != "null" and
                (.sha256_base64 | test("^[A-Za-z0-9+/]{43}=$")) and
                (.bootstrap_revision | test("^[0-9a-f]{40}$")) and
                (.bootstrap_layer_arn | test("^arn:aws:lambda:" + $region + ":" + $account +
                  ":layer:tc-oficina-p4-demo-a-auth-bootstrap:[1-9][0-9]*$"))
              then . else error("auth_release rejeitado pelo contrato edge") end
            ' > /tmp/auth_release.json
            {
              printf '\n### auth_release.json\n\n```json\n'
              cat /tmp/auth_release.json
              printf '```\n'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo '::endgroup::'
          } 2>&1 | tee -a "$ARTIFACT_LOG"

      - name: Upload auth_release.json
        uses: actions/upload-artifact@v4
        with:
          name: auth_release.json
          path: /tmp/auth_release.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-artifact-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/auth-artifact.log
          if-no-files-found: warn
          retention-days: 7

      - name: Failure diagnostics
        if: failure()
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao registrar os diagnosticos de auth-artifact."' ERR
          {
            echo '::group::Failure diagnostics'
            {
              printf '### Last 200 log lines\n\n```text\n'
              if test -f "$ARTIFACT_LOG"; then tail -n 200 "$ARTIFACT_LOG"; fi
              printf '```\n'
            } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
            echo '::endgroup::'
          } 2>&1 | tee -a "$ARTIFACT_LOG"

  images:
    name: 3 Imagens (${{ matrix.service }})
    needs: [infra, resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: os
            sha: ${{ needs.resolve.outputs.os_sha }}
            repository: AuroNet0/tech-challenge-oficina-os-service
            ecr: tc-oficina-p4-demo-a-os
          - service: execution
            sha: ${{ needs.resolve.outputs.execution_sha }}
            repository: AuroNet0/tech-challenge-oficina-execution-service
            ecr: tc-oficina-p4-demo-a-execution
          - service: billing
            sha: ${{ needs.resolve.outputs.billing_sha }}
            repository: AuroNet0/tech-challenge-oficina-billing-service
            ecr: tc-oficina-p4-demo-a-billing
          - service: auth
            sha: ${{ needs.resolve.outputs.auth_sha }}
            repository: AuroNet0/tech-challenge-oficina-auth
            ecr: tc-oficina-p4-demo-a-auth
    defaults:
      run:
        shell: bash
    env:
      AWS_REGION: us-east-1
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      SERVICE: ${{ matrix.service }}
      SERVICE_REPOSITORY: ${{ matrix.repository }}
      ECR_REPOSITORY: ${{ matrix.ecr }}
      IMAGES_LOG: /tmp/images-${{ matrix.service }}.log
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.sha }}
          persist-credentials: false

      - name: Inspect service build
        run: |
          set -euo pipefail
          {
            echo '::group::Inspect service build'
            test -n "$AWS_ROLE_ARN" || { echo '::error::Configure a variavel de repositorio AWS_ROLE_ARN'; exit 1; }
            mkdir -p /tmp/images
            nl -ba Dockerfile
            grep -Eiq '^FROM .+ AS build[[:space:]]*$' Dockerfile
            grep -Eiq '^COPY --from=build[[:space:]]' Dockerfile || {
              echo '::error::Dockerfile difere do build multi-stage validado; revise o servico sem modifica-lo aqui.'
              exit 1
            }
            {
              printf '### %s build\n\n' "$SERVICE"
              printf 'Source: `%s@%s`.\n\n' "$SERVICE_REPOSITORY" "$(git rev-parse HEAD)"
              case "$SERVICE" in
                os) echo 'Dockerfile:1-17: multi-stage Java 21; Maven wrapper packages the JAR inside Docker.' ;;
                execution) echo 'Dockerfile:1-18: multi-stage Java 21; Maven wrapper packages the JAR inside Docker.' ;;
                billing) echo 'Dockerfile:1-12: multi-stage Java 21; Maven wrapper packages the JAR inside Docker.' ;;
                auth) echo 'Dockerfile:1-11: Maven 3.9.9 / Java 21 build stage; packages the JAR inside Docker.' ;;
              esac
              printf '\nDirect docker build; no host Maven step required.\n'
            } >> "$GITHUB_STEP_SUMMARY"
            echo '::endgroup::'
          } 2>&1 | tee -a "$IMAGES_LOG"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: images-${{ matrix.service }}-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: us-east-1
          role-duration-seconds: 14400
          unset-current-credentials: true

      - uses: docker/setup-buildx-action@v3

      - name: Build or reuse immutable ECR image
        run: |
          set -euo pipefail
          {
            echo '::group::Build or reuse immutable ECR image'
            account_id=$(aws sts get-caller-identity --query Account --output text)
            [[ "$account_id" =~ ^[0-9]{12}$ ]]
            registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
            revision=$(git rev-parse HEAD)
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
            image="${registry}/${ECR_REPOSITORY}:${revision}"
            if digest=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
              --image-ids "imageTag=$revision" --query 'imageDetails[0].imageDigest' \
              --output text 2>/tmp/ecr-lookup.err); then
              echo "Reusing existing tag $image"
            elif grep -q '(ImageNotFoundException)' /tmp/ecr-lookup.err; then
              aws ecr get-login-password --region "$AWS_REGION" | \
                docker login --username AWS --password-stdin "$registry"
              docker build --tag "$image" .
              docker push "$image"
              digest=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
                --image-ids "imageTag=$revision" --query 'imageDetails[0].imageDigest' --output text)
            else
              cat /tmp/ecr-lookup.err
              exit 1
            fi
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            reference="${registry}/${ECR_REPOSITORY}@${digest}"
            jq -n --arg service "$SERVICE" --arg image "$reference" \
              '{($service): $image}' > "/tmp/images/${SERVICE}.json"
            echo "$reference"
            printf '\nImage: `%s`\n' "$reference" >> "$GITHUB_STEP_SUMMARY"
            echo '::endgroup::'
          } 2>&1 | tee -a "$IMAGES_LOG"

      - name: Resolve compose dependency digests
        if: matrix.service == 'os' || matrix.service == 'execution'
        run: |
          set -euo pipefail
          {
            echo '::group::Resolve compose dependency digests'
            if [[ "$SERVICE" == os ]]; then
              dependencies=(postgres rabbitmq)
            else
              dependencies=(mongodb)
            fi
            for dependency in "${dependencies[@]}"; do
              source=$(awk -v service="$dependency" '
                $0 == "  " service ":" { selected = 1; next }
                selected && /^  [^ ]/ { exit }
                selected && /^    image: / { print NR ":" $2; exit }
              ' compose.yaml)
              test -n "$source"
              line=${source%%:*}
              tag=${source#*:}
              case "$dependency:$tag" in
                mongodb:mongo:8.0|rabbitmq:rabbitmq:4-management-alpine|postgres:postgres:17-alpine) ;;
                *) echo "::error::Imagem compose nao validada $dependency=$tag; revise o SHA resolvido do servico"; exit 1 ;;
              esac
              image_name=${tag%%:*}
              docker buildx imagetools inspect "docker.io/library/${tag}" > /tmp/dependency-inspect.txt
              cat /tmp/dependency-inspect.txt
              digest=$(awk '$1 == "Digest:" { print $2; exit }' /tmp/dependency-inspect.txt)
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
              reference="docker.io/library/${image_name}@${digest}"
              jq --arg key "$dependency" --arg image "$reference" '. + {($key): $image}' \
                "/tmp/images/${SERVICE}.json" > /tmp/dependency-images.json
              mv /tmp/dependency-images.json "/tmp/images/${SERVICE}.json"
              echo "$reference"
              printf '\n`%s`: `%s`, from `%s/compose.yaml:%s` at `%s` → `%s`.\n' \
                "$dependency" "$tag" "$SERVICE_REPOSITORY" "$line" "$(git rev-parse HEAD)" "$reference" \
                >> "$GITHUB_STEP_SUMMARY"
            done
            if [[ "$SERVICE" == os ]]; then
              printf '\nPostgreSQL 17 follows OS compose.yaml:3 and Billing compose.yaml:5 and the platform contract. Auth compose.yaml:4 uses 16.6-alpine locally.\n' \
                >> "$GITHUB_STEP_SUMMARY"
            fi
            echo '::endgroup::'
          } 2>&1 | tee -a "$IMAGES_LOG"

      - name: Upload image fragment and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: images-part-${{ matrix.service }}
          path: |
            /tmp/images/${{ matrix.service }}.json
            /tmp/images-${{ matrix.service }}.log
          if-no-files-found: warn
          retention-days: 7

      - name: Failure diagnostics
        if: failure()
        run: |
          set -euo pipefail
          {
            echo '::group::Failure diagnostics'
            {
              printf '### Last 200 log lines (%s)\n\n```text\n' "$SERVICE"
              if test -f "$IMAGES_LOG"; then tail -n 200 "$IMAGES_LOG"; fi
              printf '```\n'
            } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
            echo '::endgroup::'
          } 2>&1 | tee -a "$IMAGES_LOG"

  images_consolidate:
    name: 3 Consolidar imagens
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      IMAGES_LOG: /tmp/images-consolidate.log
    steps:
      - name: Credenciais AWS OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: images-consolidate-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: us-east-1
          role-duration-seconds: 14400
          unset-current-credentials: true

      - uses: actions/download-artifact@v4
        with:
          pattern: images-part-*
          path: /tmp/images-parts
          merge-multiple: true

      - name: Consolidate platform images
        run: |
          set -euo pipefail
          {
            echo '::group::Consolidate platform images'
            for service in os execution billing auth; do
              test -f "/tmp/images-parts/images/${service}.json"
            done
            jq -s 'add' /tmp/images-parts/images/{os,execution,billing,auth}.json > /tmp/images.json
            jq -e '
              (keys == ["auth", "billing", "execution", "mongodb", "os", "postgres", "rabbitmq"]) and
              all(.[]; type == "string" and test("^[a-z0-9][a-z0-9./:_-]+@sha256:[0-9a-f]{64}$"))
            ' /tmp/images.json
            {
              printf '### Platform images\n\nObject for the `images` variable in `phase4/stacks/platform/variables.tf`.\n\n```json\n'
              cat /tmp/images.json
              printf '```\n'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo '::endgroup::'
          } 2>&1 | tee -a "$IMAGES_LOG"

      - name: Upload images.json and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: images.json
          path: |
            /tmp/images.json
            /tmp/images-consolidate.log
          if-no-files-found: warn
          retention-days: 7

      - name: Failure diagnostics
        if: failure()
        run: |
          set -euo pipefail
          {
            echo '::group::Failure diagnostics'
            {
              printf '### Last 200 log lines (consolidation)\n\n```text\n'
              if test -f "$IMAGES_LOG"; then tail -n 200 "$IMAGES_LOG"; fi
              printf '```\n'
            } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
            echo '::endgroup::'
          } 2>&1 | tee -a "$IMAGES_LOG"

  platform_data:
    name: 4 Platform dados
    needs: [infra, images_consolidate, resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_WORKSPACE: default
      AWS_REGION: us-east-1
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      PLATFORM_MODE: apply
      PLATFORM_STAGE: data
      IMAGES_RUN_ID: ${{ github.run_id }}
      MERCADO_PAGO_SECRET_ARN: ${{ inputs.mercado_pago_secret_arn }}
      PLATFORM_LOG: /tmp/platform.log
      KUBECONFIG: /tmp/platform-kubeconfig
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: platform-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: us-east-1
          role-duration-seconds: 14400
          unset-current-credentials: true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Validar entradas da platform
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao validar entradas da platform; confira mercado_pago_secret_arn e AWS_ROLE_ARN."' ERR
          {
            echo '::group::Validar entradas da platform'
            [[ "$PLATFORM_MODE" == plan || "$PLATFORM_MODE" == apply ]]
            test -n "$AWS_ROLE_ARN"
            account_id=$(aws sts get-caller-identity --query Account --output text)
            [[ "$account_id" =~ ^[0-9]{12}$ ]]
            payment_pattern="^arn:aws:secretsmanager:${AWS_REGION}:${account_id}:secret:[A-Za-z0-9/_+=.@!-]+-[A-Za-z0-9]{6}$"
            if [[ ! "$MERCADO_PAGO_SECRET_ARN" =~ $payment_pattern ]]; then
              echo '::error::mercado_pago_secret_arn deve ser um ARN completo do Secrets Manager na conta STS e regiao do workflow, com sufixo AWS de seis caracteres.'
              exit 1
            fi
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Download images.json
        uses: actions/download-artifact@v4
        with:
          name: images.json
          path: /tmp/platform-images

      - name: Read infra contract
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao inicializar o backend infra ou ler platform_contract; confira o state de demo-a e as permissoes AWS."' ERR
          {
            echo '::group::Read infra contract'
            terraform -chdir=phase4/stacks/infra init -input=false -no-color \
              -backend-config=bucket=tech-challenge-oficina-terraform-state-b1cfa326 \
              -backend-config=key=phase4/environments/demo-a/infra.tfstate \
              -backend-config=region=us-east-1 \
              -backend-config=encrypt=true \
              -backend-config=use_lockfile=true
            terraform -chdir=phase4/stacks/infra output -json platform_contract > /tmp/infra_contract.json
            jq -e 'type == "object" and .environment_id == "demo-a" and .aws_region == "us-east-1"' \
              /tmp/infra_contract.json
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Resolve default EKS addon versions
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao resolver versoes default dos addons para Kubernetes 1.35."' ERR
          {
            echo '::group::Resolve default EKS addon versions'
            for addon in eks-pod-identity-agent aws-ebs-csi-driver vpc-cni; do
              aws eks describe-addon-versions --kubernetes-version 1.35 --addon-name "$addon" \
                --output json > "/tmp/platform-${addon}.json"
              version=$(jq -r '[.addons[].addonVersions[] |
                select(any(.compatibilities[]; .clusterVersion == "1.35" and .defaultVersion == true)) |
                .addonVersion] | unique | if length == 1 then .[0] else empty end' "/tmp/platform-${addon}.json")
              if [[ -z "$version" || "$version" == null ]]; then
                echo "::error::Addon ${addon} sem uma versao default unica para Kubernetes 1.35 em ${AWS_REGION}."
                exit 1
              fi
              printf '%s\n' "$version" > "/tmp/platform-${addon}.version"
              printf '%s: %s\n' "$addon" "$version"
            done
            jq -n \
              --arg pod_identity "$(cat /tmp/platform-eks-pod-identity-agent.version)" \
              --arg ebs_csi "$(cat /tmp/platform-aws-ebs-csi-driver.version)" \
              --arg vpc_cni "$(cat /tmp/platform-vpc-cni.version)" \
              '{pod_identity: $pod_identity, ebs_csi: $ebs_csi, vpc_cni: $vpc_cni}' > /tmp/platform-addons.json
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Generate Terraform inputs
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao gerar tfvars.json; confira identidade AWS, contrato infra e os sete digests de images.json."' ERR
          {
            echo '::group::Generate Terraform inputs'
            identity=$(aws sts get-caller-identity --output json)
            account_id=$(jq -er '.Account' <<< "$identity")
            caller_arn=$(jq -er '.Arn' <<< "$identity")
            [[ "$account_id" =~ ^[0-9]{12}$ ]]
            [[ "$AWS_ROLE_ARN" =~ ^arn:aws:iam::${account_id}:role/[A-Za-z0-9+=,.@_/-]+$ ]]
            role_name=${AWS_ROLE_ARN##*/}
            [[ "$caller_arn" == "arn:aws:sts::${account_id}:assumed-role/${role_name}/"* ]]
            jq -e --arg account "$account_id" '.aws_account_id == $account' /tmp/infra_contract.json
            jq -e '
              (keys == ["auth", "billing", "execution", "mongodb", "os", "postgres", "rabbitmq"]) and
              all(.[]; type == "string" and test("^[a-z0-9][a-z0-9./:_-]+@sha256:[0-9a-f]{64}$"))
            ' /tmp/platform-images/images.json
            jq -n \
              --arg account_id "$account_id" \
              --slurpfile infra_contract /tmp/infra_contract.json \
              --slurpfile images /tmp/platform-images/images.json \
              --slurpfile addon_versions /tmp/platform-addons.json \
              '{environment_id: "demo-a", aws_region: "us-east-1",
                aws_account_id: $account_id, git_revision: "0000000000000000000000000000000000000000",
                infra_contract: $infra_contract[0], images: $images[0], addon_versions: $addon_versions[0],
                new_relic_chart_version: "6.0.0",
                mercado_pago: {enabled: false, success_url: "https://example.com/success",
                  failure_url: "https://example.com/failure", pending_url: "https://example.com/pending"},
                jwt: null, application_replicas: 0, auth_migration_enabled: true}' \
              > phase4/stacks/platform/tfvars.json
            if [[ "$PLATFORM_STAGE" == apps || "$PLATFORM_STAGE" == controller ]]; then
              jq --slurpfile jwt /tmp/platform-jwt.json --slurpfile edge /tmp/platform-edge-contract.json '
                .jwt = $jwt[0] | .application_replicas = 1 | .auth_migration_enabled = false |
                .alb_controller_identity_enabled = true |
                .alb_identity_inputs = {security_group_id: $edge[0].alb_security_group_id, certificate_arn: null}
              ' phase4/stacks/platform/tfvars.json > /tmp/platform-apps-tfvars.json
              mv /tmp/platform-apps-tfvars.json phase4/stacks/platform/tfvars.json
            fi
            {
              printf '### Platform inputs\n\nMode: `%s`; images run: `%s`.\n\n' "$PLATFORM_MODE" "$IMAGES_RUN_ID"
              printf 'New Relic chart: `6.0.0` (semver accepted by variables.tf; Helm is not installed).\n\n'
              if [[ "$PLATFORM_STAGE" == apps || "$PLATFORM_STAGE" == controller ]]; then
                printf 'Stage %s; JWT do edge; uma replica por Deployment; identidade ALB habilitada, certificado null; migration e Mercado Pago disabled.\n\n### Addon versions\n\n```json\n' "$PLATFORM_STAGE"
              else
                printf 'JWT null; replicas zero; Mercado Pago disabled.\n\n### Addon versions\n\n```json\n'
              fi
              cat /tmp/platform-addons.json
              printf '```\n'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Terraform init
        working-directory: phase4/stacks/platform
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no terraform init de platform; confira backend e permissoes AWS."' ERR
          {
            echo '::group::Terraform init'
            terraform init -input=false -no-color \
              -backend-config=bucket=tech-challenge-oficina-terraform-state-b1cfa326 \
              -backend-config=key=phase4/environments/demo-a/platform.tfstate \
              -backend-config=region=us-east-1 \
              -backend-config=encrypt=true \
              -backend-config=use_lockfile=true
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Terraform validate
        working-directory: phase4/stacks/platform
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no terraform validate de platform; confira o diagnostico no log."' ERR
          {
            echo '::group::Terraform validate'
            terraform validate -no-color
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Terraform plan
        working-directory: phase4/stacks/platform
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no terraform plan de platform; confira catalogo, contratos, versoes de addons e acesso ao EKS."' ERR
          {
            echo '::group::Terraform plan'
            terraform plan -input=false -no-color -lock-timeout=5m -var-file=tfvars.json -out=tfplan
            terraform show -no-color tfplan > /tmp/platform-plan.txt
            {
              printf '### Terraform plan\n\n```text\n'
              cat /tmp/platform-plan.txt
              printf '```\n'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Terraform apply
        working-directory: phase4/stacks/platform
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no terraform apply de platform; confira o log e o state antes de repetir."' ERR
          {
            echo '::group::Terraform apply'
            terraform apply -input=false -no-color -lock-timeout=5m tfplan
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Apply foundation and network only
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao exportar manifests ou aplicar foundation/network; confira kubeconfig, acesso EKS e namespaces."' ERR
          {
            echo '::group::Apply foundation and network only'
            terraform -chdir=phase4/stacks/platform output -json manifests > /tmp/platform-manifests.json
            cluster_name=$(jq -er '.eks.name' /tmp/infra_contract.json)
            aws eks update-kubeconfig --name "$cluster_name" --region "$AWS_REGION"
            jq -er '.foundation' /tmp/platform-manifests.json > /tmp/platform-foundation.json
            jq -er '.network' /tmp/platform-manifests.json > /tmp/platform-network.json
            jq '{apiVersion: "v1", kind: "List", items: [.items[] | select(.kind == "Namespace")]}' \
              /tmp/platform-foundation.json > /tmp/platform-namespaces.json
            jq -e '.items | length > 0' /tmp/platform-namespaces.json
            kubectl apply -f /tmp/platform-namespaces.json
            mapfile -t namespaces < <(jq -r '.items[].metadata.name' /tmp/platform-namespaces.json)
            for namespace in "${namespaces[@]}"; do
              kubectl wait --for=jsonpath='{.status.phase}'=Active "namespace/${namespace}" --timeout=120s
            done
            kubectl apply -f /tmp/platform-foundation.json
            kubectl apply -f /tmp/platform-network.json
            printf '\n### Applied\n\nFoundation and network only.\n' | tee -a "$GITHUB_STEP_SUMMARY"
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Create rds-ca ConfigMap
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha na validacao do bundle RDS ou criacao dos ConfigMaps de CA; confira TLS, certificados e referencias dos manifests."' ERR
          {
            echo '::group::Create rds-ca ConfigMap'
            terraform -chdir=phase4/stacks/platform output -json > /tmp/platform-outputs.json
            source_url=https://truststore.pki.rds.amazonaws.com/us-east-1/us-east-1-bundle.pem
            curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
              --connect-timeout 15 --max-time 60 "$source_url" -o /tmp/platform-rds-ca.pem
            mkdir -p /tmp/platform-rds-certificates
            awk -v directory=/tmp/platform-rds-certificates '
              /^-----BEGIN CERTIFICATE-----\r?$/ {
                if (inside) { invalid = 1; exit 1 }
                inside = 1; count++
                destination = sprintf("%s/certificate-%03d.pem", directory, count)
              }
              /-----BEGIN / && !/^-----BEGIN CERTIFICATE-----\r?$/ { invalid = 1; exit 1 }
              /-----END / && !/^-----END CERTIFICATE-----\r?$/ { invalid = 1; exit 1 }
              inside { print > destination }
              /^-----END CERTIFICATE-----\r?$/ {
                if (!inside) { invalid = 1; exit 1 }
                close(destination); inside = 0; next
              }
              !inside && /[^[:space:]]/ { invalid = 1; exit 1 }
              END { if (invalid || inside || count < 1) exit 1 }
            ' /tmp/platform-rds-ca.pem
            for certificate in /tmp/platform-rds-certificates/certificate-*.pem; do
              openssl x509 -in "$certificate" -noout
              openssl x509 -in "$certificate" -noout -checkend 0
            done
            sha256sum /tmp/platform-rds-ca.pem
            printf '\n### RDS CA\n\nsem checksum pinado (decisão para demo)\n\n' | tee -a "$GITHUB_STEP_SUMMARY"
            jq -er --arg source "$source_url" '
              .external_configmaps.value | to_entries[] |
              select(.value.source == $source and (.value.keys | index("ca.pem") != null)) |
              .key
            ' /tmp/platform-outputs.json > /tmp/platform-rds-configmaps.txt
            while IFS= read -r configmap; do
              jq -er --arg name "$configmap" '
                [to_entries[].value | fromjson | .items[] | . as $resource |
                  .. | objects |
                  select(.configMap.name? == $name or .configMapKeyRef.name? == $name) |
                  $resource.metadata.namespace] |
                unique | if length > 0 and all(.[]; type == "string" and length > 0)
                  then .[] else error("ConfigMap sem namespaces nos manifests") end
              ' /tmp/platform-manifests.json > /tmp/platform-rds-namespaces.txt
              while IFS= read -r namespace; do
                printf 'ConfigMap %s; namespace %s (lidos dos outputs/manifests)\n' "$configmap" "$namespace" |
                  tee -a "$GITHUB_STEP_SUMMARY"
                kubectl create configmap "$configmap" -n "$namespace" \
                  --from-file=ca.pem=/tmp/platform-rds-ca.pem --dry-run=client -o yaml | kubectl apply -f -
              done < /tmp/platform-rds-namespaces.txt
            done < /tmp/platform-rds-configmaps.txt
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Deliver secrets
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao instalar dependencias ou entregar secrets; confira permissoes, kubeconfig e credenciais TEST do Mercado Pago."' ERR
          {
            echo '::group::Deliver secrets'
            python -m pip install -r scripts/platform-secrets/requirements.txt
            account_id=$(aws sts get-caller-identity --query Account --output text)
            python scripts/platform-secrets/deliver.py deliver \
              --infra-contract /tmp/infra_contract.json \
              --platform-outputs /tmp/platform-outputs.json \
              --revision 0000000000000000000000000000000000000000 \
              --images /tmp/platform-images/images.json \
              --mercado-pago-secret-arn "$MERCADO_PAGO_SECRET_ARN" \
              --region us-east-1 --account "$account_id" \
              --receipts-out /tmp/platform-receipts.json
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Apply data and wait for StatefulSets
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao aplicar data ou aguardar StatefulSets prontos em 300s."' ERR
          {
            echo '::group::Apply data and wait for StatefulSets'
            jq -er '.data' /tmp/platform-manifests.json > /tmp/platform-data.json
            jq -e '[.items[] | select(.kind == "StatefulSet")] | length > 0' /tmp/platform-data.json
            kubectl apply -f /tmp/platform-data.json
            jq -r '.items[] | select(.kind == "StatefulSet") |
              [.metadata.namespace, .metadata.name] | @tsv' /tmp/platform-data.json > /tmp/platform-statefulsets.tsv
            while IFS=$'\t' read -r namespace statefulset; do
              kubectl rollout status "statefulset/${statefulset}" -n "$namespace" --timeout=300s
            done < /tmp/platform-statefulsets.tsv
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Apply bootstrap and clean temporary secrets
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha na fase bootstrap ou na remocao dos secrets temporarios de bootstrap."' ERR
          {
            echo '::group::Apply bootstrap and clean temporary secrets'
            jq -er '.bootstrap' /tmp/platform-manifests.json > /tmp/platform-bootstrap.json
            jq -e '[.items[] | select(.kind == "Job")] | length > 0' /tmp/platform-bootstrap.json
            kubectl apply -f /tmp/platform-bootstrap.json
            jq -r '.items[] | select(.kind == "Job") |
              [.metadata.namespace, .metadata.name] | @tsv' /tmp/platform-bootstrap.json > /tmp/platform-bootstrap-jobs.tsv
            while IFS=$'\t' read -r namespace job; do
              if ! kubectl wait --for=condition=complete "job/${job}" -n "$namespace" --timeout=600s ||
                ! kubectl get "job/${job}" -n "$namespace" -o json | \
                  jq -e '(.status.succeeded // 0) > 0 and (.status.failed // 0) == 0'; then
                echo "::error::Job ${namespace}/${job} falhou ou excedeu o timeout de 600s."
                kubectl logs "job/${job}" -n "$namespace" --all-containers=true --tail=200 || \
                  echo "::error::Nao foi possivel obter logs do Job ${namespace}/${job}."
                exit 1
              fi
            done < /tmp/platform-bootstrap-jobs.tsv
            python scripts/platform-secrets/deliver.py cleanup-temporary \
              --lifecycle bootstrap --receipts /tmp/platform-receipts.json
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Apply migration and clean temporary secrets
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha na fase migration ou na remocao dos secrets temporarios de migration."' ERR
          {
            echo '::group::Apply migration and clean temporary secrets'
            jq -er '.migration' /tmp/platform-manifests.json > /tmp/platform-migration.json
            jq -e '[.items[] | select(.kind == "Job")] | length > 0' /tmp/platform-migration.json
            kubectl apply -f /tmp/platform-migration.json
            jq -r '.items[] | select(.kind == "Job") |
              [.metadata.namespace, .metadata.name] | @tsv' /tmp/platform-migration.json > /tmp/platform-migration-jobs.tsv
            while IFS=$'\t' read -r namespace job; do
              if ! kubectl wait --for=condition=complete "job/${job}" -n "$namespace" --timeout=600s ||
                ! kubectl get "job/${job}" -n "$namespace" -o json | \
                  jq -e '(.status.succeeded // 0) > 0 and (.status.failed // 0) == 0'; then
                echo "::error::Job ${namespace}/${job} falhou ou excedeu o timeout de 600s."
                kubectl logs "job/${job}" -n "$namespace" --all-containers=true --tail=200 || \
                  echo "::error::Nao foi possivel obter logs do Job ${namespace}/${job}."
                exit 1
              fi
            done < /tmp/platform-migration-jobs.tsv
            python scripts/platform-secrets/deliver.py cleanup-temporary \
              --lifecycle migration --receipts /tmp/platform-receipts.json
            printf '\n### Applied\n\nData, bootstrap and migration completed; temporary projections cleaned.\n' |
              tee -a "$GITHUB_STEP_SUMMARY"
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Upload plan, log and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/platform-plan.txt
            /tmp/platform.log
            /tmp/platform-diagnostics.txt
            /tmp/platform-receipts.json
          if-no-files-found: warn
          retention-days: 7

      - name: Failure diagnostics
        if: failure()
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao gravar diagnosticos de platform."' ERR
          {
            echo '::group::Failure diagnostics'
            {
              printf '### Failure diagnostics\n\n```text\n'
              if ! test -s "$KUBECONFIG" && test -s /tmp/infra_contract.json; then
                if cluster_name=$(jq -er '.eks.name' /tmp/infra_contract.json); then
                  aws eks update-kubeconfig --name "$cluster_name" --region "$AWS_REGION" || \
                    echo '::error::Nao foi possivel preparar kubeconfig para diagnosticos.'
                else
                  echo '::error::Contrato infra sem nome do cluster para diagnosticos.'
                fi
              fi
              kubectl get pods -A -o wide --request-timeout=30s || echo '::error::Nao foi possivel listar pods.'
              if kubectl get pods -A --field-selector=status.phase!=Running -o json \
                --request-timeout=30s > /tmp/platform-non-running-pods.json; then
                while IFS=$'\t' read -r namespace pod; do
                  kubectl describe pod "$pod" -n "$namespace" --request-timeout=30s || \
                    echo "::error::Nao foi possivel descrever pod ${namespace}/${pod}."
                done < <(jq -r '.items[] | [.metadata.namespace, .metadata.name] | @tsv' /tmp/platform-non-running-pods.json)
              else
                echo '::error::Nao foi possivel consultar pods fora de Running.'
              fi
              kubectl get events -A --sort-by=.lastTimestamp --request-timeout=30s || \
                echo '::error::Nao foi possivel listar eventos.'
              if [[ "$PLATFORM_STAGE" == controller ]] && test -s /tmp/infra_contract.json; then
                if name_prefix=$(jq -er '.name_prefix' /tmp/infra_contract.json); then
                  release="${name_prefix}-alb"
                  helm status "$release" -n kube-system || \
                    echo '::error::Nao foi possivel consultar helm status do ALB Controller.'
                  kubectl logs -n kube-system -l "app.kubernetes.io/instance=${release}" \
                    --tail=100 --all-containers=true --request-timeout=30s || \
                    echo '::error::Nao foi possivel obter logs do ALB Controller.'
                else
                  echo '::error::Contrato infra sem name_prefix para diagnosticos do ALB Controller.'
                fi
              fi
              if [[ "$PLATFORM_STAGE" == apps ]] && test -s /tmp/platform-failed-rollouts.tsv; then
                while IFS=$'\t' read -r namespace deployment selector; do
                  printf '\nDeployment com falha: %s/%s; selector: %s\n' "$namespace" "$deployment" "$selector"
                  kubectl describe deployment "$deployment" -n "$namespace" --request-timeout=30s || \
                    echo "::error::Nao foi possivel descrever Deployment ${namespace}/${deployment}."
                  if kubectl get pods -n "$namespace" -l "$selector" -o json --request-timeout=30s \
                    > /tmp/platform-rollout-pods.json; then
                    while IFS= read -r pod; do
                      kubectl describe pod "$pod" -n "$namespace" --request-timeout=30s || \
                        echo "::error::Nao foi possivel descrever pod ${namespace}/${pod}."
                      kubectl logs "$pod" -n "$namespace" --tail=100 --all-containers=true --request-timeout=30s || \
                        echo "::error::Nao foi possivel obter logs do pod ${namespace}/${pod}."
                    done < <(jq -r '.items[].metadata.name' /tmp/platform-rollout-pods.json)
                  else
                    echo "::error::Nao foi possivel listar pods do Deployment ${namespace}/${deployment}."
                  fi
                done < /tmp/platform-failed-rollouts.tsv
              fi
              printf '```\n\n### Last 200 log lines\n\n```text\n'
              if test -f "$PLATFORM_LOG"; then tail -n 200 "$PLATFORM_LOG"; fi
              printf '```\n'
            } 2>&1 | tee /tmp/platform-diagnostics.txt | tee -a "$GITHUB_STEP_SUMMARY"
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

  edge_auth:
    name: 5 Edge Auth
    needs: [platform_data, auth_artifact]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_WORKSPACE: default
      AWS_REGION: us-east-1
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EDGE_MODE: apply
      EDGE_STAGE: auth
      AUTH_RELEASE_RUN_ID: ${{ github.run_id }}
      EDGE_LOG: /tmp/edge.log
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@v4
        id: credentials
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: edge-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: us-east-1
          role-duration-seconds: 14400
          unset-current-credentials: true

      - uses: hashicorp/setup-terraform@v3
        id: terraform
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Validar entradas do edge
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao validar entradas do edge; confira mode apply e AWS_ROLE_ARN."' ERR
          {
            [[ "$EDGE_MODE" == plan || "$EDGE_MODE" == apply ]]
            test -n "$AWS_ROLE_ARN"
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Download auth_release.json
        id: auth_release
        uses: actions/download-artifact@v4
        with:
          name: auth_release.json
          path: /tmp/edge-auth-release

      - name: Read infra and Platform contracts
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao inicializar infra/platform ou ler platform_contract e edge_contract; confira os states de demo-a e permissoes AWS."' ERR
          {
            for stack in infra platform; do
              terraform -chdir="phase4/stacks/${stack}" init -input=false -no-color \
                -backend-config=bucket=tech-challenge-oficina-terraform-state-b1cfa326 \
                -backend-config="key=phase4/environments/demo-a/${stack}.tfstate" \
                -backend-config=region=us-east-1 \
                -backend-config=encrypt=true \
                -backend-config=use_lockfile=true
            done
            terraform -chdir=phase4/stacks/infra output -json platform_contract > /tmp/infra_contract.json
            terraform -chdir=phase4/stacks/platform output -json > /tmp/edge-platform-outputs.json
            jq -e '.edge_contract | select(.sensitive == false) | .value | select(type == "object")' \
              /tmp/edge-platform-outputs.json > /tmp/edge-platform-contract.json
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Generate Terraform inputs
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao gerar tfvars.json; confira identidade AWS, contratos infra/platform, GitRevision e auth_release.json. Nenhum valor ausente sera presumido."' ERR
          {
            account_id=$(aws sts get-caller-identity --query Account --output text)
            [[ "$account_id" =~ ^[0-9]{12}$ ]]
            [[ "$AWS_ROLE_ARN" =~ ^arn:aws:iam::${account_id}:role/[A-Za-z0-9+=,.@_/-]+$ ]]
            jq -e --arg account "$account_id" '
              .environment_id == "demo-a" and .aws_region == "us-east-1" and
              .aws_account_id == $account and (.tags.GitRevision | test("^[0-9a-f]{40}$"))
            ' /tmp/infra_contract.json
            jq -e --slurpfile infra /tmp/infra_contract.json '
              .environment_id == $infra[0].environment_id and
              .aws_account_id == $infra[0].aws_account_id and .aws_region == $infra[0].aws_region and
              .namespace == $infra[0].name_prefix and .vpc_id == $infra[0].vpc_id and
              ((.private_subnet_ids | sort) == ([$infra[0].private_subnets[].id] | sort))
            ' /tmp/edge-platform-contract.json
            jq -e --slurpfile infra /tmp/infra_contract.json '
              (keys == ["bootstrap_layer_arn", "bootstrap_revision", "bucket", "key", "revision", "sha256_base64", "version_id"]) and
              all(.[]; type == "string") and
              .bucket == ($infra[0].name_prefix + "-artifacts") and
              (.revision | test("^[0-9a-f]{40}$")) and .key == ("auth/" + .revision + "/auth.jar") and
              (.version_id | length > 0) and .version_id != "null" and
              (.sha256_base64 | test("^[A-Za-z0-9+/]{43}=$")) and
              (.bootstrap_revision | test("^[0-9a-f]{40}$")) and
              (.bootstrap_layer_arn | test("^arn:aws:lambda:" + $infra[0].aws_region + ":" +
                $infra[0].aws_account_id + ":layer:" + $infra[0].name_prefix + "-auth-bootstrap:[1-9][0-9]*$"))
            ' /tmp/edge-auth-release/auth_release.json > /dev/null
            jq -n --slurpfile infra /tmp/infra_contract.json \
              --slurpfile platform /tmp/edge-platform-contract.json \
              --slurpfile release /tmp/edge-auth-release/auth_release.json '
              {environment_id: $infra[0].environment_id, aws_region: $infra[0].aws_region,
                aws_account_id: $infra[0].aws_account_id, git_revision: $infra[0].tags.GitRevision,
                approval_source: "catalog", auth_permissions_boundary_arn: null,
                infra_contract: $infra[0], platform_contract: $platform[0],
                publish_auth: true, prepare_alb: false, publish_business: false, publish_webhook: false,
                readiness: {}, auth_release: $release[0], alb_tls: null, alb_listener_arn: null}
            ' > phase4/stacks/edge/tfvars.json
            if [[ "$EDGE_STAGE" == alb || "$EDGE_STAGE" == business ]]; then
              jq '.prepare_alb = true' phase4/stacks/edge/tfvars.json > /tmp/edge-alb-tfvars.json
              mv /tmp/edge-alb-tfvars.json phase4/stacks/edge/tfvars.json
            fi
            declared_variables=$(sed -n 's/^variable "\([^"]*\)".*/\1/p' phase4/stacks/edge/*.tf | sort)
            supplied_variables=$(jq -r 'keys[]' phase4/stacks/edge/tfvars.json | sort)
            [[ "$declared_variables" == "$supplied_variables" ]]
            if [[ "$EDGE_STAGE" == alb || "$EDGE_STAGE" == business ]]; then
              if [[ "$EDGE_STAGE" == business ]]; then
                printf '### Edge publish_business\n\nMode: `%s`; Auth release run: `%s`.\n\nAuth e preparacao ALB mantidos; business habilitado; webhook desabilitado; TLS null; readiness sem atestacoes. Listener descoberto antes do plan.\n' \
                  "$EDGE_MODE" "$AUTH_RELEASE_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
              else
                printf '### Edge prepare_alb\n\nMode: `%s`; Auth release run: `%s`.\n\nAuth mantido; ALB habilitado; business e webhook desabilitados; TLS e listener null; readiness sem atestacoes.\n' \
                  "$EDGE_MODE" "$AUTH_RELEASE_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              printf '### Edge publish_auth\n\nMode: `%s`; Auth release run: `%s`.\n\nBusiness, ALB e webhook desabilitados; TLS e listener null; readiness sem atestacoes.\n' \
                "$EDGE_MODE" "$AUTH_RELEASE_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
            fi
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Terraform init
        working-directory: phase4/stacks/edge
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no terraform init de edge; confira backend e permissoes AWS."' ERR
          {
            terraform init -input=false -no-color \
              -backend-config=bucket=tech-challenge-oficina-terraform-state-b1cfa326 \
              -backend-config=key=phase4/environments/demo-a/edge.tfstate \
              -backend-config=region=us-east-1 \
              -backend-config=encrypt=true \
              -backend-config=use_lockfile=true
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Terraform validate
        working-directory: phase4/stacks/edge
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no terraform validate de edge; confira o diagnostico no log."' ERR
          { terraform validate -no-color; } 2>&1 | tee -a "$EDGE_LOG"

      - name: Terraform plan
        working-directory: phase4/stacks/edge
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no terraform plan de edge; confira contratos, artefato Auth e permissoes AWS."' ERR
          {
            terraform plan -input=false -no-color -lock-timeout=5m -var-file=tfvars.json -out=tfplan
            terraform show -no-color tfplan > /tmp/edge-plan.txt
            {
              printf '\n### Terraform plan\n\n```text\n'
              cat /tmp/edge-plan.txt
              printf '```\n'
            } >> "$GITHUB_STEP_SUMMARY"
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Terraform apply
        working-directory: phase4/stacks/edge
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no terraform apply de edge; confira log e state antes de repetir."' ERR
          { terraform apply -input=false -no-color -lock-timeout=5m tfplan; } 2>&1 | tee -a "$EDGE_LOG"

      - name: Export edge outputs
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao exportar outputs de edge ou resumir endpoint, issuer e JWKS sem valores sensiveis."' ERR
          {
            terraform -chdir=phase4/stacks/edge output -json > /tmp/edge-outputs.json
            jq -er '
              if .edge_contract.sensitive == false and .jwt_contract.sensitive == false then
                "\n### Edge endpoints\n\nAPI Gateway: " + .edge_contract.value.api_endpoint +
                "\n\nIssuer: " + .jwt_contract.value.issuer + "\n\nJWKS: " + .jwt_contract.value.jwks_uri
              else error("Outputs ausentes ou sensiveis") end
            ' /tmp/edge-outputs.json >> "$GITHUB_STEP_SUMMARY"
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Upload edge-outputs.json
        id: outputs
        uses: actions/upload-artifact@v4
        with:
          name: edge-outputs-auth-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/edge-outputs.json
          if-no-files-found: error
          retention-days: 7

      - name: Smoke test JWKS
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no smoke test JWKS; endpoint deve responder com .keys contendo pelo menos uma chave em ate 120s."' ERR
          {
            jwks_uri=$(jq -er '.jwt_contract | select(.sensitive == false) | .value.jwks_uri |
              select(type == "string" and startswith("https://"))' /tmp/edge-outputs.json)
            deadline=$((SECONDS + 120))
            ready=false
            while (( SECONDS < deadline )); do
              remaining=$((deadline - SECONDS))
              if curl --fail --silent --show-error --proto '=https' --connect-timeout 10 \
                --max-time "$remaining" "$jwks_uri" -o /tmp/edge-jwks.json &&
                jq -e '.keys | type == "array" and length >= 1' /tmp/edge-jwks.json > /dev/null; then
                ready=true
                break
              fi
              remaining=$((deadline - SECONDS))
              if (( remaining > 0 )); then
                sleep "$((remaining < 5 ? remaining : 5))"
              fi
            done
            [[ "$ready" == true ]]
            printf '\n### Smoke test\n\nJWKS respondeu com pelo menos uma chave.\n' >> "$GITHUB_STEP_SUMMARY"
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Failure diagnostics
        if: failure()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          CREDENTIALS_OUTCOME: ${{ steps.credentials.outcome }}
          TERRAFORM_OUTCOME: ${{ steps.terraform.outcome }}
          RELEASE_OUTCOME: ${{ steps.auth_release.outcome }}
          OUTPUTS_OUTCOME: ${{ steps.outputs.outcome }}
          KUBECONFIG: /tmp/edge-kubeconfig
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao registrar diagnosticos de edge."' ERR
          for action in CHECKOUT CREDENTIALS TERRAFORM RELEASE OUTPUTS; do
            outcome_variable="${action}_OUTCOME"
            if [[ "${!outcome_variable}" == failure ]]; then
              echo "::error::Falha na action ${action}; confira checkout, OIDC, instalacao do Terraform ou transferencia de artifacts conforme o passo indicado."
            fi
          done
          {
            printf '\n### Last 200 log lines\n\n```text\n'
            if test -f "$EDGE_LOG"; then tail -n 200 "$EDGE_LOG"; fi
            printf '```\n'
            lambda_name=''
            if test -s /tmp/edge-outputs.json; then
              lambda_name=$(jq -r '
                [.lambda_function_name?, .auth_lambda_function_name?,
                  (.edge_contract? | select(.sensitive == false) | .value |
                    {sensitive: false, value: (.lambda_function_name? // .auth_lambda_function_name?)})] |
                map(select(.sensitive == false and (.value | type == "string" and length > 0))) |
                .[0].value // empty
              ' /tmp/edge-outputs.json) || lambda_name=''
            fi
            if [[ -n "$lambda_name" ]]; then
              printf '\n### Lambda: ultimas 50 linhas\n\n```text\n'
              aws logs tail "/aws/lambda/${lambda_name}" --since 1h --format short 2>&1 | tail -n 50 || \
                echo '::error::Nao foi possivel consultar o log group da Lambda.'
              printf '```\n'
            else
              printf '\nDiagnostico Lambda pulado: nome nao disponivel nos outputs do edge.\n'
            fi
            if [[ "$EDGE_STAGE" == alb || "$EDGE_STAGE" == business ]]; then
              printf '\n### Diagnosticos ALB\n\n```text\n'
              if test -s /tmp/infra_contract.json; then
                if cluster_name=$(jq -er '.eks.name' /tmp/infra_contract.json); then
                  aws eks update-kubeconfig --name "$cluster_name" --region "$AWS_REGION" || \
                    echo '::error::Nao foi possivel preparar kubeconfig para diagnosticos ALB.'
                fi
                if alb_name=$(jq -er '.name_prefix + "-edge"' /tmp/infra_contract.json) &&
                  aws elbv2 describe-load-balancers --names "$alb_name" > /tmp/edge-diagnostic-alb.json &&
                  alb_arn=$(jq -er '.LoadBalancers[0].LoadBalancerArn' /tmp/edge-diagnostic-alb.json) &&
                  aws elbv2 describe-target-groups --load-balancer-arn "$alb_arn" > /tmp/edge-diagnostic-groups.json; then
                  while IFS= read -r group_arn; do
                    printf '\nTarget group: %s\n' "$group_arn"
                    if aws elbv2 describe-target-health --target-group-arn "$group_arn" > /tmp/edge-diagnostic-health.json; then
                      cat /tmp/edge-diagnostic-health.json
                      jq '[.TargetHealthDescriptions[] | select(.TargetHealth.State != "healthy") |
                        {Target: .Target, State: .TargetHealth.State, Reason: .TargetHealth.Reason,
                          Description: .TargetHealth.Description}]' /tmp/edge-diagnostic-health.json
                    else
                      echo "::error::Nao foi possivel consultar targets de ${group_arn}."
                    fi
                  done < <(jq -r '.TargetGroups[].TargetGroupArn' /tmp/edge-diagnostic-groups.json)
                else
                  echo '::error::Nao foi possivel descobrir ALB/target groups para diagnosticos.'
                fi
              fi
              kubectl get ingress -A --request-timeout=30s || echo '::error::Nao foi possivel listar Ingresses.'
              kubectl describe ingress -A --request-timeout=30s || echo '::error::Nao foi possivel descrever Ingresses.'
              kubectl logs -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller \
                --tail=100 --all-containers=true --request-timeout=30s || \
                echo '::error::Nao foi possivel obter logs do ALB Controller.'
              printf '```\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY" 2>&1

  platform_apps:
    name: 6 Platform apps
    needs: [edge_auth]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_WORKSPACE: default
      AWS_REGION: us-east-1
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      PLATFORM_MODE: apply
      PLATFORM_STAGE: apps
      IMAGES_RUN_ID: ${{ github.run_id }}
      MERCADO_PAGO_SECRET_ARN: ${{ inputs.mercado_pago_secret_arn }}
      PLATFORM_LOG: /tmp/platform.log
      KUBECONFIG: /tmp/platform-kubeconfig
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: platform-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: us-east-1
          role-duration-seconds: 14400
          unset-current-credentials: true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Validar entradas da platform
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao validar entradas da platform; confira mercado_pago_secret_arn e AWS_ROLE_ARN."' ERR
          {
            echo '::group::Validar entradas da platform'
            [[ "$PLATFORM_MODE" == plan || "$PLATFORM_MODE" == apply ]]
            test -n "$AWS_ROLE_ARN"
            account_id=$(aws sts get-caller-identity --query Account --output text)
            [[ "$account_id" =~ ^[0-9]{12}$ ]]
            payment_pattern="^arn:aws:secretsmanager:${AWS_REGION}:${account_id}:secret:[A-Za-z0-9/_+=.@!-]+-[A-Za-z0-9]{6}$"
            if [[ ! "$MERCADO_PAGO_SECRET_ARN" =~ $payment_pattern ]]; then
              echo '::error::mercado_pago_secret_arn deve ser um ARN completo do Secrets Manager na conta STS e regiao do workflow, com sufixo AWS de seis caracteres.'
              exit 1
            fi
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Download images.json
        uses: actions/download-artifact@v4
        with:
          name: images.json
          path: /tmp/platform-images

      - name: Read infra contract
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao inicializar o backend infra ou ler platform_contract; confira o state de demo-a e as permissoes AWS."' ERR
          {
            echo '::group::Read infra contract'
            terraform -chdir=phase4/stacks/infra init -input=false -no-color \
              -backend-config=bucket=tech-challenge-oficina-terraform-state-b1cfa326 \
              -backend-config=key=phase4/environments/demo-a/infra.tfstate \
              -backend-config=region=us-east-1 \
              -backend-config=encrypt=true \
              -backend-config=use_lockfile=true
            terraform -chdir=phase4/stacks/infra output -json platform_contract > /tmp/infra_contract.json
            jq -e 'type == "object" and .environment_id == "demo-a" and .aws_region == "us-east-1"' \
              /tmp/infra_contract.json
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Read edge JWT and ALB contracts
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao ler contratos JWT/ALB do edge; confira backend, outputs, SG e URLs HTTPS de issuer/JWKS."' ERR
          {
            terraform -chdir=phase4/stacks/edge init -input=false -no-color \
              -backend-config=bucket=tech-challenge-oficina-terraform-state-b1cfa326 \
              -backend-config=key=phase4/environments/demo-a/edge.tfstate \
              -backend-config=region=us-east-1 \
              -backend-config=encrypt=true \
              -backend-config=use_lockfile=true
            terraform -chdir=phase4/stacks/edge output -json jwt_contract | \
              jq '{value: .}' > /tmp/platform-edge-jwt.json
            jq -e '.value | select(
              (keys == ["audience", "issuer", "jwks_uri"]) and
              all(.[]; type == "string" and length > 0) and
              (.issuer | startswith("https://")) and (.jwks_uri | startswith("https://"))
            )' /tmp/platform-edge-jwt.json > /tmp/platform-jwt.json
            terraform -chdir=phase4/stacks/edge output -json edge_contract > /tmp/platform-edge-contract.json
            jq -e --slurpfile infra /tmp/infra_contract.json '
              .environment_id == $infra[0].environment_id and
              (.alb_security_group_id | type == "string" and test("^sg-[0-9a-f]{17}$"))
            ' /tmp/platform-edge-contract.json > /dev/null
            if [[ "$PLATFORM_STAGE" == controller ]]; then
              terraform -chdir=phase4/stacks/edge output -json controller_identity_contract \
                > /tmp/platform-controller-identity.json
            fi
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Resolve default EKS addon versions
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao resolver versoes default dos addons para Kubernetes 1.35."' ERR
          {
            echo '::group::Resolve default EKS addon versions'
            for addon in eks-pod-identity-agent aws-ebs-csi-driver vpc-cni; do
              aws eks describe-addon-versions --kubernetes-version 1.35 --addon-name "$addon" \
                --output json > "/tmp/platform-${addon}.json"
              version=$(jq -r '[.addons[].addonVersions[] |
                select(any(.compatibilities[]; .clusterVersion == "1.35" and .defaultVersion == true)) |
                .addonVersion] | unique | if length == 1 then .[0] else empty end' "/tmp/platform-${addon}.json")
              if [[ -z "$version" || "$version" == null ]]; then
                echo "::error::Addon ${addon} sem uma versao default unica para Kubernetes 1.35 em ${AWS_REGION}."
                exit 1
              fi
              printf '%s\n' "$version" > "/tmp/platform-${addon}.version"
              printf '%s: %s\n' "$addon" "$version"
            done
            jq -n \
              --arg pod_identity "$(cat /tmp/platform-eks-pod-identity-agent.version)" \
              --arg ebs_csi "$(cat /tmp/platform-aws-ebs-csi-driver.version)" \
              --arg vpc_cni "$(cat /tmp/platform-vpc-cni.version)" \
              '{pod_identity: $pod_identity, ebs_csi: $ebs_csi, vpc_cni: $vpc_cni}' > /tmp/platform-addons.json
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Generate Terraform inputs
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao gerar tfvars.json; confira identidade AWS, contrato infra e os sete digests de images.json."' ERR
          {
            echo '::group::Generate Terraform inputs'
            identity=$(aws sts get-caller-identity --output json)
            account_id=$(jq -er '.Account' <<< "$identity")
            caller_arn=$(jq -er '.Arn' <<< "$identity")
            [[ "$account_id" =~ ^[0-9]{12}$ ]]
            [[ "$AWS_ROLE_ARN" =~ ^arn:aws:iam::${account_id}:role/[A-Za-z0-9+=,.@_/-]+$ ]]
            role_name=${AWS_ROLE_ARN##*/}
            [[ "$caller_arn" == "arn:aws:sts::${account_id}:assumed-role/${role_name}/"* ]]
            jq -e --arg account "$account_id" '.aws_account_id == $account' /tmp/infra_contract.json
            jq -e '
              (keys == ["auth", "billing", "execution", "mongodb", "os", "postgres", "rabbitmq"]) and
              all(.[]; type == "string" and test("^[a-z0-9][a-z0-9./:_-]+@sha256:[0-9a-f]{64}$"))
            ' /tmp/platform-images/images.json
            jq -n \
              --arg account_id "$account_id" \
              --slurpfile infra_contract /tmp/infra_contract.json \
              --slurpfile images /tmp/platform-images/images.json \
              --slurpfile addon_versions /tmp/platform-addons.json \
              '{environment_id: "demo-a", aws_region: "us-east-1",
                aws_account_id: $account_id, git_revision: "0000000000000000000000000000000000000000",
                infra_contract: $infra_contract[0], images: $images[0], addon_versions: $addon_versions[0],
                new_relic_chart_version: "6.0.0",
                mercado_pago: {enabled: false, success_url: "https://example.com/success",
                  failure_url: "https://example.com/failure", pending_url: "https://example.com/pending"},
                jwt: null, application_replicas: 0, auth_migration_enabled: true}' \
              > phase4/stacks/platform/tfvars.json
            if [[ "$PLATFORM_STAGE" == apps || "$PLATFORM_STAGE" == controller ]]; then
              jq --slurpfile jwt /tmp/platform-jwt.json --slurpfile edge /tmp/platform-edge-contract.json '
                .jwt = $jwt[0] | .application_replicas = 1 | .auth_migration_enabled = false |
                .alb_controller_identity_enabled = true |
                .alb_identity_inputs = {security_group_id: $edge[0].alb_security_group_id, certificate_arn: null}
              ' phase4/stacks/platform/tfvars.json > /tmp/platform-apps-tfvars.json
              mv /tmp/platform-apps-tfvars.json phase4/stacks/platform/tfvars.json
            fi
            {
              printf '### Platform inputs\n\nMode: `%s`; images run: `%s`.\n\n' "$PLATFORM_MODE" "$IMAGES_RUN_ID"
              printf 'New Relic chart: `6.0.0` (semver accepted by variables.tf; Helm is not installed).\n\n'
              if [[ "$PLATFORM_STAGE" == apps || "$PLATFORM_STAGE" == controller ]]; then
                printf 'Stage %s; JWT do edge; uma replica por Deployment; identidade ALB habilitada, certificado null; migration e Mercado Pago disabled.\n\n### Addon versions\n\n```json\n' "$PLATFORM_STAGE"
              else
                printf 'JWT null; replicas zero; Mercado Pago disabled.\n\n### Addon versions\n\n```json\n'
              fi
              cat /tmp/platform-addons.json
              printf '```\n'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Terraform init
        working-directory: phase4/stacks/platform
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no terraform init de platform; confira backend e permissoes AWS."' ERR
          {
            echo '::group::Terraform init'
            terraform init -input=false -no-color \
              -backend-config=bucket=tech-challenge-oficina-terraform-state-b1cfa326 \
              -backend-config=key=phase4/environments/demo-a/platform.tfstate \
              -backend-config=region=us-east-1 \
              -backend-config=encrypt=true \
              -backend-config=use_lockfile=true
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Terraform validate
        working-directory: phase4/stacks/platform
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no terraform validate de platform; confira o diagnostico no log."' ERR
          {
            echo '::group::Terraform validate'
            terraform validate -no-color
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Terraform plan
        working-directory: phase4/stacks/platform
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no terraform plan de platform; confira catalogo, contratos, versoes de addons e acesso ao EKS."' ERR
          {
            echo '::group::Terraform plan'
            terraform plan -input=false -no-color -lock-timeout=5m -var-file=tfvars.json -out=tfplan
            terraform show -no-color tfplan > /tmp/platform-plan.txt
            {
              printf '### Terraform plan\n\n```text\n'
              cat /tmp/platform-plan.txt
              printf '```\n'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Terraform apply
        working-directory: phase4/stacks/platform
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no terraform apply de platform; confira o log e o state antes de repetir."' ERR
          {
            echo '::group::Terraform apply'
            terraform apply -input=false -no-color -lock-timeout=5m tfplan
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Check apps prerequisites
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao conferir manifests, ConfigMap rds-ca ou Secrets existentes para apps."' ERR
          {
            terraform -chdir=phase4/stacks/platform output -json manifests > /tmp/platform-manifests.json
            cluster_name=$(jq -er '.eks.name' /tmp/infra_contract.json)
            aws eks update-kubeconfig --name "$cluster_name" --region "$AWS_REGION"
            jq -er '.auth' /tmp/platform-manifests.json > /tmp/platform-auth.json
            jq -er '.applications' /tmp/platform-manifests.json > /tmp/platform-applications.json
            jq -s '{apiVersion: "v1", kind: "List", items: [.[].items[]]}' \
              /tmp/platform-auth.json /tmp/platform-applications.json > /tmp/platform-apps.json
            jq -e '[.items[] | select(.kind == "Deployment")] |
              length == 4 and all(.[];
                (.metadata.namespace | type == "string" and length > 0) and
                (.metadata.name | type == "string" and length > 0) and
                (.spec.selector.matchLabels | type == "object" and length > 0))' \
              /tmp/platform-apps.json > /dev/null
            jq -r '.items[] | select(.kind == "Deployment") |
              [.metadata.namespace, .metadata.name,
                (.spec.selector.matchLabels | to_entries | sort_by(.key) |
                  map(.key + "=" + .value) | join(","))] | @tsv' \
              /tmp/platform-apps.json > /tmp/platform-deployments.tsv
            jq -r '[.items[] | select(.kind == "Deployment") | .metadata.namespace] |
              unique[]' /tmp/platform-apps.json > /tmp/platform-apps-namespaces.txt
            jq -r '[.items[] | select(.kind == "Deployment") | . as $deployment |
              .spec.template.spec | .. | objects |
              (.secretKeyRef.name? // .secret.secretName? // .secretRef.name? // empty) |
              [$deployment.metadata.namespace, .]] | unique[] | @tsv' \
              /tmp/platform-apps.json > /tmp/platform-apps-secrets.tsv
            missing=()
            while IFS= read -r namespace; do
              if ! kubectl get configmap rds-ca -n "$namespace" -o name --request-timeout=30s; then
                missing+=("${namespace}/ConfigMap/rds-ca")
              fi
            done < /tmp/platform-apps-namespaces.txt
            while IFS=$'\t' read -r namespace secret; do
              if ! kubectl get secret "$secret" -n "$namespace" -o name --request-timeout=30s; then
                missing+=("${namespace}/Secret/${secret}")
              fi
            done < /tmp/platform-apps-secrets.tsv
            if (( ${#missing[@]} > 0 )); then
              printf '::error::Dependencias ausentes ou inacessiveis para apps: %s\n' "${missing[*]}"
              exit 1
            fi
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Apply apps and wait for Deployments
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao aplicar auth/applications ou aguardar os Deployments; confira os diagnosticos de rollout."' ERR
          {
            kubectl apply -f /tmp/platform-auth.json
            kubectl apply -f /tmp/platform-applications.json
            failed=false
            while IFS=$'\t' read -r namespace deployment selector; do
              if ! kubectl rollout status "deployment/${deployment}" -n "$namespace" --timeout=600s; then
                echo "::error::Rollout do Deployment ${namespace}/${deployment} falhou ou excedeu 600s."
                printf '%s\t%s\t%s\n' "$namespace" "$deployment" "$selector" >> /tmp/platform-failed-rollouts.tsv
                failed=true
              fi
            done < /tmp/platform-deployments.tsv
            printf '\n### Deployments apps\n\n| Namespace | Deployment | Replicas prontas/desejadas |\n| --- | --- | --- |\n' \
              >> "$GITHUB_STEP_SUMMARY"
            while IFS=$'\t' read -r namespace deployment selector; do
              kubectl get deployment "$deployment" -n "$namespace" -o json --request-timeout=30s | \
                jq -r '"| \(.metadata.namespace) | \(.metadata.name) | \(.status.readyReplicas // 0)/\(.spec.replicas) |"' \
                >> "$GITHUB_STEP_SUMMARY"
            done < /tmp/platform-deployments.tsv
            [[ "$failed" == false ]]
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Upload plan, log and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-apps-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/platform-plan.txt
            /tmp/platform.log
            /tmp/platform-diagnostics.txt
            /tmp/platform-receipts.json
          if-no-files-found: warn
          retention-days: 7

      - name: Failure diagnostics
        if: failure()
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao gravar diagnosticos de platform."' ERR
          {
            echo '::group::Failure diagnostics'
            {
              printf '### Failure diagnostics\n\n```text\n'
              if ! test -s "$KUBECONFIG" && test -s /tmp/infra_contract.json; then
                if cluster_name=$(jq -er '.eks.name' /tmp/infra_contract.json); then
                  aws eks update-kubeconfig --name "$cluster_name" --region "$AWS_REGION" || \
                    echo '::error::Nao foi possivel preparar kubeconfig para diagnosticos.'
                else
                  echo '::error::Contrato infra sem nome do cluster para diagnosticos.'
                fi
              fi
              kubectl get pods -A -o wide --request-timeout=30s || echo '::error::Nao foi possivel listar pods.'
              if kubectl get pods -A --field-selector=status.phase!=Running -o json \
                --request-timeout=30s > /tmp/platform-non-running-pods.json; then
                while IFS=$'\t' read -r namespace pod; do
                  kubectl describe pod "$pod" -n "$namespace" --request-timeout=30s || \
                    echo "::error::Nao foi possivel descrever pod ${namespace}/${pod}."
                done < <(jq -r '.items[] | [.metadata.namespace, .metadata.name] | @tsv' /tmp/platform-non-running-pods.json)
              else
                echo '::error::Nao foi possivel consultar pods fora de Running.'
              fi
              kubectl get events -A --sort-by=.lastTimestamp --request-timeout=30s || \
                echo '::error::Nao foi possivel listar eventos.'
              if [[ "$PLATFORM_STAGE" == controller ]] && test -s /tmp/infra_contract.json; then
                if name_prefix=$(jq -er '.name_prefix' /tmp/infra_contract.json); then
                  release="${name_prefix}-alb"
                  helm status "$release" -n kube-system || \
                    echo '::error::Nao foi possivel consultar helm status do ALB Controller.'
                  kubectl logs -n kube-system -l "app.kubernetes.io/instance=${release}" \
                    --tail=100 --all-containers=true --request-timeout=30s || \
                    echo '::error::Nao foi possivel obter logs do ALB Controller.'
                else
                  echo '::error::Contrato infra sem name_prefix para diagnosticos do ALB Controller.'
                fi
              fi
              if [[ "$PLATFORM_STAGE" == apps ]] && test -s /tmp/platform-failed-rollouts.tsv; then
                while IFS=$'\t' read -r namespace deployment selector; do
                  printf '\nDeployment com falha: %s/%s; selector: %s\n' "$namespace" "$deployment" "$selector"
                  kubectl describe deployment "$deployment" -n "$namespace" --request-timeout=30s || \
                    echo "::error::Nao foi possivel descrever Deployment ${namespace}/${deployment}."
                  if kubectl get pods -n "$namespace" -l "$selector" -o json --request-timeout=30s \
                    > /tmp/platform-rollout-pods.json; then
                    while IFS= read -r pod; do
                      kubectl describe pod "$pod" -n "$namespace" --request-timeout=30s || \
                        echo "::error::Nao foi possivel descrever pod ${namespace}/${pod}."
                      kubectl logs "$pod" -n "$namespace" --tail=100 --all-containers=true --request-timeout=30s || \
                        echo "::error::Nao foi possivel obter logs do pod ${namespace}/${pod}."
                    done < <(jq -r '.items[].metadata.name' /tmp/platform-rollout-pods.json)
                  else
                    echo "::error::Nao foi possivel listar pods do Deployment ${namespace}/${deployment}."
                  fi
                done < /tmp/platform-failed-rollouts.tsv
              fi
              printf '```\n\n### Last 200 log lines\n\n```text\n'
              if test -f "$PLATFORM_LOG"; then tail -n 200 "$PLATFORM_LOG"; fi
              printf '```\n'
            } 2>&1 | tee /tmp/platform-diagnostics.txt | tee -a "$GITHUB_STEP_SUMMARY"
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

  platform_controller:
    name: 7 Platform controller
    needs: [platform_apps]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_WORKSPACE: default
      AWS_REGION: us-east-1
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      PLATFORM_MODE: apply
      PLATFORM_STAGE: controller
      IMAGES_RUN_ID: ${{ github.run_id }}
      MERCADO_PAGO_SECRET_ARN: ${{ inputs.mercado_pago_secret_arn }}
      PLATFORM_LOG: /tmp/platform.log
      KUBECONFIG: /tmp/platform-kubeconfig
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: platform-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: us-east-1
          role-duration-seconds: 14400
          unset-current-credentials: true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Validar entradas da platform
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao validar entradas da platform; confira mercado_pago_secret_arn e AWS_ROLE_ARN."' ERR
          {
            echo '::group::Validar entradas da platform'
            [[ "$PLATFORM_MODE" == plan || "$PLATFORM_MODE" == apply ]]
            test -n "$AWS_ROLE_ARN"
            account_id=$(aws sts get-caller-identity --query Account --output text)
            [[ "$account_id" =~ ^[0-9]{12}$ ]]
            payment_pattern="^arn:aws:secretsmanager:${AWS_REGION}:${account_id}:secret:[A-Za-z0-9/_+=.@!-]+-[A-Za-z0-9]{6}$"
            if [[ ! "$MERCADO_PAGO_SECRET_ARN" =~ $payment_pattern ]]; then
              echo '::error::mercado_pago_secret_arn deve ser um ARN completo do Secrets Manager na conta STS e regiao do workflow, com sufixo AWS de seis caracteres.'
              exit 1
            fi
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Download images.json
        uses: actions/download-artifact@v4
        with:
          name: images.json
          path: /tmp/platform-images

      - name: Read infra contract
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao inicializar o backend infra ou ler platform_contract; confira o state de demo-a e as permissoes AWS."' ERR
          {
            echo '::group::Read infra contract'
            terraform -chdir=phase4/stacks/infra init -input=false -no-color \
              -backend-config=bucket=tech-challenge-oficina-terraform-state-b1cfa326 \
              -backend-config=key=phase4/environments/demo-a/infra.tfstate \
              -backend-config=region=us-east-1 \
              -backend-config=encrypt=true \
              -backend-config=use_lockfile=true
            terraform -chdir=phase4/stacks/infra output -json platform_contract > /tmp/infra_contract.json
            jq -e 'type == "object" and .environment_id == "demo-a" and .aws_region == "us-east-1"' \
              /tmp/infra_contract.json
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Read edge JWT and ALB contracts
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao ler contratos JWT/ALB do edge; confira backend, outputs, SG e URLs HTTPS de issuer/JWKS."' ERR
          {
            terraform -chdir=phase4/stacks/edge init -input=false -no-color \
              -backend-config=bucket=tech-challenge-oficina-terraform-state-b1cfa326 \
              -backend-config=key=phase4/environments/demo-a/edge.tfstate \
              -backend-config=region=us-east-1 \
              -backend-config=encrypt=true \
              -backend-config=use_lockfile=true
            terraform -chdir=phase4/stacks/edge output -json jwt_contract | \
              jq '{value: .}' > /tmp/platform-edge-jwt.json
            jq -e '.value | select(
              (keys == ["audience", "issuer", "jwks_uri"]) and
              all(.[]; type == "string" and length > 0) and
              (.issuer | startswith("https://")) and (.jwks_uri | startswith("https://"))
            )' /tmp/platform-edge-jwt.json > /tmp/platform-jwt.json
            terraform -chdir=phase4/stacks/edge output -json edge_contract > /tmp/platform-edge-contract.json
            jq -e --slurpfile infra /tmp/infra_contract.json '
              .environment_id == $infra[0].environment_id and
              (.alb_security_group_id | type == "string" and test("^sg-[0-9a-f]{17}$"))
            ' /tmp/platform-edge-contract.json > /dev/null
            if [[ "$PLATFORM_STAGE" == controller ]]; then
              terraform -chdir=phase4/stacks/edge output -json controller_identity_contract \
                > /tmp/platform-controller-identity.json
            fi
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Resolve default EKS addon versions
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao resolver versoes default dos addons para Kubernetes 1.35."' ERR
          {
            echo '::group::Resolve default EKS addon versions'
            for addon in eks-pod-identity-agent aws-ebs-csi-driver vpc-cni; do
              aws eks describe-addon-versions --kubernetes-version 1.35 --addon-name "$addon" \
                --output json > "/tmp/platform-${addon}.json"
              version=$(jq -r '[.addons[].addonVersions[] |
                select(any(.compatibilities[]; .clusterVersion == "1.35" and .defaultVersion == true)) |
                .addonVersion] | unique | if length == 1 then .[0] else empty end' "/tmp/platform-${addon}.json")
              if [[ -z "$version" || "$version" == null ]]; then
                echo "::error::Addon ${addon} sem uma versao default unica para Kubernetes 1.35 em ${AWS_REGION}."
                exit 1
              fi
              printf '%s\n' "$version" > "/tmp/platform-${addon}.version"
              printf '%s: %s\n' "$addon" "$version"
            done
            jq -n \
              --arg pod_identity "$(cat /tmp/platform-eks-pod-identity-agent.version)" \
              --arg ebs_csi "$(cat /tmp/platform-aws-ebs-csi-driver.version)" \
              --arg vpc_cni "$(cat /tmp/platform-vpc-cni.version)" \
              '{pod_identity: $pod_identity, ebs_csi: $ebs_csi, vpc_cni: $vpc_cni}' > /tmp/platform-addons.json
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Generate Terraform inputs
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao gerar tfvars.json; confira identidade AWS, contrato infra e os sete digests de images.json."' ERR
          {
            echo '::group::Generate Terraform inputs'
            identity=$(aws sts get-caller-identity --output json)
            account_id=$(jq -er '.Account' <<< "$identity")
            caller_arn=$(jq -er '.Arn' <<< "$identity")
            [[ "$account_id" =~ ^[0-9]{12}$ ]]
            [[ "$AWS_ROLE_ARN" =~ ^arn:aws:iam::${account_id}:role/[A-Za-z0-9+=,.@_/-]+$ ]]
            role_name=${AWS_ROLE_ARN##*/}
            [[ "$caller_arn" == "arn:aws:sts::${account_id}:assumed-role/${role_name}/"* ]]
            jq -e --arg account "$account_id" '.aws_account_id == $account' /tmp/infra_contract.json
            jq -e '
              (keys == ["auth", "billing", "execution", "mongodb", "os", "postgres", "rabbitmq"]) and
              all(.[]; type == "string" and test("^[a-z0-9][a-z0-9./:_-]+@sha256:[0-9a-f]{64}$"))
            ' /tmp/platform-images/images.json
            jq -n \
              --arg account_id "$account_id" \
              --slurpfile infra_contract /tmp/infra_contract.json \
              --slurpfile images /tmp/platform-images/images.json \
              --slurpfile addon_versions /tmp/platform-addons.json \
              '{environment_id: "demo-a", aws_region: "us-east-1",
                aws_account_id: $account_id, git_revision: "0000000000000000000000000000000000000000",
                infra_contract: $infra_contract[0], images: $images[0], addon_versions: $addon_versions[0],
                new_relic_chart_version: "6.0.0",
                mercado_pago: {enabled: false, success_url: "https://example.com/success",
                  failure_url: "https://example.com/failure", pending_url: "https://example.com/pending"},
                jwt: null, application_replicas: 0, auth_migration_enabled: true}' \
              > phase4/stacks/platform/tfvars.json
            if [[ "$PLATFORM_STAGE" == apps || "$PLATFORM_STAGE" == controller ]]; then
              jq --slurpfile jwt /tmp/platform-jwt.json --slurpfile edge /tmp/platform-edge-contract.json '
                .jwt = $jwt[0] | .application_replicas = 1 | .auth_migration_enabled = false |
                .alb_controller_identity_enabled = true |
                .alb_identity_inputs = {security_group_id: $edge[0].alb_security_group_id, certificate_arn: null}
              ' phase4/stacks/platform/tfvars.json > /tmp/platform-apps-tfvars.json
              mv /tmp/platform-apps-tfvars.json phase4/stacks/platform/tfvars.json
            fi
            {
              printf '### Platform inputs\n\nMode: `%s`; images run: `%s`.\n\n' "$PLATFORM_MODE" "$IMAGES_RUN_ID"
              printf 'New Relic chart: `6.0.0` (semver accepted by variables.tf; Helm is not installed).\n\n'
              if [[ "$PLATFORM_STAGE" == apps || "$PLATFORM_STAGE" == controller ]]; then
                printf 'Stage %s; JWT do edge; uma replica por Deployment; identidade ALB habilitada, certificado null; migration e Mercado Pago disabled.\n\n### Addon versions\n\n```json\n' "$PLATFORM_STAGE"
              else
                printf 'JWT null; replicas zero; Mercado Pago disabled.\n\n### Addon versions\n\n```json\n'
              fi
              cat /tmp/platform-addons.json
              printf '```\n'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Terraform init
        working-directory: phase4/stacks/platform
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no terraform init de platform; confira backend e permissoes AWS."' ERR
          {
            echo '::group::Terraform init'
            terraform init -input=false -no-color \
              -backend-config=bucket=tech-challenge-oficina-terraform-state-b1cfa326 \
              -backend-config=key=phase4/environments/demo-a/platform.tfstate \
              -backend-config=region=us-east-1 \
              -backend-config=encrypt=true \
              -backend-config=use_lockfile=true
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Terraform validate
        working-directory: phase4/stacks/platform
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no terraform validate de platform; confira o diagnostico no log."' ERR
          {
            echo '::group::Terraform validate'
            terraform validate -no-color
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Terraform plan
        working-directory: phase4/stacks/platform
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no terraform plan de platform; confira catalogo, contratos, versoes de addons e acesso ao EKS."' ERR
          {
            echo '::group::Terraform plan'
            terraform plan -input=false -no-color -lock-timeout=5m -var-file=tfvars.json -out=tfplan
            terraform show -no-color tfplan > /tmp/platform-plan.txt
            {
              printf '### Terraform plan\n\n```text\n'
              cat /tmp/platform-plan.txt
              printf '```\n'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Terraform apply
        working-directory: phase4/stacks/platform
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no terraform apply de platform; confira o log e o state antes de repetir."' ERR
          {
            echo '::group::Terraform apply'
            terraform apply -input=false -no-color -lock-timeout=5m tfplan
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Install and verify ALB Controller
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao instalar ou verificar o ALB Controller; confira Helm, rollout, contratos e associacao Pod Identity."' ERR
          {
            cluster_name=$(jq -er '.eks.name' /tmp/infra_contract.json)
            region=$(jq -er '.aws_region' /tmp/infra_contract.json)
            vpc_id=$(jq -er '.vpc_id' /tmp/infra_contract.json)
            name_prefix=$(jq -er '.name_prefix' /tmp/infra_contract.json)
            release="${name_prefix}-alb"
            aws eks update-kubeconfig --name "$cluster_name" --region "$region"
            terraform -chdir=phase4/stacks/platform output -json network_controller_contract \
              > /tmp/platform-network-controller.json
            jq -e '.chart == "aws-load-balancer-controller" and .chart_version == "1.14.0" and
              .namespace == "kube-system" and .service_account == "aws-load-balancer-controller" and
              .identity.enabled == true and (.values_yaml | type == "string" and length > 0)' \
              /tmp/platform-network-controller.json > /dev/null
            jq -e --arg cluster "$cluster_name" '.cluster_name == $cluster and
              .namespace == "kube-system" and .service_account == "aws-load-balancer-controller" and
              (.helm_values_overlay | type == "object")' /tmp/platform-controller-identity.json > /dev/null
            jq -er '.values_yaml' /tmp/platform-network-controller.json > /tmp/platform-controller-values.yaml
            jq --arg cluster "$cluster_name" --arg region "$region" --arg vpc "$vpc_id" '
              .helm_values_overlay + {clusterName: $cluster, region: $region, vpcId: $vpc,
                replicaCount: 1, serviceAccount: {create: true, name: "aws-load-balancer-controller"}}
            ' /tmp/platform-controller-identity.json > /tmp/platform-controller-overrides.json
            helm repo add eks https://aws.github.io/eks-charts
            helm repo update eks
            helm upgrade --install "$release" eks/aws-load-balancer-controller \
              --version 1.14.0 --namespace kube-system \
              --values /tmp/platform-controller-values.yaml --values /tmp/platform-controller-overrides.json \
              --wait --timeout 10m
            kubectl get deployments -n kube-system -l "app.kubernetes.io/instance=${release}" \
              -o json --request-timeout=30s > /tmp/platform-controller-deployments.json
            deployment=$(jq -er '.items | if length == 1 then .[0].metadata.name
              else error("Esperado exatamente um Deployment do controller") end' /tmp/platform-controller-deployments.json)
            if ! kubectl rollout status "deployment/${deployment}" -n kube-system --timeout=300s; then
              echo "::error::Rollout do ALB Controller kube-system/${deployment} falhou ou excedeu 300s."
              exit 1
            fi
            aws eks list-pod-identity-associations --cluster-name "$cluster_name" --region "$region" \
              --namespace kube-system --service-account aws-load-balancer-controller \
              > /tmp/platform-controller-associations.json
            if ! jq -e '.associations | length == 1 and all(.[];
              .namespace == "kube-system" and .serviceAccount == "aws-load-balancer-controller")' \
              /tmp/platform-controller-associations.json > /dev/null; then
              echo '::error::Deve existir exatamente uma associacao Pod Identity para kube-system/aws-load-balancer-controller.'
              exit 1
            fi
            association_id=$(jq -er '.associations[0].associationId' /tmp/platform-controller-associations.json)
            aws eks describe-pod-identity-association --cluster-name "$cluster_name" --region "$region" \
              --association-id "$association_id" > /tmp/platform-controller-association.json
            role_arn=$(jq -er --slurpfile contract /tmp/platform-network-controller.json '
              .association | select(.namespace == "kube-system" and
                .serviceAccount == "aws-load-balancer-controller" and .roleArn == $contract[0].identity.role_arn) |
              .roleArn | select(type == "string" and length > 0)' /tmp/platform-controller-association.json)
            kubectl get deployment "$deployment" -n kube-system -o json --request-timeout=30s \
              > /tmp/platform-controller-ready.json
            {
              printf '\n### ALB Controller\n\nChart: `aws-load-balancer-controller`, versao `1.14.0`; Helm `v3.17.3`.\n\n'
              jq -r '"Deployment: kube-system/\(.metadata.name); replicas prontas/desejadas: \(.status.readyReplicas // 0)/\(.spec.replicas)."' \
                /tmp/platform-controller-ready.json
              printf '\nRole da associacao Pod Identity: `%s`.\n' "$role_arn"
            } | tee -a "$GITHUB_STEP_SUMMARY"
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Upload plan, log and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-controller-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/platform-plan.txt
            /tmp/platform.log
            /tmp/platform-diagnostics.txt
            /tmp/platform-receipts.json
          if-no-files-found: warn
          retention-days: 7

      - name: Failure diagnostics
        if: failure()
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao gravar diagnosticos de platform."' ERR
          {
            echo '::group::Failure diagnostics'
            {
              printf '### Failure diagnostics\n\n```text\n'
              if ! test -s "$KUBECONFIG" && test -s /tmp/infra_contract.json; then
                if cluster_name=$(jq -er '.eks.name' /tmp/infra_contract.json); then
                  aws eks update-kubeconfig --name "$cluster_name" --region "$AWS_REGION" || \
                    echo '::error::Nao foi possivel preparar kubeconfig para diagnosticos.'
                else
                  echo '::error::Contrato infra sem nome do cluster para diagnosticos.'
                fi
              fi
              kubectl get pods -A -o wide --request-timeout=30s || echo '::error::Nao foi possivel listar pods.'
              if kubectl get pods -A --field-selector=status.phase!=Running -o json \
                --request-timeout=30s > /tmp/platform-non-running-pods.json; then
                while IFS=$'\t' read -r namespace pod; do
                  kubectl describe pod "$pod" -n "$namespace" --request-timeout=30s || \
                    echo "::error::Nao foi possivel descrever pod ${namespace}/${pod}."
                done < <(jq -r '.items[] | [.metadata.namespace, .metadata.name] | @tsv' /tmp/platform-non-running-pods.json)
              else
                echo '::error::Nao foi possivel consultar pods fora de Running.'
              fi
              kubectl get events -A --sort-by=.lastTimestamp --request-timeout=30s || \
                echo '::error::Nao foi possivel listar eventos.'
              if [[ "$PLATFORM_STAGE" == controller ]] && test -s /tmp/infra_contract.json; then
                if name_prefix=$(jq -er '.name_prefix' /tmp/infra_contract.json); then
                  release="${name_prefix}-alb"
                  helm status "$release" -n kube-system || \
                    echo '::error::Nao foi possivel consultar helm status do ALB Controller.'
                  kubectl logs -n kube-system -l "app.kubernetes.io/instance=${release}" \
                    --tail=100 --all-containers=true --request-timeout=30s || \
                    echo '::error::Nao foi possivel obter logs do ALB Controller.'
                else
                  echo '::error::Contrato infra sem name_prefix para diagnosticos do ALB Controller.'
                fi
              fi
              if [[ "$PLATFORM_STAGE" == apps ]] && test -s /tmp/platform-failed-rollouts.tsv; then
                while IFS=$'\t' read -r namespace deployment selector; do
                  printf '\nDeployment com falha: %s/%s; selector: %s\n' "$namespace" "$deployment" "$selector"
                  kubectl describe deployment "$deployment" -n "$namespace" --request-timeout=30s || \
                    echo "::error::Nao foi possivel descrever Deployment ${namespace}/${deployment}."
                  if kubectl get pods -n "$namespace" -l "$selector" -o json --request-timeout=30s \
                    > /tmp/platform-rollout-pods.json; then
                    while IFS= read -r pod; do
                      kubectl describe pod "$pod" -n "$namespace" --request-timeout=30s || \
                        echo "::error::Nao foi possivel descrever pod ${namespace}/${pod}."
                      kubectl logs "$pod" -n "$namespace" --tail=100 --all-containers=true --request-timeout=30s || \
                        echo "::error::Nao foi possivel obter logs do pod ${namespace}/${pod}."
                    done < <(jq -r '.items[].metadata.name' /tmp/platform-rollout-pods.json)
                  else
                    echo "::error::Nao foi possivel listar pods do Deployment ${namespace}/${deployment}."
                  fi
                done < /tmp/platform-failed-rollouts.tsv
              fi
              printf '```\n\n### Last 200 log lines\n\n```text\n'
              if test -f "$PLATFORM_LOG"; then tail -n 200 "$PLATFORM_LOG"; fi
              printf '```\n'
            } 2>&1 | tee /tmp/platform-diagnostics.txt | tee -a "$GITHUB_STEP_SUMMARY"
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

  edge_alb:
    name: 8 Edge ALB
    needs: [platform_controller]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_WORKSPACE: default
      AWS_REGION: us-east-1
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EDGE_MODE: apply
      EDGE_STAGE: alb
      AUTH_RELEASE_RUN_ID: ${{ github.run_id }}
      EDGE_LOG: /tmp/edge.log
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@v4
        id: credentials
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: edge-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: us-east-1
          role-duration-seconds: 14400
          unset-current-credentials: true

      - uses: hashicorp/setup-terraform@v3
        id: terraform
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Validar entradas do edge
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao validar entradas do edge; confira mode apply e AWS_ROLE_ARN."' ERR
          {
            [[ "$EDGE_MODE" == plan || "$EDGE_MODE" == apply ]]
            test -n "$AWS_ROLE_ARN"
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Download auth_release.json
        id: auth_release
        uses: actions/download-artifact@v4
        with:
          name: auth_release.json
          path: /tmp/edge-auth-release

      - name: Read infra and Platform contracts
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao inicializar infra/platform ou ler platform_contract e edge_contract; confira os states de demo-a e permissoes AWS."' ERR
          {
            for stack in infra platform; do
              terraform -chdir="phase4/stacks/${stack}" init -input=false -no-color \
                -backend-config=bucket=tech-challenge-oficina-terraform-state-b1cfa326 \
                -backend-config="key=phase4/environments/demo-a/${stack}.tfstate" \
                -backend-config=region=us-east-1 \
                -backend-config=encrypt=true \
                -backend-config=use_lockfile=true
            done
            terraform -chdir=phase4/stacks/infra output -json platform_contract > /tmp/infra_contract.json
            terraform -chdir=phase4/stacks/platform output -json > /tmp/edge-platform-outputs.json
            jq -e '.edge_contract | select(.sensitive == false) | .value | select(type == "object")' \
              /tmp/edge-platform-outputs.json > /tmp/edge-platform-contract.json
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Generate Terraform inputs
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao gerar tfvars.json; confira identidade AWS, contratos infra/platform, GitRevision e auth_release.json. Nenhum valor ausente sera presumido."' ERR
          {
            account_id=$(aws sts get-caller-identity --query Account --output text)
            [[ "$account_id" =~ ^[0-9]{12}$ ]]
            [[ "$AWS_ROLE_ARN" =~ ^arn:aws:iam::${account_id}:role/[A-Za-z0-9+=,.@_/-]+$ ]]
            jq -e --arg account "$account_id" '
              .environment_id == "demo-a" and .aws_region == "us-east-1" and
              .aws_account_id == $account and (.tags.GitRevision | test("^[0-9a-f]{40}$"))
            ' /tmp/infra_contract.json
            jq -e --slurpfile infra /tmp/infra_contract.json '
              .environment_id == $infra[0].environment_id and
              .aws_account_id == $infra[0].aws_account_id and .aws_region == $infra[0].aws_region and
              .namespace == $infra[0].name_prefix and .vpc_id == $infra[0].vpc_id and
              ((.private_subnet_ids | sort) == ([$infra[0].private_subnets[].id] | sort))
            ' /tmp/edge-platform-contract.json
            jq -e --slurpfile infra /tmp/infra_contract.json '
              (keys == ["bootstrap_layer_arn", "bootstrap_revision", "bucket", "key", "revision", "sha256_base64", "version_id"]) and
              all(.[]; type == "string") and
              .bucket == ($infra[0].name_prefix + "-artifacts") and
              (.revision | test("^[0-9a-f]{40}$")) and .key == ("auth/" + .revision + "/auth.jar") and
              (.version_id | length > 0) and .version_id != "null" and
              (.sha256_base64 | test("^[A-Za-z0-9+/]{43}=$")) and
              (.bootstrap_revision | test("^[0-9a-f]{40}$")) and
              (.bootstrap_layer_arn | test("^arn:aws:lambda:" + $infra[0].aws_region + ":" +
                $infra[0].aws_account_id + ":layer:" + $infra[0].name_prefix + "-auth-bootstrap:[1-9][0-9]*$"))
            ' /tmp/edge-auth-release/auth_release.json > /dev/null
            jq -n --slurpfile infra /tmp/infra_contract.json \
              --slurpfile platform /tmp/edge-platform-contract.json \
              --slurpfile release /tmp/edge-auth-release/auth_release.json '
              {environment_id: $infra[0].environment_id, aws_region: $infra[0].aws_region,
                aws_account_id: $infra[0].aws_account_id, git_revision: $infra[0].tags.GitRevision,
                approval_source: "catalog", auth_permissions_boundary_arn: null,
                infra_contract: $infra[0], platform_contract: $platform[0],
                publish_auth: true, prepare_alb: false, publish_business: false, publish_webhook: false,
                readiness: {}, auth_release: $release[0], alb_tls: null, alb_listener_arn: null}
            ' > phase4/stacks/edge/tfvars.json
            if [[ "$EDGE_STAGE" == alb || "$EDGE_STAGE" == business ]]; then
              jq '.prepare_alb = true' phase4/stacks/edge/tfvars.json > /tmp/edge-alb-tfvars.json
              mv /tmp/edge-alb-tfvars.json phase4/stacks/edge/tfvars.json
            fi
            declared_variables=$(sed -n 's/^variable "\([^"]*\)".*/\1/p' phase4/stacks/edge/*.tf | sort)
            supplied_variables=$(jq -r 'keys[]' phase4/stacks/edge/tfvars.json | sort)
            [[ "$declared_variables" == "$supplied_variables" ]]
            if [[ "$EDGE_STAGE" == alb || "$EDGE_STAGE" == business ]]; then
              if [[ "$EDGE_STAGE" == business ]]; then
                printf '### Edge publish_business\n\nMode: `%s`; Auth release run: `%s`.\n\nAuth e preparacao ALB mantidos; business habilitado; webhook desabilitado; TLS null; readiness sem atestacoes. Listener descoberto antes do plan.\n' \
                  "$EDGE_MODE" "$AUTH_RELEASE_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
              else
                printf '### Edge prepare_alb\n\nMode: `%s`; Auth release run: `%s`.\n\nAuth mantido; ALB habilitado; business e webhook desabilitados; TLS e listener null; readiness sem atestacoes.\n' \
                  "$EDGE_MODE" "$AUTH_RELEASE_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              printf '### Edge publish_auth\n\nMode: `%s`; Auth release run: `%s`.\n\nBusiness, ALB e webhook desabilitados; TLS e listener null; readiness sem atestacoes.\n' \
                "$EDGE_MODE" "$AUTH_RELEASE_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
            fi
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Terraform init
        working-directory: phase4/stacks/edge
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no terraform init de edge; confira backend e permissoes AWS."' ERR
          {
            terraform init -input=false -no-color \
              -backend-config=bucket=tech-challenge-oficina-terraform-state-b1cfa326 \
              -backend-config=key=phase4/environments/demo-a/edge.tfstate \
              -backend-config=region=us-east-1 \
              -backend-config=encrypt=true \
              -backend-config=use_lockfile=true
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Terraform validate
        working-directory: phase4/stacks/edge
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no terraform validate de edge; confira o diagnostico no log."' ERR
          { terraform validate -no-color; } 2>&1 | tee -a "$EDGE_LOG"

      - name: Terraform plan
        working-directory: phase4/stacks/edge
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no terraform plan de edge; confira contratos, artefato Auth e permissoes AWS."' ERR
          {
            terraform plan -input=false -no-color -lock-timeout=5m -var-file=tfvars.json -out=tfplan
            terraform show -no-color tfplan > /tmp/edge-plan.txt
            {
              printf '\n### Terraform plan\n\n```text\n'
              cat /tmp/edge-plan.txt
              printf '```\n'
            } >> "$GITHUB_STEP_SUMMARY"
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Terraform apply
        working-directory: phase4/stacks/edge
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no terraform apply de edge; confira log e state antes de repetir."' ERR
          { terraform apply -input=false -no-color -lock-timeout=5m tfplan; } 2>&1 | tee -a "$EDGE_LOG"

      - name: Export edge outputs
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao exportar outputs de edge ou resumir endpoint, issuer e JWKS sem valores sensiveis."' ERR
          {
            terraform -chdir=phase4/stacks/edge output -json > /tmp/edge-outputs.json
            jq -er '
              if .edge_contract.sensitive == false and .jwt_contract.sensitive == false then
                "\n### Edge endpoints\n\nAPI Gateway: " + .edge_contract.value.api_endpoint +
                "\n\nIssuer: " + .jwt_contract.value.issuer + "\n\nJWKS: " + .jwt_contract.value.jwks_uri
              else error("Outputs ausentes ou sensiveis") end
            ' /tmp/edge-outputs.json >> "$GITHUB_STEP_SUMMARY"
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Upload edge-outputs.json
        id: outputs
        uses: actions/upload-artifact@v4
        with:
          name: edge-outputs-alb-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/edge-outputs.json
          if-no-files-found: error
          retention-days: 7

      - name: Smoke test JWKS
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no smoke test JWKS; endpoint deve responder com .keys contendo pelo menos uma chave em ate 120s."' ERR
          {
            jwks_uri=$(jq -er '.jwt_contract | select(.sensitive == false) | .value.jwks_uri |
              select(type == "string" and startswith("https://"))' /tmp/edge-outputs.json)
            deadline=$((SECONDS + 120))
            ready=false
            while (( SECONDS < deadline )); do
              remaining=$((deadline - SECONDS))
              if curl --fail --silent --show-error --proto '=https' --connect-timeout 10 \
                --max-time "$remaining" "$jwks_uri" -o /tmp/edge-jwks.json &&
                jq -e '.keys | type == "array" and length >= 1' /tmp/edge-jwks.json > /dev/null; then
                ready=true
                break
              fi
              remaining=$((deadline - SECONDS))
              if (( remaining > 0 )); then
                sleep "$((remaining < 5 ? remaining : 5))"
              fi
            done
            [[ "$ready" == true ]]
            printf '\n### Smoke test\n\nJWKS respondeu com pelo menos uma chave.\n' >> "$GITHUB_STEP_SUMMARY"
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Apply ALB manifests
        env:
          KUBECONFIG: /tmp/edge-kubeconfig
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao exportar ou aplicar manifests ALB; confira contrato EKS, namespaces e controller."' ERR
          {
            terraform -chdir=phase4/stacks/edge output -json manifests > /tmp/edge-manifests-output.json
            jq -e 'fromjson | select(.kind == "List" and (.items | length > 0))' \
              /tmp/edge-manifests-output.json > /tmp/edge-manifests.json
            jq -er '[.items[] | select(.kind == "Ingress" or .kind == "NetworkPolicy") |
              .metadata.namespace] | unique |
              if length > 0 and all(.[]; type == "string" and length > 0)
                then .[] else error("Namespaces ausentes nos manifests ALB") end' \
              /tmp/edge-manifests.json > /tmp/edge-alb-namespaces.txt
            jq -e '[.items[] | select(.kind == "Ingress") | . as $ingress |
              .spec.rules[].http.paths[] |
              {namespace: $ingress.metadata.namespace, service: .backend.service.name,
                port: .backend.service.port.number}] | unique |
              select(length > 0 and all(.[];
                (.service | type == "string" and length > 0) and (.port | type == "number")))' \
              /tmp/edge-manifests.json > /tmp/edge-alb-services.json
            cluster_name=$(jq -er '.eks.name' /tmp/infra_contract.json)
            aws eks update-kubeconfig --name "$cluster_name" --region "$AWS_REGION"
            while IFS= read -r namespace; do
              kubectl get namespace "$namespace" -o name --request-timeout=30s
            done < /tmp/edge-alb-namespaces.txt
            kubectl apply -f /tmp/edge-manifests.json
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Wait for ALB and discover HTTP listener
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao aguardar ALB interno ou descobrir listener HTTP/80 unico; confira VPC, SG, controller e permissoes AWS."' ERR
          {
            alb_name=$(jq -er '.edge_contract | select(.sensitive == false) | .value.alb_name' /tmp/edge-outputs.json)
            deadline=$((SECONDS + 300))
            found=false
            while (( SECONDS < deadline )); do
              remaining=$((deadline - SECONDS))
              if timeout "${remaining}s" aws elbv2 describe-load-balancers --names "$alb_name" \
                > /tmp/edge-alb.json 2> /tmp/edge-alb-discovery-error.txt; then
                jq -e '.LoadBalancers | length == 1' /tmp/edge-alb.json > /dev/null
                found=true
                break
              elif ! grep -q 'LoadBalancerNotFound' /tmp/edge-alb-discovery-error.txt; then
                cat /tmp/edge-alb-discovery-error.txt
                echo '::error::Falha na consulta do ALB; somente LoadBalancerNotFound permite nova tentativa.'
                exit 1
              fi
              remaining=$((deadline - SECONDS))
              if (( remaining > 0 )); then sleep "$((remaining < 5 ? remaining : 5))"; fi
            done
            if [[ "$found" != true ]]; then
              echo "::error::ALB ${alb_name} nao foi encontrado em ate 5 minutos."
              exit 1
            fi
            alb_arn=$(jq -er '.LoadBalancers[0].LoadBalancerArn' /tmp/edge-alb.json)
            aws elbv2 wait load-balancer-available --load-balancer-arns "$alb_arn"
            aws elbv2 describe-load-balancers --load-balancer-arns "$alb_arn" > /tmp/edge-alb.json
            jq -e --slurpfile infra /tmp/infra_contract.json --slurpfile edge /tmp/edge-outputs.json '
              .LoadBalancers | length == 1 and all(.[];
                .Scheme == "internal" and .Type == "application" and .State.Code == "active" and
                .VpcId == $infra[0].vpc_id and .LoadBalancerName == $edge[0].edge_contract.value.alb_name and
                .SecurityGroups == [$edge[0].edge_contract.value.alb_security_group_id])
            ' /tmp/edge-alb.json > /dev/null
            aws elbv2 describe-listeners --load-balancer-arn "$alb_arn" > /tmp/edge-alb-listeners.json
            listener_arn=$(jq -er '[.Listeners[] | select(.Protocol == "HTTP" and .Port == 80)] |
              if length == 1 then .[0].ListenerArn else error("Esperado exatamente um listener HTTP/80") end' \
              /tmp/edge-alb-listeners.json)
            alb_dns=$(jq -er '.LoadBalancers[0].DNSName' /tmp/edge-alb.json)
            printf '\n### ALB interno\n\nDNS: `%s`\n\nListener HTTP/80: `%s`\n' \
              "$alb_dns" "$listener_arn" | tee -a "$GITHUB_STEP_SUMMARY"
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Wait for healthy ALB targets
        env:
          KUBECONFIG: /tmp/edge-kubeconfig
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao verificar targets do ALB; todos os servicos devem ter target group e todos os groups devem ter targets healthy em ate 5 minutos."' ERR
          {
            alb_arn=$(jq -er '.LoadBalancers[0].LoadBalancerArn' /tmp/edge-alb.json)
            service_count=$(jq -er 'length | select(. > 0)' /tmp/edge-alb-services.json)
            deadline=$((SECONDS + 300))
            ready=false
            target_rows=()
            while (( SECONDS < deadline )); do
              remaining=$((deadline - SECONDS))
              timeout "${remaining}s" aws elbv2 describe-target-groups --load-balancer-arn "$alb_arn" \
                > /tmp/edge-alb-target-groups.json
              all_healthy=true
              target_rows=()
              group_count=$(jq -er '.TargetGroups | length' /tmp/edge-alb-target-groups.json)
              if (( group_count < service_count )); then all_healthy=false; fi
              jq -r '.TargetGroups[].TargetGroupArn' /tmp/edge-alb-target-groups.json > /tmp/edge-alb-target-group-arns.txt
              while IFS= read -r group_arn; do
                remaining=$((deadline - SECONDS))
                if (( remaining <= 0 )); then all_healthy=false; break; fi
                timeout "${remaining}s" aws elbv2 describe-target-health --target-group-arn "$group_arn" \
                  > /tmp/edge-alb-target-health.json
                total=$(jq -er '.TargetHealthDescriptions | length' /tmp/edge-alb-target-health.json)
                healthy=$(jq -er '[.TargetHealthDescriptions[] | select(.TargetHealth.State == "healthy")] | length' \
                  /tmp/edge-alb-target-health.json)
                target_rows+=("| ${group_arn} | ${healthy}/${total} |")
                if (( total == 0 || healthy != total )); then all_healthy=false; fi
              done < /tmp/edge-alb-target-group-arns.txt
              bindings='[]'
              while IFS= read -r namespace; do
                remaining=$((deadline - SECONDS))
                if (( remaining <= 0 )); then all_healthy=false; break; fi
                timeout "${remaining}s" kubectl get targetgroupbindings.elbv2.k8s.aws -n "$namespace" \
                  -o json --request-timeout=30s > /tmp/edge-alb-namespace-bindings.json
                bindings=$(jq -c --argjson existing "$bindings" '$existing + .items' /tmp/edge-alb-namespace-bindings.json)
              done < /tmp/edge-alb-namespaces.txt
              printf '%s\n' "$bindings" > /tmp/edge-alb-bindings.json
              if ! jq -e --slurpfile groups /tmp/edge-alb-target-groups.json --slurpfile bindings /tmp/edge-alb-bindings.json '
                all(.[]; . as $service | any($bindings[0][];
                  .metadata.namespace == $service.namespace and .spec.serviceRef.name == $service.service and
                  .spec.serviceRef.port == $service.port and
                  (.spec.targetGroupARN as $arn | any($groups[0].TargetGroups[]; .TargetGroupArn == $arn))))
              ' /tmp/edge-alb-services.json > /dev/null; then
                all_healthy=false
              fi
              if [[ "$all_healthy" == true ]] && (( SECONDS < deadline )); then ready=true; break; fi
              remaining=$((deadline - SECONDS))
              if (( remaining > 0 )); then sleep "$((remaining < 5 ? remaining : 5))"; fi
            done
            {
              printf '\n### Target groups ALB\n\nServicos derivados dos Ingresses: %s.\n\n' "$service_count"
              printf '| Target group | Targets healthy/total |\n| --- | --- |\n'
              if (( ${#target_rows[@]} > 0 )); then printf '%s\n' "${target_rows[@]}"; fi
            } | tee -a "$GITHUB_STEP_SUMMARY"
            if [[ "$ready" != true ]]; then
              echo '::error::ALB nao ficou pronto em ate 5 minutos: servico sem target group, group vazio ou target nao healthy.'
              exit 1
            fi
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Failure diagnostics
        if: failure()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          CREDENTIALS_OUTCOME: ${{ steps.credentials.outcome }}
          TERRAFORM_OUTCOME: ${{ steps.terraform.outcome }}
          RELEASE_OUTCOME: ${{ steps.auth_release.outcome }}
          OUTPUTS_OUTCOME: ${{ steps.outputs.outcome }}
          KUBECONFIG: /tmp/edge-kubeconfig
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao registrar diagnosticos de edge."' ERR
          for action in CHECKOUT CREDENTIALS TERRAFORM RELEASE OUTPUTS; do
            outcome_variable="${action}_OUTCOME"
            if [[ "${!outcome_variable}" == failure ]]; then
              echo "::error::Falha na action ${action}; confira checkout, OIDC, instalacao do Terraform ou transferencia de artifacts conforme o passo indicado."
            fi
          done
          {
            printf '\n### Last 200 log lines\n\n```text\n'
            if test -f "$EDGE_LOG"; then tail -n 200 "$EDGE_LOG"; fi
            printf '```\n'
            lambda_name=''
            if test -s /tmp/edge-outputs.json; then
              lambda_name=$(jq -r '
                [.lambda_function_name?, .auth_lambda_function_name?,
                  (.edge_contract? | select(.sensitive == false) | .value |
                    {sensitive: false, value: (.lambda_function_name? // .auth_lambda_function_name?)})] |
                map(select(.sensitive == false and (.value | type == "string" and length > 0))) |
                .[0].value // empty
              ' /tmp/edge-outputs.json) || lambda_name=''
            fi
            if [[ -n "$lambda_name" ]]; then
              printf '\n### Lambda: ultimas 50 linhas\n\n```text\n'
              aws logs tail "/aws/lambda/${lambda_name}" --since 1h --format short 2>&1 | tail -n 50 || \
                echo '::error::Nao foi possivel consultar o log group da Lambda.'
              printf '```\n'
            else
              printf '\nDiagnostico Lambda pulado: nome nao disponivel nos outputs do edge.\n'
            fi
            if [[ "$EDGE_STAGE" == alb || "$EDGE_STAGE" == business ]]; then
              printf '\n### Diagnosticos ALB\n\n```text\n'
              if test -s /tmp/infra_contract.json; then
                if cluster_name=$(jq -er '.eks.name' /tmp/infra_contract.json); then
                  aws eks update-kubeconfig --name "$cluster_name" --region "$AWS_REGION" || \
                    echo '::error::Nao foi possivel preparar kubeconfig para diagnosticos ALB.'
                fi
                if alb_name=$(jq -er '.name_prefix + "-edge"' /tmp/infra_contract.json) &&
                  aws elbv2 describe-load-balancers --names "$alb_name" > /tmp/edge-diagnostic-alb.json &&
                  alb_arn=$(jq -er '.LoadBalancers[0].LoadBalancerArn' /tmp/edge-diagnostic-alb.json) &&
                  aws elbv2 describe-target-groups --load-balancer-arn "$alb_arn" > /tmp/edge-diagnostic-groups.json; then
                  while IFS= read -r group_arn; do
                    printf '\nTarget group: %s\n' "$group_arn"
                    if aws elbv2 describe-target-health --target-group-arn "$group_arn" > /tmp/edge-diagnostic-health.json; then
                      cat /tmp/edge-diagnostic-health.json
                      jq '[.TargetHealthDescriptions[] | select(.TargetHealth.State != "healthy") |
                        {Target: .Target, State: .TargetHealth.State, Reason: .TargetHealth.Reason,
                          Description: .TargetHealth.Description}]' /tmp/edge-diagnostic-health.json
                    else
                      echo "::error::Nao foi possivel consultar targets de ${group_arn}."
                    fi
                  done < <(jq -r '.TargetGroups[].TargetGroupArn' /tmp/edge-diagnostic-groups.json)
                else
                  echo '::error::Nao foi possivel descobrir ALB/target groups para diagnosticos.'
                fi
              fi
              kubectl get ingress -A --request-timeout=30s || echo '::error::Nao foi possivel listar Ingresses.'
              kubectl describe ingress -A --request-timeout=30s || echo '::error::Nao foi possivel descrever Ingresses.'
              kubectl logs -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller \
                --tail=100 --all-containers=true --request-timeout=30s || \
                echo '::error::Nao foi possivel obter logs do ALB Controller.'
              printf '```\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY" 2>&1

  edge_business:
    name: 9 Edge rotas de negocio
    needs: [edge_alb]
    outputs:
      api_endpoint: ${{ steps.endpoints.outputs.api_endpoint }}
      alb_dns: ${{ steps.endpoints.outputs.alb_dns }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_WORKSPACE: default
      AWS_REGION: us-east-1
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EDGE_MODE: apply
      EDGE_STAGE: business
      AUTH_RELEASE_RUN_ID: ${{ github.run_id }}
      EDGE_LOG: /tmp/edge.log
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@v4
        id: credentials
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: edge-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: us-east-1
          role-duration-seconds: 14400
          unset-current-credentials: true

      - uses: hashicorp/setup-terraform@v3
        id: terraform
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Validar entradas do edge
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao validar entradas do edge; confira mode apply e AWS_ROLE_ARN."' ERR
          {
            [[ "$EDGE_MODE" == plan || "$EDGE_MODE" == apply ]]
            test -n "$AWS_ROLE_ARN"
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Download auth_release.json
        id: auth_release
        uses: actions/download-artifact@v4
        with:
          name: auth_release.json
          path: /tmp/edge-auth-release

      - name: Read infra and Platform contracts
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao inicializar infra/platform ou ler platform_contract e edge_contract; confira os states de demo-a e permissoes AWS."' ERR
          {
            for stack in infra platform; do
              terraform -chdir="phase4/stacks/${stack}" init -input=false -no-color \
                -backend-config=bucket=tech-challenge-oficina-terraform-state-b1cfa326 \
                -backend-config="key=phase4/environments/demo-a/${stack}.tfstate" \
                -backend-config=region=us-east-1 \
                -backend-config=encrypt=true \
                -backend-config=use_lockfile=true
            done
            terraform -chdir=phase4/stacks/infra output -json platform_contract > /tmp/infra_contract.json
            terraform -chdir=phase4/stacks/platform output -json > /tmp/edge-platform-outputs.json
            jq -e '.edge_contract | select(.sensitive == false) | .value | select(type == "object")' \
              /tmp/edge-platform-outputs.json > /tmp/edge-platform-contract.json
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Generate Terraform inputs
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao gerar tfvars.json; confira identidade AWS, contratos infra/platform, GitRevision e auth_release.json. Nenhum valor ausente sera presumido."' ERR
          {
            account_id=$(aws sts get-caller-identity --query Account --output text)
            [[ "$account_id" =~ ^[0-9]{12}$ ]]
            [[ "$AWS_ROLE_ARN" =~ ^arn:aws:iam::${account_id}:role/[A-Za-z0-9+=,.@_/-]+$ ]]
            jq -e --arg account "$account_id" '
              .environment_id == "demo-a" and .aws_region == "us-east-1" and
              .aws_account_id == $account and (.tags.GitRevision | test("^[0-9a-f]{40}$"))
            ' /tmp/infra_contract.json
            jq -e --slurpfile infra /tmp/infra_contract.json '
              .environment_id == $infra[0].environment_id and
              .aws_account_id == $infra[0].aws_account_id and .aws_region == $infra[0].aws_region and
              .namespace == $infra[0].name_prefix and .vpc_id == $infra[0].vpc_id and
              ((.private_subnet_ids | sort) == ([$infra[0].private_subnets[].id] | sort))
            ' /tmp/edge-platform-contract.json
            jq -e --slurpfile infra /tmp/infra_contract.json '
              (keys == ["bootstrap_layer_arn", "bootstrap_revision", "bucket", "key", "revision", "sha256_base64", "version_id"]) and
              all(.[]; type == "string") and
              .bucket == ($infra[0].name_prefix + "-artifacts") and
              (.revision | test("^[0-9a-f]{40}$")) and .key == ("auth/" + .revision + "/auth.jar") and
              (.version_id | length > 0) and .version_id != "null" and
              (.sha256_base64 | test("^[A-Za-z0-9+/]{43}=$")) and
              (.bootstrap_revision | test("^[0-9a-f]{40}$")) and
              (.bootstrap_layer_arn | test("^arn:aws:lambda:" + $infra[0].aws_region + ":" +
                $infra[0].aws_account_id + ":layer:" + $infra[0].name_prefix + "-auth-bootstrap:[1-9][0-9]*$"))
            ' /tmp/edge-auth-release/auth_release.json > /dev/null
            jq -n --slurpfile infra /tmp/infra_contract.json \
              --slurpfile platform /tmp/edge-platform-contract.json \
              --slurpfile release /tmp/edge-auth-release/auth_release.json '
              {environment_id: $infra[0].environment_id, aws_region: $infra[0].aws_region,
                aws_account_id: $infra[0].aws_account_id, git_revision: $infra[0].tags.GitRevision,
                approval_source: "catalog", auth_permissions_boundary_arn: null,
                infra_contract: $infra[0], platform_contract: $platform[0],
                publish_auth: true, prepare_alb: false, publish_business: false, publish_webhook: false,
                readiness: {}, auth_release: $release[0], alb_tls: null, alb_listener_arn: null}
            ' > phase4/stacks/edge/tfvars.json
            if [[ "$EDGE_STAGE" == alb || "$EDGE_STAGE" == business ]]; then
              jq '.prepare_alb = true' phase4/stacks/edge/tfvars.json > /tmp/edge-alb-tfvars.json
              mv /tmp/edge-alb-tfvars.json phase4/stacks/edge/tfvars.json
            fi
            declared_variables=$(sed -n 's/^variable "\([^"]*\)".*/\1/p' phase4/stacks/edge/*.tf | sort)
            supplied_variables=$(jq -r 'keys[]' phase4/stacks/edge/tfvars.json | sort)
            [[ "$declared_variables" == "$supplied_variables" ]]
            if [[ "$EDGE_STAGE" == alb || "$EDGE_STAGE" == business ]]; then
              if [[ "$EDGE_STAGE" == business ]]; then
                printf '### Edge publish_business\n\nMode: `%s`; Auth release run: `%s`.\n\nAuth e preparacao ALB mantidos; business habilitado; webhook desabilitado; TLS null; readiness sem atestacoes. Listener descoberto antes do plan.\n' \
                  "$EDGE_MODE" "$AUTH_RELEASE_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
              else
                printf '### Edge prepare_alb\n\nMode: `%s`; Auth release run: `%s`.\n\nAuth mantido; ALB habilitado; business e webhook desabilitados; TLS e listener null; readiness sem atestacoes.\n' \
                  "$EDGE_MODE" "$AUTH_RELEASE_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              printf '### Edge publish_auth\n\nMode: `%s`; Auth release run: `%s`.\n\nBusiness, ALB e webhook desabilitados; TLS e listener null; readiness sem atestacoes.\n' \
                "$EDGE_MODE" "$AUTH_RELEASE_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
            fi
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Discover business listener before plan
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao descobrir ou validar listener de negocio antes do plan; confira ALB existente, HTTP/80 e contrato infra."' ERR
          {
            name_prefix=$(jq -er '.name_prefix' /tmp/infra_contract.json)
            region=$(jq -er '.aws_region' /tmp/infra_contract.json)
            account_id=$(jq -er '.aws_account_id' /tmp/infra_contract.json)
            alb_name="${name_prefix}-edge"
            if ! aws elbv2 describe-load-balancers --names "$alb_name" > /tmp/edge-business-alb.json; then
              echo "::error::ALB ${alb_name} deve existir para publicar negocio; rode stage=alb mode=apply antes e confira as permissoes AWS."
              exit 1
            fi
            if ! jq -e '.LoadBalancers | length == 1' /tmp/edge-business-alb.json > /dev/null; then
              echo '::error::Esperado exatamente um ALB existente; rode stage=alb mode=apply antes.'
              exit 1
            fi
            alb_arn=$(jq -er '.LoadBalancers[0].LoadBalancerArn' /tmp/edge-business-alb.json)
            aws elbv2 describe-listeners --load-balancer-arn "$alb_arn" > /tmp/edge-business-listeners.json
            if ! listener_arn=$(jq -er '[.Listeners[] | select(.Protocol == "HTTP" and .Port == 80)] |
              if length == 1 then .[0].ListenerArn else error("Esperado exatamente um listener HTTP/80") end' \
              /tmp/edge-business-listeners.json); then
              echo '::error::Publicacao de negocio exige exatamente um listener HTTP/80 no ALB existente.'
              exit 1
            fi
            listener_pattern="^arn:aws:elasticloadbalancing:${region}:${account_id}:listener/app/${name_prefix}-edge/[0-9a-f]{16}/[0-9a-f]{16}$"
            if [[ ! "$listener_arn" =~ $listener_pattern ]]; then
              echo '::error::ARN do listener rejeitado pelo formato exigido em phase4/stacks/edge/variables.tf.'
              exit 1
            fi
            jq --arg listener "$listener_arn" '.publish_business = true | .alb_listener_arn = $listener' \
              phase4/stacks/edge/tfvars.json > /tmp/edge-business-tfvars.json
            mv /tmp/edge-business-tfvars.json phase4/stacks/edge/tfvars.json
            printf '\nListener de negocio observado antes do plan: `%s`.\n' "$listener_arn" >> "$GITHUB_STEP_SUMMARY"
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Terraform init
        working-directory: phase4/stacks/edge
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no terraform init de edge; confira backend e permissoes AWS."' ERR
          {
            terraform init -input=false -no-color \
              -backend-config=bucket=tech-challenge-oficina-terraform-state-b1cfa326 \
              -backend-config=key=phase4/environments/demo-a/edge.tfstate \
              -backend-config=region=us-east-1 \
              -backend-config=encrypt=true \
              -backend-config=use_lockfile=true
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Terraform validate
        working-directory: phase4/stacks/edge
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no terraform validate de edge; confira o diagnostico no log."' ERR
          { terraform validate -no-color; } 2>&1 | tee -a "$EDGE_LOG"

      - name: Terraform plan
        working-directory: phase4/stacks/edge
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no terraform plan de edge; confira contratos, artefato Auth e permissoes AWS."' ERR
          {
            terraform plan -input=false -no-color -lock-timeout=5m -var-file=tfvars.json -out=tfplan
            terraform show -no-color tfplan > /tmp/edge-plan.txt
            {
              printf '\n### Terraform plan\n\n```text\n'
              cat /tmp/edge-plan.txt
              printf '```\n'
            } >> "$GITHUB_STEP_SUMMARY"
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Terraform apply
        working-directory: phase4/stacks/edge
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no terraform apply de edge; confira log e state antes de repetir."' ERR
          { terraform apply -input=false -no-color -lock-timeout=5m tfplan; } 2>&1 | tee -a "$EDGE_LOG"

      - name: Export edge outputs
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao exportar outputs de edge ou resumir endpoint, issuer e JWKS sem valores sensiveis."' ERR
          {
            terraform -chdir=phase4/stacks/edge output -json > /tmp/edge-outputs.json
            jq -er '
              if .edge_contract.sensitive == false and .jwt_contract.sensitive == false then
                "\n### Edge endpoints\n\nAPI Gateway: " + .edge_contract.value.api_endpoint +
                "\n\nIssuer: " + .jwt_contract.value.issuer + "\n\nJWKS: " + .jwt_contract.value.jwks_uri
              else error("Outputs ausentes ou sensiveis") end
            ' /tmp/edge-outputs.json >> "$GITHUB_STEP_SUMMARY"
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Upload edge-outputs.json
        id: outputs
        uses: actions/upload-artifact@v4
        with:
          name: edge-outputs-business-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/edge-outputs.json
          if-no-files-found: error
          retention-days: 7

      - name: Smoke test JWKS
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no smoke test JWKS; endpoint deve responder com .keys contendo pelo menos uma chave em ate 120s."' ERR
          {
            jwks_uri=$(jq -er '.jwt_contract | select(.sensitive == false) | .value.jwks_uri |
              select(type == "string" and startswith("https://"))' /tmp/edge-outputs.json)
            deadline=$((SECONDS + 120))
            ready=false
            while (( SECONDS < deadline )); do
              remaining=$((deadline - SECONDS))
              if curl --fail --silent --show-error --proto '=https' --connect-timeout 10 \
                --max-time "$remaining" "$jwks_uri" -o /tmp/edge-jwks.json &&
                jq -e '.keys | type == "array" and length >= 1' /tmp/edge-jwks.json > /dev/null; then
                ready=true
                break
              fi
              remaining=$((deadline - SECONDS))
              if (( remaining > 0 )); then
                sleep "$((remaining < 5 ? remaining : 5))"
              fi
            done
            [[ "$ready" == true ]]
            printf '\n### Smoke test\n\nJWKS respondeu com pelo menos uma chave.\n' >> "$GITHUB_STEP_SUMMARY"
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Apply ALB manifests
        env:
          KUBECONFIG: /tmp/edge-kubeconfig
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao exportar ou aplicar manifests ALB; confira contrato EKS, namespaces e controller."' ERR
          {
            terraform -chdir=phase4/stacks/edge output -json manifests > /tmp/edge-manifests-output.json
            jq -e 'fromjson | select(.kind == "List" and (.items | length > 0))' \
              /tmp/edge-manifests-output.json > /tmp/edge-manifests.json
            jq -er '[.items[] | select(.kind == "Ingress" or .kind == "NetworkPolicy") |
              .metadata.namespace] | unique |
              if length > 0 and all(.[]; type == "string" and length > 0)
                then .[] else error("Namespaces ausentes nos manifests ALB") end' \
              /tmp/edge-manifests.json > /tmp/edge-alb-namespaces.txt
            jq -e '[.items[] | select(.kind == "Ingress") | . as $ingress |
              .spec.rules[].http.paths[] |
              {namespace: $ingress.metadata.namespace, service: .backend.service.name,
                port: .backend.service.port.number}] | unique |
              select(length > 0 and all(.[];
                (.service | type == "string" and length > 0) and (.port | type == "number")))' \
              /tmp/edge-manifests.json > /tmp/edge-alb-services.json
            cluster_name=$(jq -er '.eks.name' /tmp/infra_contract.json)
            aws eks update-kubeconfig --name "$cluster_name" --region "$AWS_REGION"
            while IFS= read -r namespace; do
              kubectl get namespace "$namespace" -o name --request-timeout=30s
            done < /tmp/edge-alb-namespaces.txt
            kubectl apply -f /tmp/edge-manifests.json
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Wait for ALB and discover HTTP listener
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao aguardar ALB interno ou descobrir listener HTTP/80 unico; confira VPC, SG, controller e permissoes AWS."' ERR
          {
            alb_name=$(jq -er '.edge_contract | select(.sensitive == false) | .value.alb_name' /tmp/edge-outputs.json)
            deadline=$((SECONDS + 300))
            found=false
            while (( SECONDS < deadline )); do
              remaining=$((deadline - SECONDS))
              if timeout "${remaining}s" aws elbv2 describe-load-balancers --names "$alb_name" \
                > /tmp/edge-alb.json 2> /tmp/edge-alb-discovery-error.txt; then
                jq -e '.LoadBalancers | length == 1' /tmp/edge-alb.json > /dev/null
                found=true
                break
              elif ! grep -q 'LoadBalancerNotFound' /tmp/edge-alb-discovery-error.txt; then
                cat /tmp/edge-alb-discovery-error.txt
                echo '::error::Falha na consulta do ALB; somente LoadBalancerNotFound permite nova tentativa.'
                exit 1
              fi
              remaining=$((deadline - SECONDS))
              if (( remaining > 0 )); then sleep "$((remaining < 5 ? remaining : 5))"; fi
            done
            if [[ "$found" != true ]]; then
              echo "::error::ALB ${alb_name} nao foi encontrado em ate 5 minutos."
              exit 1
            fi
            alb_arn=$(jq -er '.LoadBalancers[0].LoadBalancerArn' /tmp/edge-alb.json)
            aws elbv2 wait load-balancer-available --load-balancer-arns "$alb_arn"
            aws elbv2 describe-load-balancers --load-balancer-arns "$alb_arn" > /tmp/edge-alb.json
            jq -e --slurpfile infra /tmp/infra_contract.json --slurpfile edge /tmp/edge-outputs.json '
              .LoadBalancers | length == 1 and all(.[];
                .Scheme == "internal" and .Type == "application" and .State.Code == "active" and
                .VpcId == $infra[0].vpc_id and .LoadBalancerName == $edge[0].edge_contract.value.alb_name and
                .SecurityGroups == [$edge[0].edge_contract.value.alb_security_group_id])
            ' /tmp/edge-alb.json > /dev/null
            aws elbv2 describe-listeners --load-balancer-arn "$alb_arn" > /tmp/edge-alb-listeners.json
            listener_arn=$(jq -er '[.Listeners[] | select(.Protocol == "HTTP" and .Port == 80)] |
              if length == 1 then .[0].ListenerArn else error("Esperado exatamente um listener HTTP/80") end' \
              /tmp/edge-alb-listeners.json)
            alb_dns=$(jq -er '.LoadBalancers[0].DNSName' /tmp/edge-alb.json)
            printf '\n### ALB interno\n\nDNS: `%s`\n\nListener HTTP/80: `%s`\n' \
              "$alb_dns" "$listener_arn" | tee -a "$GITHUB_STEP_SUMMARY"
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Wait for healthy ALB targets
        env:
          KUBECONFIG: /tmp/edge-kubeconfig
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao verificar targets do ALB; todos os servicos devem ter target group e todos os groups devem ter targets healthy em ate 5 minutos."' ERR
          {
            alb_arn=$(jq -er '.LoadBalancers[0].LoadBalancerArn' /tmp/edge-alb.json)
            service_count=$(jq -er 'length | select(. > 0)' /tmp/edge-alb-services.json)
            deadline=$((SECONDS + 300))
            ready=false
            target_rows=()
            while (( SECONDS < deadline )); do
              remaining=$((deadline - SECONDS))
              timeout "${remaining}s" aws elbv2 describe-target-groups --load-balancer-arn "$alb_arn" \
                > /tmp/edge-alb-target-groups.json
              all_healthy=true
              target_rows=()
              group_count=$(jq -er '.TargetGroups | length' /tmp/edge-alb-target-groups.json)
              if (( group_count < service_count )); then all_healthy=false; fi
              jq -r '.TargetGroups[].TargetGroupArn' /tmp/edge-alb-target-groups.json > /tmp/edge-alb-target-group-arns.txt
              while IFS= read -r group_arn; do
                remaining=$((deadline - SECONDS))
                if (( remaining <= 0 )); then all_healthy=false; break; fi
                timeout "${remaining}s" aws elbv2 describe-target-health --target-group-arn "$group_arn" \
                  > /tmp/edge-alb-target-health.json
                total=$(jq -er '.TargetHealthDescriptions | length' /tmp/edge-alb-target-health.json)
                healthy=$(jq -er '[.TargetHealthDescriptions[] | select(.TargetHealth.State == "healthy")] | length' \
                  /tmp/edge-alb-target-health.json)
                target_rows+=("| ${group_arn} | ${healthy}/${total} |")
                if (( total == 0 || healthy != total )); then all_healthy=false; fi
              done < /tmp/edge-alb-target-group-arns.txt
              bindings='[]'
              while IFS= read -r namespace; do
                remaining=$((deadline - SECONDS))
                if (( remaining <= 0 )); then all_healthy=false; break; fi
                timeout "${remaining}s" kubectl get targetgroupbindings.elbv2.k8s.aws -n "$namespace" \
                  -o json --request-timeout=30s > /tmp/edge-alb-namespace-bindings.json
                bindings=$(jq -c --argjson existing "$bindings" '$existing + .items' /tmp/edge-alb-namespace-bindings.json)
              done < /tmp/edge-alb-namespaces.txt
              printf '%s\n' "$bindings" > /tmp/edge-alb-bindings.json
              if ! jq -e --slurpfile groups /tmp/edge-alb-target-groups.json --slurpfile bindings /tmp/edge-alb-bindings.json '
                all(.[]; . as $service | any($bindings[0][];
                  .metadata.namespace == $service.namespace and .spec.serviceRef.name == $service.service and
                  .spec.serviceRef.port == $service.port and
                  (.spec.targetGroupARN as $arn | any($groups[0].TargetGroups[]; .TargetGroupArn == $arn))))
              ' /tmp/edge-alb-services.json > /dev/null; then
                all_healthy=false
              fi
              if [[ "$all_healthy" == true ]] && (( SECONDS < deadline )); then ready=true; break; fi
              remaining=$((deadline - SECONDS))
              if (( remaining > 0 )); then sleep "$((remaining < 5 ? remaining : 5))"; fi
            done
            {
              printf '\n### Target groups ALB\n\nServicos derivados dos Ingresses: %s.\n\n' "$service_count"
              printf '| Target group | Targets healthy/total |\n| --- | --- |\n'
              if (( ${#target_rows[@]} > 0 )); then printf '%s\n' "${target_rows[@]}"; fi
            } | tee -a "$GITHUB_STEP_SUMMARY"
            if [[ "$ready" != true ]]; then
              echo '::error::ALB nao ficou pronto em ate 5 minutos: servico sem target group, group vazio ou target nao healthy.'
              exit 1
            fi
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Smoke test business
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no smoke test de negocio; confira status HTTP e corpos resumidos no log."' ERR
          {
            api=$(jq -er '.edge_contract | select(.sensitive == false) | .value.api_endpoint |
              select(type == "string" and startswith("https://"))' /tmp/edge-outputs.json)
            paths=(/api/v1/clientes /actuator/health /.well-known/jwks.json)
            statuses=(000 000 000)
            deadline=$((SECONDS + 120))
            ready=false
            attempt=0
            while (( SECONDS < deadline )); do
              attempt=$((attempt + 1))
              for index in "${!paths[@]}"; do
                remaining=$((deadline - SECONDS))
                if (( remaining <= 0 )); then break; fi
                : > /tmp/edge-business-smoke-body.txt
                if status=$(curl --silent --show-error --proto '=https' --connect-timeout 10 \
                  --max-time "$remaining" --output /tmp/edge-business-smoke-body.txt \
                  --write-out '%{http_code}' "${api%/}${paths[index]}"); then
                  statuses[index]=$status
                else
                  statuses[index]=${status:-000}
                fi
                body=$(head -c 512 /tmp/edge-business-smoke-body.txt | tr '\r\n' '  ')
                printf 'Tentativa %s; GET %s; status %s; corpo (ate 512 bytes): %s\n' \
                  "$attempt" "${paths[index]}" "${statuses[index]}" "$body"
              done
              if [[ ( "${statuses[0]}" == 401 || "${statuses[0]}" == 403 ) &&
                "${statuses[1]}" == 404 && "${statuses[2]}" == 200 ]]; then
                ready=true
                break
              fi
              if [[ "${statuses[0]}" == 2?? ]]; then break; fi
              remaining=$((deadline - SECONDS))
              if (( remaining > 0 )); then sleep "$((remaining < 5 ? remaining : 5))"; fi
            done
            {
              printf '\n### Smoke test business\n\n| Rota GET | Esperado | Obtido |\n| --- | --- | --- |\n'
              printf '| /api/v1/clientes sem Authorization | 401 ou 403 | %s |\n' "${statuses[0]}"
              printf '| /actuator/health | 404 | %s |\n' "${statuses[1]}"
              printf '| /.well-known/jwks.json | 200 | %s |\n' "${statuses[2]}"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            if [[ "$ready" != true ]]; then
              case "${statuses[0]}" in
                401|403) ;;
                404) echo '::error::rota nao publicada no API Gateway: GET /api/v1/clientes permaneceu 404.' ;;
                502|503|504) echo '::error::VPC Link/ALB/pod inacessivel: GET /api/v1/clientes retornou erro de integracao.' ;;
                2??) echo '::error::rota de negocio sem autenticacao: GET /api/v1/clientes aceitou requisicao sem Authorization.' ;;
                *) echo "::error::Status inesperado em GET /api/v1/clientes: ${statuses[0]}." ;;
              esac
              if [[ "${statuses[1]}" != 404 ]]; then
                echo "::error::GET /actuator/health deve permanecer nao publicado (404); obtido ${statuses[1]}."
              fi
              if [[ "${statuses[2]}" != 200 ]]; then
                echo "::error::GET /.well-known/jwks.json deve continuar 200; obtido ${statuses[2]}."
              fi
              exit 1
            fi
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Publicar endpoints para o resumo
        id: endpoints
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao publicar os endpoints observados do API Gateway e do ALB para o resumo."' ERR
          {
            if test -s /tmp/edge-outputs.json; then
              if api_endpoint=$(jq -er '.edge_contract | select(.sensitive == false) | .value.api_endpoint |
                select(type == "string" and length > 0)' /tmp/edge-outputs.json); then
                printf 'api_endpoint=%s\n' "$api_endpoint" >> "$GITHUB_OUTPUT"
              fi
            fi
            if test -s /tmp/edge-alb.json; then
              if alb_dns=$(jq -er '.LoadBalancers[0].DNSName | select(type == "string" and length > 0)' /tmp/edge-alb.json); then
                printf 'alb_dns=%s\n' "$alb_dns" >> "$GITHUB_OUTPUT"
              fi
            fi
          } 2>&1 | tee -a "$EDGE_LOG"

      - name: Failure diagnostics
        if: failure()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          CREDENTIALS_OUTCOME: ${{ steps.credentials.outcome }}
          TERRAFORM_OUTCOME: ${{ steps.terraform.outcome }}
          RELEASE_OUTCOME: ${{ steps.auth_release.outcome }}
          OUTPUTS_OUTCOME: ${{ steps.outputs.outcome }}
          KUBECONFIG: /tmp/edge-kubeconfig
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao registrar diagnosticos de edge."' ERR
          for action in CHECKOUT CREDENTIALS TERRAFORM RELEASE OUTPUTS; do
            outcome_variable="${action}_OUTCOME"
            if [[ "${!outcome_variable}" == failure ]]; then
              echo "::error::Falha na action ${action}; confira checkout, OIDC, instalacao do Terraform ou transferencia de artifacts conforme o passo indicado."
            fi
          done
          {
            printf '\n### Last 200 log lines\n\n```text\n'
            if test -f "$EDGE_LOG"; then tail -n 200 "$EDGE_LOG"; fi
            printf '```\n'
            lambda_name=''
            if test -s /tmp/edge-outputs.json; then
              lambda_name=$(jq -r '
                [.lambda_function_name?, .auth_lambda_function_name?,
                  (.edge_contract? | select(.sensitive == false) | .value |
                    {sensitive: false, value: (.lambda_function_name? // .auth_lambda_function_name?)})] |
                map(select(.sensitive == false and (.value | type == "string" and length > 0))) |
                .[0].value // empty
              ' /tmp/edge-outputs.json) || lambda_name=''
            fi
            if [[ -n "$lambda_name" ]]; then
              printf '\n### Lambda: ultimas 50 linhas\n\n```text\n'
              aws logs tail "/aws/lambda/${lambda_name}" --since 1h --format short 2>&1 | tail -n 50 || \
                echo '::error::Nao foi possivel consultar o log group da Lambda.'
              printf '```\n'
            else
              printf '\nDiagnostico Lambda pulado: nome nao disponivel nos outputs do edge.\n'
            fi
            if [[ "$EDGE_STAGE" == alb || "$EDGE_STAGE" == business ]]; then
              printf '\n### Diagnosticos ALB\n\n```text\n'
              if test -s /tmp/infra_contract.json; then
                if cluster_name=$(jq -er '.eks.name' /tmp/infra_contract.json); then
                  aws eks update-kubeconfig --name "$cluster_name" --region "$AWS_REGION" || \
                    echo '::error::Nao foi possivel preparar kubeconfig para diagnosticos ALB.'
                fi
                if alb_name=$(jq -er '.name_prefix + "-edge"' /tmp/infra_contract.json) &&
                  aws elbv2 describe-load-balancers --names "$alb_name" > /tmp/edge-diagnostic-alb.json &&
                  alb_arn=$(jq -er '.LoadBalancers[0].LoadBalancerArn' /tmp/edge-diagnostic-alb.json) &&
                  aws elbv2 describe-target-groups --load-balancer-arn "$alb_arn" > /tmp/edge-diagnostic-groups.json; then
                  while IFS= read -r group_arn; do
                    printf '\nTarget group: %s\n' "$group_arn"
                    if aws elbv2 describe-target-health --target-group-arn "$group_arn" > /tmp/edge-diagnostic-health.json; then
                      cat /tmp/edge-diagnostic-health.json
                      jq '[.TargetHealthDescriptions[] | select(.TargetHealth.State != "healthy") |
                        {Target: .Target, State: .TargetHealth.State, Reason: .TargetHealth.Reason,
                          Description: .TargetHealth.Description}]' /tmp/edge-diagnostic-health.json
                    else
                      echo "::error::Nao foi possivel consultar targets de ${group_arn}."
                    fi
                  done < <(jq -r '.TargetGroups[].TargetGroupArn' /tmp/edge-diagnostic-groups.json)
                else
                  echo '::error::Nao foi possivel descobrir ALB/target groups para diagnosticos.'
                fi
              fi
              kubectl get ingress -A --request-timeout=30s || echo '::error::Nao foi possivel listar Ingresses.'
              kubectl describe ingress -A --request-timeout=30s || echo '::error::Nao foi possivel descrever Ingresses.'
              kubectl logs -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller \
                --tail=100 --all-containers=true --request-timeout=30s || \
                echo '::error::Nao foi possivel obter logs do ALB Controller.'
              printf '```\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY" 2>&1

  e2e:
    name: 10 E2E
    needs: [edge_business]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_WORKSPACE: default
      AWS_REGION: us-east-1
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      E2E_STAGE: all
      SMOKE_SECRET_ARN: ${{ inputs.smoke_secret_arn }}
      E2E_LOG: /tmp/e2e.log
      KUBECONFIG: /tmp/e2e-kubeconfig
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: e2e-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: us-east-1
          role-duration-seconds: 14400
          unset-current-credentials: true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Read stack outputs
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao ler outputs infra/platform/edge; confira os backends de demo-a e permissoes AWS."' ERR
          {
            umask 077
            [[ "$E2E_STAGE" == seed || "$E2E_STAGE" == smoke || "$E2E_STAGE" == all ]]
            test -n "$AWS_ROLE_ARN"
            for stack in infra platform edge; do
              terraform -chdir="phase4/stacks/${stack}" init -input=false -no-color \
                -backend-config=bucket=tech-challenge-oficina-terraform-state-b1cfa326 \
                -backend-config="key=phase4/environments/demo-a/${stack}.tfstate" \
                -backend-config=region=us-east-1 \
                -backend-config=encrypt=true \
                -backend-config=use_lockfile=true
            done
            terraform -chdir=phase4/stacks/infra output -json platform_contract > /tmp/infra_contract.json
            terraform -chdir=phase4/stacks/platform output -json manifests > /tmp/e2e-platform-manifests.json
            terraform -chdir=phase4/stacks/edge output -json edge_contract > /tmp/e2e-edge-contract.json
            account_id=$(aws sts get-caller-identity --query Account --output text)
            jq -e --arg account "$account_id" '.environment_id == "demo-a" and
              .aws_account_id == $account and .aws_region == "us-east-1" and
              (.name_prefix | type == "string" and length > 0)' /tmp/infra_contract.json > /dev/null
            jq -e --slurpfile infra /tmp/infra_contract.json '.environment_id == $infra[0].environment_id and
              (.api_endpoint | type == "string" and startswith("https://"))' /tmp/e2e-edge-contract.json > /dev/null
            jq -e '.bootstrap | fromjson | .items[0] | select(.kind == "Job")' \
              /tmp/e2e-platform-manifests.json > /tmp/e2e-job-base.json
          } 2>&1 | tee -a "$E2E_LOG"

      - name: Read smoke credentials
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao ler ou validar smoke_secret_arn; exige email @example.invalid e senha de 12 a 1024 caracteres."' ERR
          {
            umask 077
            account_id=$(jq -er '.aws_account_id' /tmp/infra_contract.json)
            secret_pattern="^arn:aws:secretsmanager:${AWS_REGION}:${account_id}:secret:[A-Za-z0-9/_+=.@!-]+-[A-Za-z0-9]{6}$"
            [[ "$SMOKE_SECRET_ARN" =~ $secret_pattern ]]
            aws secretsmanager get-secret-value --secret-id "$SMOKE_SECRET_ARN" \
              --query SecretString --output text > /tmp/e2e-credentials.json
            jq -e 'type == "object" and
              (.email | type == "string" and test("^[a-z0-9.+_-]+@example\\.invalid$")) and
              (.password | type == "string" and length >= 12 and length <= 1024)' \
              /tmp/e2e-credentials.json > /dev/null 2>&1
          } 2>&1 | tee -a "$E2E_LOG"
          masked_password=$(jq -jr '.password | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A")' \
            /tmp/e2e-credentials.json)
          printf '::add-mask::%s\n' "$masked_password"

      - name: Check seed prerequisites
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha nos pre-requisitos do seed; confira EKS, Secret auth-postgres com username/password e ConfigMap rds-ca com ca.pem."' ERR
          {
            umask 077
            cluster_name=$(jq -er '.eks.name' /tmp/infra_contract.json)
            namespace=$(jq -er '.name_prefix' /tmp/infra_contract.json)
            aws eks update-kubeconfig --name "$cluster_name" --region "$AWS_REGION"
            if ! kubectl get secret auth-postgres -n "$namespace" -o json --request-timeout=30s \
              > /tmp/e2e-auth-postgres.json 2>/dev/null ||
              ! jq -e '.data | (.username | type == "string" and length > 0) and
                (.password | type == "string" and length > 0)' /tmp/e2e-auth-postgres.json > /dev/null 2>&1; then
              echo "::error::Secret ${namespace}/auth-postgres ausente, inacessivel ou sem chaves username/password."
              exit 1
            fi
            if ! kubectl get configmap rds-ca -n "$namespace" -o json --request-timeout=30s \
              > /tmp/e2e-rds-ca.json 2>/dev/null ||
              ! jq -e '.data["ca.pem"] | type == "string" and length > 0' /tmp/e2e-rds-ca.json > /dev/null 2>&1; then
              echo "::error::ConfigMap ${namespace}/rds-ca ausente, inacessivel ou sem ca.pem."
              exit 1
            fi
          } 2>&1 | tee -a "$E2E_LOG"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Generate one smoke user
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao instalar cryptography ou gerar SQL do unico usuario ATENDENTE; payload omitido."' ERR
          {
            umask 077
            python -m pip install --disable-pip-version-check cryptography==50.0.1
            python - <<'PY'
          import json
          import os
          from pathlib import Path
          import uuid
          from cryptography.hazmat.primitives.kdf.argon2 import Argon2id

          try:
              infra = json.loads(Path("/tmp/infra_contract.json").read_text())
              credentials = json.loads(Path("/tmp/e2e-credentials.json").read_text())
              prefix = infra["name_prefix"]

              def identifier(email):
                  return str(uuid.uuid5(uuid.NAMESPACE_URL, prefix + "/" + email))

              def literal(value):
                  return "'" + str(value).replace("'", "''") + "'"

              user_id = identifier(credentials["email"])
              password_hash = Argon2id(salt=os.urandom(16), length=32, iterations=2,
                                      lanes=1, memory_cost=19456).derive_phc_encoded(credentials["password"].encode())
              statements = ["BEGIN;", "SELECT pg_advisory_xact_lock(hashtextextended('oficina-smoke-user',0));"]
              statements.append("INSERT INTO usuarios(id,email,nome,password_hash,ativo,criado_em,atualizado_em) VALUES ("
                                + ",".join(map(literal, (user_id, credentials["email"], "Demo FIAP smoke", password_hash)))
                                + ",true,now(),now()) ON CONFLICT DO NOTHING;")
              statements.append("DO $$ BEGIN IF NOT EXISTS(SELECT 1 FROM usuarios WHERE id=" + literal(user_id)
                                + " AND email=" + literal(credentials["email"])
                                + " AND nome LIKE 'Demo FIAP %') THEN RAISE EXCEPTION 'DEMO_IDENTITY_OWNERSHIP_REJECTED'; END IF; END $$;")
              statements.append("INSERT INTO usuario_papeis(usuario_id,papel) VALUES (" + literal(user_id)
                                + ",'ATENDENTE') ON CONFLICT DO NOTHING;")
              Path("/tmp/e2e-seed.sql").write_text("\n".join(statements + ["COMMIT;"]), encoding="utf-8")
          except Exception:
              print("::error::Falha ao gerar SQL; detalhes omitidos para proteger senha e hash.")
              raise SystemExit(1)
          PY
          } 2>&1 | tee -a "$E2E_LOG"

      - name: Seed Auth through psql Job
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no Job de seed Auth; confira diagnosticos sanitizados, RDS e permissoes do auth-postgres."' ERR
          {
            umask 077
            namespace=$(jq -er '.name_prefix' /tmp/infra_contract.json)
            kubectl get secret demo-smoke-sql -n "$namespace" --ignore-not-found -o json \
              --request-timeout=30s > /tmp/e2e-existing-sql-secret.json
            if test -s /tmp/e2e-existing-sql-secret.json; then
              if ! jq -e '.metadata.labels["oficina/managed-by"] == "actions-smoke"' \
                /tmp/e2e-existing-sql-secret.json > /dev/null; then
                echo '::error::Secret demo-smoke-sql existente pertence a outro executor; seed interrompido.'
                exit 1
              fi
            fi
            : > /tmp/e2e-sql-secret-owned
            kubectl create secret generic demo-smoke-sql -n "$namespace" \
              --from-file=seed.sql=/tmp/e2e-seed.sql --dry-run=client -o json | \
              jq '.metadata.labels = {"oficina/managed-by": "actions-smoke"}' | \
              kubectl apply -f - > /tmp/e2e-secret-apply.log 2>&1
            sql_digest=$(sha256sum /tmp/e2e-seed.sql)
            job_name="demo-smoke-seed-${sql_digest:0:12}"
            printf '%s\n' "$job_name" > /tmp/e2e-seed-job-name
            jq --arg namespace "$namespace" --arg name "$job_name" --slurpfile infra /tmp/infra_contract.json '
              .metadata.name = $name | .metadata.namespace = $namespace |
              .spec.template.spec.containers[0].command =
                ["sh", "-ec", "psql -Xq --set=ON_ERROR_STOP=1 --file=/demo/seed.sql >/dev/null"] |
              .spec.template.spec.containers[0].envFrom = [] |
              .spec.template.spec.containers[0].env = [
                {name: "PGHOST", value: $infra[0].rds.address}, {name: "PGPORT", value: "5432"},
                {name: "PGDATABASE", value: $infra[0].rds.application_databases.auth.database},
                {name: "PGSSLMODE", value: "verify-full"}, {name: "PGSSLROOTCERT", value: "/rds-ca/ca.pem"},
                {name: "PGUSER", valueFrom: {secretKeyRef: {name: "auth-postgres", key: "username"}}},
                {name: "PGPASSWORD", valueFrom: {secretKeyRef: {name: "auth-postgres", key: "password"}}}] |
              .spec.template.spec.containers[0].volumeMounts = [
                {name: "rds-ca", mountPath: "/rds-ca", readOnly: true},
                {name: "demo-sql", mountPath: "/demo", readOnly: true}] |
              .spec.template.spec.volumes = [
                {name: "rds-ca", configMap: {name: "rds-ca"}},
                {name: "demo-sql", secret: {secretName: "demo-smoke-sql"}}]
            ' /tmp/e2e-job-base.json > /tmp/e2e-seed-job.json
            kubectl delete job "$job_name" -n "$namespace" --ignore-not-found --wait=true --timeout=60s
            kubectl apply -f /tmp/e2e-seed-job.json
            kubectl wait --for=condition=complete "job/${job_name}" -n "$namespace" --timeout=300s
            kubectl get job "$job_name" -n "$namespace" -o json --request-timeout=30s | \
              jq -e '.status.succeeded == 1' > /dev/null
            printf '\n### Seed\n\nUsuario de teste semeado (ATENDENTE)\n' | tee -a "$GITHUB_STEP_SUMMARY"
          } 2>&1 | tee -a "$E2E_LOG"

      - name: Smoke login and service authorization
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no smoke de login/autorizacao; confira os status HTTP no summary, sem credenciais."' ERR
          {
            umask 077
            api=$(jq -er '.api_endpoint' /tmp/e2e-edge-contract.json)
            api=${api%/}
            jq '{email: .email, senha: .password}' /tmp/e2e-credentials.json > /tmp/e2e-login-request.json
            printf '\n### Smoke\n\n| Rota | Servico | Esperado | Obtido |\n| --- | --- | --- | --- |\n' >> "$GITHUB_STEP_SUMMARY"
            for attempt in 1 2 3; do
              if ! status=$(curl --silent --show-error --proto '=https' --connect-timeout 10 --max-time 30 \
                --header 'Content-Type: application/json' --data-binary @/tmp/e2e-login-request.json \
                --output /tmp/e2e-login-response.json --write-out '%{http_code}' "${api}/api/v1/auth/login"); then
                printf '| POST /api/v1/auth/login | auth | 200 | %s |\n' "${status:-000}" >> "$GITHUB_STEP_SUMMARY"
                echo '::error::integracao quebrada: falha de transporte no login; nao sera repetido.'
                exit 1
              fi
              printf 'Login: tentativa %s; status %s.\n' "$attempt" "$status"
              if [[ "$status" == 5?? && "$attempt" != 3 ]]; then sleep 5; else break; fi
            done
            printf '| POST /api/v1/auth/login | auth | 200 | %s |\n' "$status" | tee -a "$GITHUB_STEP_SUMMARY"
            if [[ "$status" != 200 ]]; then
              case "$status" in
                5??) echo '::error::integracao quebrada: login retornou 5xx apos no maximo tres tentativas.' ;;
                404) echo '::error::rota nao publicada: POST /api/v1/auth/login.' ;;
                *) echo "::error::Login rejeitado com HTTP ${status}; respostas 4xx nao sao repetidas." ;;
              esac
              exit 1
            fi
            if ! token=$(jq -er '.accessToken | select(type == "string" and length > 0)' \
              /tmp/e2e-login-response.json 2>/dev/null); then
              response_keys=$(jq -r 'if type == "object" then keys | join(", ") else "JSON nao objeto" end' \
                /tmp/e2e-login-response.json 2>/dev/null) || response_keys='JSON invalido'
              printf '::error::Login sem accessToken; somente chaves da resposta: %s\n' "$response_keys"
              exit 1
            fi
            masked_token=$(jq -jr '.accessToken | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A")' \
              /tmp/e2e-login-response.json)
            printf '::add-mask::%s\n' "$masked_token"
            printf 'Authorization: Bearer %s\n' "$token" > /tmp/e2e-auth-header.txt
            printf 'Authorization: Bearer %s\n' "$(openssl rand -hex 32)" > /tmp/e2e-invalid-header.txt
            smoke_request() {
              local route=$1 service=$2 expected=$3 header_file=$4 status
              if ! status=$(curl --silent --show-error --proto '=https' --connect-timeout 10 --max-time 30 \
                --header "@${header_file}" --output /tmp/e2e-http-response.json --write-out '%{http_code}' "${api}${route}"); then
                printf '| GET %s | %s | %s | %s |\n' "$route" "$service" "$expected" "${status:-000}" >> "$GITHUB_STEP_SUMMARY"
                echo "::error::integracao quebrada: falha de transporte em GET ${route}."
                return 1
              fi
              printf '| GET %s | %s | %s | %s |\n' "$route" "$service" "$expected" "$status" | tee -a "$GITHUB_STEP_SUMMARY"
              if [[ "$status" != "$expected" ]]; then
                case "$status" in
                  401) echo "::error::servico rejeitou o token (issuer/audience/JWKS/clock): ${service} GET ${route}." ;;
                  5??) echo "::error::integracao quebrada: ${service} GET ${route} retornou ${status}." ;;
                  404) echo "::error::rota nao publicada: GET ${route}." ;;
                  *) echo "::error::GET ${route} (${service}): esperado ${expected}, obtido ${status}." ;;
                esac
                return 1
              fi
            }
            smoke_request /api/v1/clientes os 200 /tmp/e2e-auth-header.txt
            smoke_request /api/v1/diagnosticos execution 403 /tmp/e2e-auth-header.txt
            smoke_request /api/v1/notificacoes billing 403 /tmp/e2e-auth-header.txt
            smoke_request /api/v1/clientes os-token-invalido 401 /tmp/e2e-invalid-header.txt
          } 2>&1 | tee >(sed '/^::add-mask::/d' >> "$E2E_LOG")

      - name: Always remove temporary SQL Secret
        if: always()
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao remover Secret temporario demo-smoke-sql; confira o namespace e remova o recurso pertencente a actions-smoke."' ERR
          {
            if test -f /tmp/e2e-sql-secret-owned; then
              namespace=$(jq -er '.name_prefix' /tmp/infra_contract.json)
              kubectl delete secret demo-smoke-sql -n "$namespace" --ignore-not-found --request-timeout=30s
            fi
          } 2>&1 | tee -a "$E2E_LOG"

      - name: Failure diagnostics
        if: failure()
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao registrar diagnosticos sanitizados do E2E."' ERR
          {
            printf '\n### Diagnosticos E2E\n\n```text\n'
            if test -s /tmp/infra_contract.json; then
              namespace=$(jq -er '.name_prefix' /tmp/infra_contract.json)
              if ! test -s "$KUBECONFIG"; then
                if cluster_name=$(jq -er '.eks.name' /tmp/infra_contract.json); then
                  aws eks update-kubeconfig --name "$cluster_name" --region "$AWS_REGION" || \
                    echo '::error::Nao foi possivel preparar kubeconfig para diagnosticos.'
                fi
              fi
              if [[ "$E2E_STAGE" == seed || "$E2E_STAGE" == all ]]; then
                if kubectl get jobs -n "$namespace" -o json --request-timeout=30s > /tmp/e2e-diagnostic-jobs.json; then
                  while IFS= read -r job_name; do
                    kubectl describe job "$job_name" -n "$namespace" --request-timeout=30s || \
                      echo '::error::Nao foi possivel descrever o Job de seed.'
                    if kubectl logs "job/${job_name}" -n "$namespace" --all-containers=true --tail=100 \
                      --request-timeout=30s > /tmp/e2e-job-logs.txt 2>&1; then
                      awk '/ERROR:|FATAL:|WARNING:/ { print "psql: erro/aviso; mensagem omitida para nao expor SQL ou hash."; found=1 }
                        END { if (!found) print "Logs do Job obtidos; conteudo omitido para nao expor SQL ou hash." }' /tmp/e2e-job-logs.txt
                    else
                      echo '::error::Nao foi possivel obter logs do Job de seed; payload omitido.'
                    fi
                    if kubectl get pods -n "$namespace" -l "job-name=${job_name}" -o json \
                      --request-timeout=30s > /tmp/e2e-diagnostic-pods.json; then
                      while IFS= read -r pod; do
                        kubectl describe pod "$pod" -n "$namespace" --request-timeout=30s || \
                          echo '::error::Nao foi possivel descrever pod de seed.'
                        if kubectl logs "$pod" -n "$namespace" --all-containers=true --tail=100 \
                          --request-timeout=30s > /tmp/e2e-pod-logs.txt 2>&1; then
                          awk '/ERROR:|FATAL:|WARNING:/ { print "psql: erro/aviso; mensagem omitida para nao expor SQL ou hash."; found=1 }
                            END { if (!found) print "Logs do pod obtidos; conteudo omitido para nao expor SQL ou hash." }' /tmp/e2e-pod-logs.txt
                        else
                          echo '::error::Nao foi possivel obter logs do pod de seed; payload omitido.'
                        fi
                      done < <(jq -r '.items[].metadata.name' /tmp/e2e-diagnostic-pods.json)
                    fi
                  done < <(jq -r '.items[].metadata.name | select(startswith("demo-smoke-seed-"))' /tmp/e2e-diagnostic-jobs.json)
                else
                  echo '::error::Nao foi possivel listar Jobs de seed.'
                fi
              fi
              kubectl get events -n "$namespace" --sort-by=.lastTimestamp --request-timeout=30s | tail -n 30 || \
                echo '::error::Nao foi possivel listar eventos do namespace.'
            fi
            printf '\nUltimas 200 linhas do log do workflow:\n'
            if test -f "$E2E_LOG"; then tail -n 200 "$E2E_LOG"; fi
            printf '```\n'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

  summary:
    name: Resumo
    needs: [resolve, infra, auth_artifact, images, images_consolidate, platform_data, edge_auth, platform_apps, platform_controller, edge_alb, edge_business, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      JOB_RESULTS: ${{ toJSON(needs) }}
      API_ENDPOINT: ${{ needs.edge_business.outputs.api_endpoint }}
      ALB_DNS: ${{ needs.edge_business.outputs.alb_dns }}
      SUMMARY_LOG: /tmp/summary.log
    steps:
      - name: Resumo do deploy
        if: always()
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao escrever o resumo das fases do deploy."' ERR
          {
            {
              printf '### Deploy\n\n| fase | resultado |\n|---|---|\n'
              jq -r 'to_entries[] | "| " + .key + " | " + .value.result + " |"' <<< "$JOB_RESULTS"
              if jq -e 'all(.[]; .result == "success")' <<< "$JOB_RESULTS" > /dev/null; then
                if [[ -n "$API_ENDPOINT" ]]; then
                  printf '\nAPI Gateway: `%s`\n' "$API_ENDPOINT"
                fi
                if [[ -n "$ALB_DNS" ]]; then
                  printf '\nDNS do ALB: `%s`\n' "$ALB_DNS"
                fi
              fi
            } | tee -a "$GITHUB_STEP_SUMMARY"
          } 2>&1 | tee -a "$SUMMARY_LOG"

      - name: Failure diagnostics
        if: failure()
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao registrar os diagnosticos de summary."' ERR
          {
            echo '::group::Failure diagnostics'
            {
              printf '### Last 200 log lines\n\n```text\n'
              if test -f "$SUMMARY_LOG"; then tail -n 200 "$SUMMARY_LOG"; fi
              printf '```\n'
            } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
            echo '::endgroup::'
          } 2>&1 | tee -a "$SUMMARY_LOG"
