name: Environment Up
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type UP demo-a
        required: true
        type: string
      phase:
        description: Resumable phase; Terraform phases produce plan.json unless an approved hash is supplied
        type: choice
        required: true
        default: infra
        options:
          - infra
          - release
          - platform
          - edge
          - foundation
          - controller
          - secrets
          - data
          - platform-migration
          - migrate
          - edge-auth
          - jwks
          - platform-apps
          - apps
          - edge-alb
          - ingress
          - alb-check
          - edge-business
          - observability
          - health
          - e2e
      approved_plan_sha256:
        description: SHA256 from a reviewed plan at the same revision and phase; empty means plan only
        type: string
        required: false
      retry_failed_jobs:
        description: Recreate only failed owned Jobs with the same expected image, after collecting diagnostics
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: phase4-demo-a-mutation
  cancel-in-progress: false
jobs:
  gate:
    environment: phase4-demo-a-provision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: node --test scripts/environment-actions/control.test.mjs scripts/environment-actions/preflight.test.mjs
      - run: python -m unittest discover -s scripts/environment-actions -p 'test_*.py'
      - env:
          CONFIRMATION: ${{ inputs.confirmation }}
          PHASE4_EXECUTION_APPROVED: ${{ vars.PHASE4_EXECUTION_APPROVED }}
        run: node scripts/environment-actions/control.mjs up
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: up-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: actions-report/
          retention-days: 7
  preflight:
    needs: gate
    uses: ./.github/workflows/environment-preflight.yml
    with:
      scope: ${{ inputs.phase == 'infra' && 'infra' || 'full' }}
    secrets:
      SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
    permissions:
      contents: read
      id-token: write
  execute:
    needs: preflight
    environment: ${{ contains(fromJSON('["release","secrets","data","migrate","apps","health","jwks","alb-check","e2e"]'), inputs.phase) && 'phase4-demo-a-deploy' || 'phase4-demo-a-provision' }}
    runs-on: ${{ fromJSON(vars.PHASE4_EXECUTOR_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      EXECUTOR_ROLE: ${{ contains(fromJSON('["release","secrets","data","migrate","apps","health","jwks","alb-check","e2e"]'), inputs.phase) && 'deploy' || 'provision' }}
      CONFIRMATION: ${{ inputs.confirmation }}
      PHASE4_EXECUTION_APPROVED: ${{ vars.PHASE4_EXECUTION_APPROVED }}
      RETRY_FAILED_JOBS: ${{ inputs.retry_failed_jobs }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4.3.1
      - run: python -m pip install -r scripts/environment-actions/requirements.txt
      - name: Approved source revisions
        id: sources
        if: inputs.phase == 'release'
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const config=JSON.parse(fs.readFileSync("phase4/environments/demo-a.runtime.json")); for (const service of ["auth","os","execution","billing"]) { const revision=config.services[service].revision; if (!/^[0-9a-f]{40}$/.test(revision)) throw Error("INVALID_REVISION"); fs.appendFileSync(process.env.GITHUB_OUTPUT, `${service}=${revision}\n`); }'
      - uses: actions/checkout@v4
        if: inputs.phase == 'release'
        with:
          repository: AuroNet0/tech-challenge-oficina-auth
          ref: ${{ steps.sources.outputs.auth }}
          path: sources/auth
          persist-credentials: false
          token: ${{ secrets.SOURCE_READ_TOKEN || github.token }}
      - uses: actions/checkout@v4
        if: inputs.phase == 'release'
        with:
          repository: AuroNet0/tech-challenge-oficina-os-service
          ref: ${{ steps.sources.outputs.os }}
          path: sources/os
          persist-credentials: false
          token: ${{ secrets.SOURCE_READ_TOKEN || github.token }}
      - uses: actions/checkout@v4
        if: inputs.phase == 'release'
        with:
          repository: AuroNet0/tech-challenge-oficina-execution-service
          ref: ${{ steps.sources.outputs.execution }}
          path: sources/execution
          persist-credentials: false
          token: ${{ secrets.SOURCE_READ_TOKEN || github.token }}
      - uses: actions/checkout@v4
        if: inputs.phase == 'release'
        with:
          repository: AuroNet0/tech-challenge-oficina-billing-service
          ref: ${{ steps.sources.outputs.billing }}
          path: sources/billing
          persist-credentials: false
          token: ${{ secrets.SOURCE_READ_TOKEN || github.token }}
      - uses: aws-actions/configure-aws-credentials@v4
        id: aws
        with:
          role-to-assume: arn:aws:iam::446517826146:role/tc-oficina-p4-demo-a-${{ env.EXECUTOR_ROLE }}
          role-session-name: up-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: us-east-1
          allowed-account-ids: '446517826146'
          role-duration-seconds: 3600
          unset-current-credentials: true
      - name: Execute approved phase
        env:
          PHASE: ${{ inputs.phase }}
          PLAN_HASH: ${{ inputs.approved_plan_sha256 }}
        run: python scripts/environment-actions/runtime.py up --phase "$PHASE" --approved-plan-sha256 "$PLAN_HASH"
      - name: Independently verify endpoint closure
        if: ${{ always() && steps.aws.outcome == 'success' }}
        env:
          REPORT_DIR: actions-report/endpoint-close
        run: python scripts/environment-actions/runtime.py close
      - name: Setup failure summary
        if: ${{ always() }}
        run: node scripts/environment-actions/diagnostics.mjs fallback up
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: up-${{ inputs.phase }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            actions-report/report.json
            actions-report/summary.md
            actions-report/plan.json
            actions-report/identity-inventory.json
            actions-report/kubernetes-diagnostic/
            actions-report/endpoint-close/
          if-no-files-found: error
          retention-days: 7
