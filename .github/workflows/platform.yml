name: Platform (temporary)

on:
  workflow_dispatch:
    inputs:
      images_run_id:
        description: Successful images.yml run containing the images.json artifact
        required: true
        type: string
      mercado_pago_secret_arn:
        description: External Mercado Pago TEST credentials secret ARN in the workflow account and region
        required: true
        type: string
      stage:
        description: Platform deployment stage
        required: true
        type: choice
        options:
          - data
          - apps
          - controller
        default: data
      mode:
        description: Terraform operation for phase4/stacks/platform
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: phase4-demo-a-mutation
  cancel-in-progress: false

jobs:
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_WORKSPACE: default
      AWS_REGION: us-east-1
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      PLATFORM_MODE: ${{ inputs.mode }}
      PLATFORM_STAGE: ${{ inputs.stage }}
      IMAGES_RUN_ID: ${{ inputs.images_run_id }}
      MERCADO_PAGO_SECRET_ARN: ${{ inputs.mercado_pago_secret_arn }}
      PLATFORM_LOG: /tmp/platform.log
      KUBECONFIG: /tmp/platform-kubeconfig
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: platform-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: us-east-1
          role-duration-seconds: 14400
          unset-current-credentials: true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Check inputs and images run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao validar inputs ou o run de images.yml; confira images_run_id, mercado_pago_secret_arn e AWS_ROLE_ARN."' ERR
          {
            echo '::group::Check inputs and images run'
            [[ "$PLATFORM_MODE" == plan || "$PLATFORM_MODE" == apply ]]
            [[ "$IMAGES_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            test -n "$AWS_ROLE_ARN"
            account_id=$(aws sts get-caller-identity --query Account --output text)
            [[ "$account_id" =~ ^[0-9]{12}$ ]]
            payment_pattern="^arn:aws:secretsmanager:${AWS_REGION}:${account_id}:secret:[A-Za-z0-9/_+=.@!-]+-[A-Za-z0-9]{6}$"
            if [[ ! "$MERCADO_PAGO_SECRET_ARN" =~ $payment_pattern ]]; then
              echo '::error::mercado_pago_secret_arn deve ser um ARN completo do Secrets Manager na conta STS e regiao do workflow, com sufixo AWS de seis caracteres.'
              exit 1
            fi
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${IMAGES_RUN_ID}" > /tmp/platform-images-run.json
            jq -e '.path == ".github/workflows/images.yml" and .status == "completed" and .conclusion == "success"' \
              /tmp/platform-images-run.json
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Download images.json
        uses: actions/download-artifact@v4
        with:
          name: images.json
          run-id: ${{ inputs.images_run_id }}
          github-token: ${{ github.token }}
          path: /tmp/platform-images

      - name: Read infra contract
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao inicializar o backend infra ou ler platform_contract; confira o state de demo-a e as permissoes AWS."' ERR
          {
            echo '::group::Read infra contract'
            terraform -chdir=phase4/stacks/infra init -input=false -no-color \
              -backend-config=bucket=tech-challenge-oficina-terraform-state-b1cfa326 \
              -backend-config=key=phase4/environments/demo-a/infra.tfstate \
              -backend-config=region=us-east-1 \
              -backend-config=encrypt=true \
              -backend-config=use_lockfile=true
            terraform -chdir=phase4/stacks/infra output -json platform_contract > /tmp/infra_contract.json
            jq -e 'type == "object" and .environment_id == "demo-a" and .aws_region == "us-east-1"' \
              /tmp/infra_contract.json
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Read edge JWT and ALB contracts
        if: inputs.stage == 'apps' || inputs.stage == 'controller'
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao ler contratos JWT/ALB do edge; confira backend, outputs, SG e URLs HTTPS de issuer/JWKS."' ERR
          {
            terraform -chdir=phase4/stacks/edge init -input=false -no-color \
              -backend-config=bucket=tech-challenge-oficina-terraform-state-b1cfa326 \
              -backend-config=key=phase4/environments/demo-a/edge.tfstate \
              -backend-config=region=us-east-1 \
              -backend-config=encrypt=true \
              -backend-config=use_lockfile=true
            terraform -chdir=phase4/stacks/edge output -json jwt_contract | \
              jq '{value: .}' > /tmp/platform-edge-jwt.json
            jq -e '.value | select(
              (keys == ["audience", "issuer", "jwks_uri"]) and
              all(.[]; type == "string" and length > 0) and
              (.issuer | startswith("https://")) and (.jwks_uri | startswith("https://"))
            )' /tmp/platform-edge-jwt.json > /tmp/platform-jwt.json
            terraform -chdir=phase4/stacks/edge output -json edge_contract > /tmp/platform-edge-contract.json
            jq -e --slurpfile infra /tmp/infra_contract.json '
              .environment_id == $infra[0].environment_id and
              (.alb_security_group_id | type == "string" and test("^sg-[0-9a-f]{17}$"))
            ' /tmp/platform-edge-contract.json > /dev/null
            if [[ "$PLATFORM_STAGE" == controller ]]; then
              terraform -chdir=phase4/stacks/edge output -json controller_identity_contract \
                > /tmp/platform-controller-identity.json
            fi
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Resolve default EKS addon versions
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao resolver versoes default dos addons para Kubernetes 1.35."' ERR
          {
            echo '::group::Resolve default EKS addon versions'
            for addon in eks-pod-identity-agent aws-ebs-csi-driver vpc-cni; do
              aws eks describe-addon-versions --kubernetes-version 1.35 --addon-name "$addon" \
                --output json > "/tmp/platform-${addon}.json"
              version=$(jq -r '[.addons[].addonVersions[] |
                select(any(.compatibilities[]; .clusterVersion == "1.35" and .defaultVersion == true)) |
                .addonVersion] | unique | if length == 1 then .[0] else empty end' "/tmp/platform-${addon}.json")
              if [[ -z "$version" || "$version" == null ]]; then
                echo "::error::Addon ${addon} sem uma versao default unica para Kubernetes 1.35 em ${AWS_REGION}."
                exit 1
              fi
              printf '%s\n' "$version" > "/tmp/platform-${addon}.version"
              printf '%s: %s\n' "$addon" "$version"
            done
            jq -n \
              --arg pod_identity "$(cat /tmp/platform-eks-pod-identity-agent.version)" \
              --arg ebs_csi "$(cat /tmp/platform-aws-ebs-csi-driver.version)" \
              --arg vpc_cni "$(cat /tmp/platform-vpc-cni.version)" \
              '{pod_identity: $pod_identity, ebs_csi: $ebs_csi, vpc_cni: $vpc_cni}' > /tmp/platform-addons.json
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Generate Terraform inputs
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao gerar tfvars.json; confira identidade AWS, contrato infra e os sete digests de images.json."' ERR
          {
            echo '::group::Generate Terraform inputs'
            identity=$(aws sts get-caller-identity --output json)
            account_id=$(jq -er '.Account' <<< "$identity")
            caller_arn=$(jq -er '.Arn' <<< "$identity")
            [[ "$account_id" =~ ^[0-9]{12}$ ]]
            [[ "$AWS_ROLE_ARN" =~ ^arn:aws:iam::${account_id}:role/[A-Za-z0-9+=,.@_/-]+$ ]]
            role_name=${AWS_ROLE_ARN##*/}
            [[ "$caller_arn" == "arn:aws:sts::${account_id}:assumed-role/${role_name}/"* ]]
            jq -e --arg account "$account_id" '.aws_account_id == $account' /tmp/infra_contract.json
            jq -e '
              (keys == ["auth", "billing", "execution", "mongodb", "os", "postgres", "rabbitmq"]) and
              all(.[]; type == "string" and test("^[a-z0-9][a-z0-9./:_-]+@sha256:[0-9a-f]{64}$"))
            ' /tmp/platform-images/images.json
            jq -n \
              --arg account_id "$account_id" \
              --slurpfile infra_contract /tmp/infra_contract.json \
              --slurpfile images /tmp/platform-images/images.json \
              --slurpfile addon_versions /tmp/platform-addons.json \
              '{environment_id: "demo-a", aws_region: "us-east-1",
                aws_account_id: $account_id, git_revision: "0000000000000000000000000000000000000000",
                infra_contract: $infra_contract[0], images: $images[0], addon_versions: $addon_versions[0],
                new_relic_chart_version: "6.0.0",
                mercado_pago: {enabled: false, success_url: "https://example.com/success",
                  failure_url: "https://example.com/failure", pending_url: "https://example.com/pending"},
                jwt: null, application_replicas: 0, auth_migration_enabled: true}' \
              > phase4/stacks/platform/tfvars.json
            if [[ "$PLATFORM_STAGE" == apps || "$PLATFORM_STAGE" == controller ]]; then
              jq --slurpfile jwt /tmp/platform-jwt.json --slurpfile edge /tmp/platform-edge-contract.json '
                .jwt = $jwt[0] | .application_replicas = 1 | .auth_migration_enabled = false |
                .alb_controller_identity_enabled = true |
                .alb_identity_inputs = {security_group_id: $edge[0].alb_security_group_id, certificate_arn: null}
              ' phase4/stacks/platform/tfvars.json > /tmp/platform-apps-tfvars.json
              mv /tmp/platform-apps-tfvars.json phase4/stacks/platform/tfvars.json
            fi
            {
              printf '### Platform inputs\n\nMode: `%s`; images run: `%s`.\n\n' "$PLATFORM_MODE" "$IMAGES_RUN_ID"
              printf 'New Relic chart: `6.0.0` (semver accepted by variables.tf; Helm is not installed).\n\n'
              if [[ "$PLATFORM_STAGE" == apps || "$PLATFORM_STAGE" == controller ]]; then
                printf 'Stage %s; JWT do edge; uma replica por Deployment; identidade ALB habilitada, certificado null; migration e Mercado Pago disabled.\n\n### Addon versions\n\n```json\n' "$PLATFORM_STAGE"
              else
                printf 'JWT null; replicas zero; Mercado Pago disabled.\n\n### Addon versions\n\n```json\n'
              fi
              cat /tmp/platform-addons.json
              printf '```\n'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Terraform init
        working-directory: phase4/stacks/platform
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no terraform init de platform; confira backend e permissoes AWS."' ERR
          {
            echo '::group::Terraform init'
            terraform init -input=false -no-color \
              -backend-config=bucket=tech-challenge-oficina-terraform-state-b1cfa326 \
              -backend-config=key=phase4/environments/demo-a/platform.tfstate \
              -backend-config=region=us-east-1 \
              -backend-config=encrypt=true \
              -backend-config=use_lockfile=true
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Terraform validate
        working-directory: phase4/stacks/platform
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no terraform validate de platform; confira o diagnostico no log."' ERR
          {
            echo '::group::Terraform validate'
            terraform validate -no-color
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Terraform plan
        working-directory: phase4/stacks/platform
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no terraform plan de platform; confira catalogo, contratos, versoes de addons e acesso ao EKS."' ERR
          {
            echo '::group::Terraform plan'
            terraform plan -input=false -no-color -lock-timeout=5m -var-file=tfvars.json -out=tfplan
            terraform show -no-color tfplan > /tmp/platform-plan.txt
            {
              printf '### Terraform plan\n\n```text\n'
              cat /tmp/platform-plan.txt
              printf '```\n'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Terraform apply
        if: inputs.mode == 'apply'
        working-directory: phase4/stacks/platform
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha no terraform apply de platform; confira o log e o state antes de repetir."' ERR
          {
            echo '::group::Terraform apply'
            terraform apply -input=false -no-color -lock-timeout=5m tfplan
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Apply foundation and network only
        if: inputs.mode == 'apply' && inputs.stage == 'data'
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao exportar manifests ou aplicar foundation/network; confira kubeconfig, acesso EKS e namespaces."' ERR
          {
            echo '::group::Apply foundation and network only'
            terraform -chdir=phase4/stacks/platform output -json manifests > /tmp/platform-manifests.json
            cluster_name=$(jq -er '.eks.name' /tmp/infra_contract.json)
            aws eks update-kubeconfig --name "$cluster_name" --region "$AWS_REGION"
            jq -er '.foundation' /tmp/platform-manifests.json > /tmp/platform-foundation.json
            jq -er '.network' /tmp/platform-manifests.json > /tmp/platform-network.json
            jq '{apiVersion: "v1", kind: "List", items: [.items[] | select(.kind == "Namespace")]}' \
              /tmp/platform-foundation.json > /tmp/platform-namespaces.json
            jq -e '.items | length > 0' /tmp/platform-namespaces.json
            kubectl apply -f /tmp/platform-namespaces.json
            mapfile -t namespaces < <(jq -r '.items[].metadata.name' /tmp/platform-namespaces.json)
            for namespace in "${namespaces[@]}"; do
              kubectl wait --for=jsonpath='{.status.phase}'=Active "namespace/${namespace}" --timeout=120s
            done
            kubectl apply -f /tmp/platform-foundation.json
            kubectl apply -f /tmp/platform-network.json
            printf '\n### Applied\n\nFoundation and network only.\n' | tee -a "$GITHUB_STEP_SUMMARY"
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - uses: actions/setup-python@v5
        if: inputs.mode == 'apply' && inputs.stage == 'data'
        with:
          python-version: '3.13'

      - name: Create rds-ca ConfigMap
        if: inputs.mode == 'apply' && inputs.stage == 'data'
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha na validacao do bundle RDS ou criacao dos ConfigMaps de CA; confira TLS, certificados e referencias dos manifests."' ERR
          {
            echo '::group::Create rds-ca ConfigMap'
            terraform -chdir=phase4/stacks/platform output -json > /tmp/platform-outputs.json
            source_url=https://truststore.pki.rds.amazonaws.com/us-east-1/us-east-1-bundle.pem
            curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
              --connect-timeout 15 --max-time 60 "$source_url" -o /tmp/platform-rds-ca.pem
            mkdir -p /tmp/platform-rds-certificates
            awk -v directory=/tmp/platform-rds-certificates '
              /^-----BEGIN CERTIFICATE-----\r?$/ {
                if (inside) { invalid = 1; exit 1 }
                inside = 1; count++
                destination = sprintf("%s/certificate-%03d.pem", directory, count)
              }
              /-----BEGIN / && !/^-----BEGIN CERTIFICATE-----\r?$/ { invalid = 1; exit 1 }
              /-----END / && !/^-----END CERTIFICATE-----\r?$/ { invalid = 1; exit 1 }
              inside { print > destination }
              /^-----END CERTIFICATE-----\r?$/ {
                if (!inside) { invalid = 1; exit 1 }
                close(destination); inside = 0; next
              }
              !inside && /[^[:space:]]/ { invalid = 1; exit 1 }
              END { if (invalid || inside || count < 1) exit 1 }
            ' /tmp/platform-rds-ca.pem
            for certificate in /tmp/platform-rds-certificates/certificate-*.pem; do
              openssl x509 -in "$certificate" -noout
              openssl x509 -in "$certificate" -noout -checkend 0
            done
            sha256sum /tmp/platform-rds-ca.pem
            printf '\n### RDS CA\n\nsem checksum pinado (decisão para demo)\n\n' | tee -a "$GITHUB_STEP_SUMMARY"
            jq -er --arg source "$source_url" '
              .external_configmaps.value | to_entries[] |
              select(.value.source == $source and (.value.keys | index("ca.pem") != null)) |
              .key
            ' /tmp/platform-outputs.json > /tmp/platform-rds-configmaps.txt
            while IFS= read -r configmap; do
              jq -er --arg name "$configmap" '
                [to_entries[].value | fromjson | .items[] | . as $resource |
                  .. | objects |
                  select(.configMap.name? == $name or .configMapKeyRef.name? == $name) |
                  $resource.metadata.namespace] |
                unique | if length > 0 and all(.[]; type == "string" and length > 0)
                  then .[] else error("ConfigMap sem namespaces nos manifests") end
              ' /tmp/platform-manifests.json > /tmp/platform-rds-namespaces.txt
              while IFS= read -r namespace; do
                printf 'ConfigMap %s; namespace %s (lidos dos outputs/manifests)\n' "$configmap" "$namespace" |
                  tee -a "$GITHUB_STEP_SUMMARY"
                kubectl create configmap "$configmap" -n "$namespace" \
                  --from-file=ca.pem=/tmp/platform-rds-ca.pem --dry-run=client -o yaml | kubectl apply -f -
              done < /tmp/platform-rds-namespaces.txt
            done < /tmp/platform-rds-configmaps.txt
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Deliver secrets
        if: inputs.mode == 'apply' && inputs.stage == 'data'
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao instalar dependencias ou entregar secrets; confira permissoes, kubeconfig e credenciais TEST do Mercado Pago."' ERR
          {
            echo '::group::Deliver secrets'
            python -m pip install -r scripts/platform-secrets/requirements.txt
            account_id=$(aws sts get-caller-identity --query Account --output text)
            python scripts/platform-secrets/deliver.py deliver \
              --infra-contract /tmp/infra_contract.json \
              --platform-outputs /tmp/platform-outputs.json \
              --revision 0000000000000000000000000000000000000000 \
              --images /tmp/platform-images/images.json \
              --mercado-pago-secret-arn "$MERCADO_PAGO_SECRET_ARN" \
              --region us-east-1 --account "$account_id" \
              --receipts-out /tmp/platform-receipts.json
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Apply data and wait for StatefulSets
        if: inputs.mode == 'apply' && inputs.stage == 'data'
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao aplicar data ou aguardar StatefulSets prontos em 300s."' ERR
          {
            echo '::group::Apply data and wait for StatefulSets'
            jq -er '.data' /tmp/platform-manifests.json > /tmp/platform-data.json
            jq -e '[.items[] | select(.kind == "StatefulSet")] | length > 0' /tmp/platform-data.json
            kubectl apply -f /tmp/platform-data.json
            jq -r '.items[] | select(.kind == "StatefulSet") |
              [.metadata.namespace, .metadata.name] | @tsv' /tmp/platform-data.json > /tmp/platform-statefulsets.tsv
            while IFS=$'\t' read -r namespace statefulset; do
              kubectl rollout status "statefulset/${statefulset}" -n "$namespace" --timeout=300s
            done < /tmp/platform-statefulsets.tsv
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Apply bootstrap and clean temporary secrets
        if: inputs.mode == 'apply' && inputs.stage == 'data'
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha na fase bootstrap ou na remocao dos secrets temporarios de bootstrap."' ERR
          {
            echo '::group::Apply bootstrap and clean temporary secrets'
            jq -er '.bootstrap' /tmp/platform-manifests.json > /tmp/platform-bootstrap.json
            jq -e '[.items[] | select(.kind == "Job")] | length > 0' /tmp/platform-bootstrap.json
            kubectl apply -f /tmp/platform-bootstrap.json
            jq -r '.items[] | select(.kind == "Job") |
              [.metadata.namespace, .metadata.name] | @tsv' /tmp/platform-bootstrap.json > /tmp/platform-bootstrap-jobs.tsv
            while IFS=$'\t' read -r namespace job; do
              if ! kubectl wait --for=condition=complete "job/${job}" -n "$namespace" --timeout=600s ||
                ! kubectl get "job/${job}" -n "$namespace" -o json | \
                  jq -e '(.status.succeeded // 0) > 0 and (.status.failed // 0) == 0'; then
                echo "::error::Job ${namespace}/${job} falhou ou excedeu o timeout de 600s."
                kubectl logs "job/${job}" -n "$namespace" --all-containers=true --tail=200 || \
                  echo "::error::Nao foi possivel obter logs do Job ${namespace}/${job}."
                exit 1
              fi
            done < /tmp/platform-bootstrap-jobs.tsv
            python scripts/platform-secrets/deliver.py cleanup-temporary \
              --lifecycle bootstrap --receipts /tmp/platform-receipts.json
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Apply migration and clean temporary secrets
        if: inputs.mode == 'apply' && inputs.stage == 'data'
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha na fase migration ou na remocao dos secrets temporarios de migration."' ERR
          {
            echo '::group::Apply migration and clean temporary secrets'
            jq -er '.migration' /tmp/platform-manifests.json > /tmp/platform-migration.json
            jq -e '[.items[] | select(.kind == "Job")] | length > 0' /tmp/platform-migration.json
            kubectl apply -f /tmp/platform-migration.json
            jq -r '.items[] | select(.kind == "Job") |
              [.metadata.namespace, .metadata.name] | @tsv' /tmp/platform-migration.json > /tmp/platform-migration-jobs.tsv
            while IFS=$'\t' read -r namespace job; do
              if ! kubectl wait --for=condition=complete "job/${job}" -n "$namespace" --timeout=600s ||
                ! kubectl get "job/${job}" -n "$namespace" -o json | \
                  jq -e '(.status.succeeded // 0) > 0 and (.status.failed // 0) == 0'; then
                echo "::error::Job ${namespace}/${job} falhou ou excedeu o timeout de 600s."
                kubectl logs "job/${job}" -n "$namespace" --all-containers=true --tail=200 || \
                  echo "::error::Nao foi possivel obter logs do Job ${namespace}/${job}."
                exit 1
              fi
            done < /tmp/platform-migration-jobs.tsv
            python scripts/platform-secrets/deliver.py cleanup-temporary \
              --lifecycle migration --receipts /tmp/platform-receipts.json
            printf '\n### Applied\n\nData, bootstrap and migration completed; temporary projections cleaned.\n' |
              tee -a "$GITHUB_STEP_SUMMARY"
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Check apps prerequisites
        if: inputs.mode == 'apply' && inputs.stage == 'apps'
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao conferir manifests, ConfigMap rds-ca ou Secrets existentes para apps."' ERR
          {
            terraform -chdir=phase4/stacks/platform output -json manifests > /tmp/platform-manifests.json
            cluster_name=$(jq -er '.eks.name' /tmp/infra_contract.json)
            aws eks update-kubeconfig --name "$cluster_name" --region "$AWS_REGION"
            jq -er '.auth' /tmp/platform-manifests.json > /tmp/platform-auth.json
            jq -er '.applications' /tmp/platform-manifests.json > /tmp/platform-applications.json
            jq -s '{apiVersion: "v1", kind: "List", items: [.[].items[]]}' \
              /tmp/platform-auth.json /tmp/platform-applications.json > /tmp/platform-apps.json
            jq -e '[.items[] | select(.kind == "Deployment")] |
              length == 4 and all(.[];
                (.metadata.namespace | type == "string" and length > 0) and
                (.metadata.name | type == "string" and length > 0) and
                (.spec.selector.matchLabels | type == "object" and length > 0))' \
              /tmp/platform-apps.json > /dev/null
            jq -r '.items[] | select(.kind == "Deployment") |
              [.metadata.namespace, .metadata.name,
                (.spec.selector.matchLabels | to_entries | sort_by(.key) |
                  map(.key + "=" + .value) | join(","))] | @tsv' \
              /tmp/platform-apps.json > /tmp/platform-deployments.tsv
            jq -r '[.items[] | select(.kind == "Deployment") | .metadata.namespace] |
              unique[]' /tmp/platform-apps.json > /tmp/platform-apps-namespaces.txt
            jq -r '[.items[] | select(.kind == "Deployment") | . as $deployment |
              .spec.template.spec | .. | objects |
              (.secretKeyRef.name? // .secret.secretName? // .secretRef.name? // empty) |
              [$deployment.metadata.namespace, .]] | unique[] | @tsv' \
              /tmp/platform-apps.json > /tmp/platform-apps-secrets.tsv
            missing=()
            while IFS= read -r namespace; do
              if ! kubectl get configmap rds-ca -n "$namespace" -o name --request-timeout=30s; then
                missing+=("${namespace}/ConfigMap/rds-ca")
              fi
            done < /tmp/platform-apps-namespaces.txt
            while IFS=$'\t' read -r namespace secret; do
              if ! kubectl get secret "$secret" -n "$namespace" -o name --request-timeout=30s; then
                missing+=("${namespace}/Secret/${secret}")
              fi
            done < /tmp/platform-apps-secrets.tsv
            if (( ${#missing[@]} > 0 )); then
              printf '::error::Dependencias ausentes ou inacessiveis para apps: %s\n' "${missing[*]}"
              exit 1
            fi
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Apply apps and wait for Deployments
        if: inputs.mode == 'apply' && inputs.stage == 'apps'
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao aplicar auth/applications ou aguardar os Deployments; confira os diagnosticos de rollout."' ERR
          {
            kubectl apply -f /tmp/platform-auth.json
            kubectl apply -f /tmp/platform-applications.json
            failed=false
            while IFS=$'\t' read -r namespace deployment selector; do
              if ! kubectl rollout status "deployment/${deployment}" -n "$namespace" --timeout=600s; then
                echo "::error::Rollout do Deployment ${namespace}/${deployment} falhou ou excedeu 600s."
                printf '%s\t%s\t%s\n' "$namespace" "$deployment" "$selector" >> /tmp/platform-failed-rollouts.tsv
                failed=true
              fi
            done < /tmp/platform-deployments.tsv
            printf '\n### Deployments apps\n\n| Namespace | Deployment | Replicas prontas/desejadas |\n| --- | --- | --- |\n' \
              >> "$GITHUB_STEP_SUMMARY"
            while IFS=$'\t' read -r namespace deployment selector; do
              kubectl get deployment "$deployment" -n "$namespace" -o json --request-timeout=30s | \
                jq -r '"| \(.metadata.namespace) | \(.metadata.name) | \(.status.readyReplicas // 0)/\(.spec.replicas) |"' \
                >> "$GITHUB_STEP_SUMMARY"
            done < /tmp/platform-deployments.tsv
            [[ "$failed" == false ]]
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Set up Helm
        if: inputs.mode == 'apply' && inputs.stage == 'controller'
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Install and verify ALB Controller
        if: inputs.mode == 'apply' && inputs.stage == 'controller'
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao instalar ou verificar o ALB Controller; confira Helm, rollout, contratos e associacao Pod Identity."' ERR
          {
            cluster_name=$(jq -er '.eks.name' /tmp/infra_contract.json)
            region=$(jq -er '.aws_region' /tmp/infra_contract.json)
            vpc_id=$(jq -er '.vpc_id' /tmp/infra_contract.json)
            name_prefix=$(jq -er '.name_prefix' /tmp/infra_contract.json)
            release="${name_prefix}-alb"
            aws eks update-kubeconfig --name "$cluster_name" --region "$region"
            terraform -chdir=phase4/stacks/platform output -json network_controller_contract \
              > /tmp/platform-network-controller.json
            jq -e '.chart == "aws-load-balancer-controller" and .chart_version == "1.14.0" and
              .namespace == "kube-system" and .service_account == "aws-load-balancer-controller" and
              .identity.enabled == true and (.values_yaml | type == "string" and length > 0)' \
              /tmp/platform-network-controller.json > /dev/null
            jq -e --arg cluster "$cluster_name" '.cluster_name == $cluster and
              .namespace == "kube-system" and .service_account == "aws-load-balancer-controller" and
              (.helm_values_overlay | type == "object")' /tmp/platform-controller-identity.json > /dev/null
            jq -er '.values_yaml' /tmp/platform-network-controller.json > /tmp/platform-controller-values.yaml
            jq --arg cluster "$cluster_name" --arg region "$region" --arg vpc "$vpc_id" '
              .helm_values_overlay + {clusterName: $cluster, region: $region, vpcId: $vpc,
                replicaCount: 1, serviceAccount: {create: true, name: "aws-load-balancer-controller"}}
            ' /tmp/platform-controller-identity.json > /tmp/platform-controller-overrides.json
            helm repo add eks https://aws.github.io/eks-charts
            helm repo update eks
            helm upgrade --install "$release" eks/aws-load-balancer-controller \
              --version 1.14.0 --namespace kube-system \
              --values /tmp/platform-controller-values.yaml --values /tmp/platform-controller-overrides.json \
              --wait --timeout 10m
            kubectl get deployments -n kube-system -l "app.kubernetes.io/instance=${release}" \
              -o json --request-timeout=30s > /tmp/platform-controller-deployments.json
            deployment=$(jq -er '.items | if length == 1 then .[0].metadata.name
              else error("Esperado exatamente um Deployment do controller") end' /tmp/platform-controller-deployments.json)
            if ! kubectl rollout status "deployment/${deployment}" -n kube-system --timeout=300s; then
              echo "::error::Rollout do ALB Controller kube-system/${deployment} falhou ou excedeu 300s."
              exit 1
            fi
            aws eks list-pod-identity-associations --cluster-name "$cluster_name" --region "$region" \
              --namespace kube-system --service-account aws-load-balancer-controller \
              > /tmp/platform-controller-associations.json
            if ! jq -e '.associations | length == 1 and all(.[];
              .namespace == "kube-system" and .serviceAccount == "aws-load-balancer-controller")' \
              /tmp/platform-controller-associations.json > /dev/null; then
              echo '::error::Deve existir exatamente uma associacao Pod Identity para kube-system/aws-load-balancer-controller.'
              exit 1
            fi
            association_id=$(jq -er '.associations[0].associationId' /tmp/platform-controller-associations.json)
            aws eks describe-pod-identity-association --cluster-name "$cluster_name" --region "$region" \
              --association-id "$association_id" > /tmp/platform-controller-association.json
            role_arn=$(jq -er --slurpfile contract /tmp/platform-network-controller.json '
              .association | select(.namespace == "kube-system" and
                .serviceAccount == "aws-load-balancer-controller" and .roleArn == $contract[0].identity.role_arn) |
              .roleArn | select(type == "string" and length > 0)' /tmp/platform-controller-association.json)
            kubectl get deployment "$deployment" -n kube-system -o json --request-timeout=30s \
              > /tmp/platform-controller-ready.json
            {
              printf '\n### ALB Controller\n\nChart: `aws-load-balancer-controller`, versao `1.14.0`; Helm `v3.17.3`.\n\n'
              jq -r '"Deployment: kube-system/\(.metadata.name); replicas prontas/desejadas: \(.status.readyReplicas // 0)/\(.spec.replicas)."' \
                /tmp/platform-controller-ready.json
              printf '\nRole da associacao Pod Identity: `%s`.\n' "$role_arn"
            } | tee -a "$GITHUB_STEP_SUMMARY"
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Failure diagnostics
        if: failure()
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao gravar diagnosticos de platform."' ERR
          {
            echo '::group::Failure diagnostics'
            {
              printf '### Failure diagnostics\n\n```text\n'
              if ! test -s "$KUBECONFIG" && test -s /tmp/infra_contract.json; then
                if cluster_name=$(jq -er '.eks.name' /tmp/infra_contract.json); then
                  aws eks update-kubeconfig --name "$cluster_name" --region "$AWS_REGION" || \
                    echo '::error::Nao foi possivel preparar kubeconfig para diagnosticos.'
                else
                  echo '::error::Contrato infra sem nome do cluster para diagnosticos.'
                fi
              fi
              kubectl get pods -A -o wide --request-timeout=30s || echo '::error::Nao foi possivel listar pods.'
              if kubectl get pods -A --field-selector=status.phase!=Running -o json \
                --request-timeout=30s > /tmp/platform-non-running-pods.json; then
                while IFS=$'\t' read -r namespace pod; do
                  kubectl describe pod "$pod" -n "$namespace" --request-timeout=30s || \
                    echo "::error::Nao foi possivel descrever pod ${namespace}/${pod}."
                done < <(jq -r '.items[] | [.metadata.namespace, .metadata.name] | @tsv' /tmp/platform-non-running-pods.json)
              else
                echo '::error::Nao foi possivel consultar pods fora de Running.'
              fi
              kubectl get events -A --sort-by=.lastTimestamp --request-timeout=30s || \
                echo '::error::Nao foi possivel listar eventos.'
              if [[ "$PLATFORM_STAGE" == controller ]] && test -s /tmp/infra_contract.json; then
                if name_prefix=$(jq -er '.name_prefix' /tmp/infra_contract.json); then
                  release="${name_prefix}-alb"
                  helm status "$release" -n kube-system || \
                    echo '::error::Nao foi possivel consultar helm status do ALB Controller.'
                  kubectl logs -n kube-system -l "app.kubernetes.io/instance=${release}" \
                    --tail=100 --all-containers=true --request-timeout=30s || \
                    echo '::error::Nao foi possivel obter logs do ALB Controller.'
                else
                  echo '::error::Contrato infra sem name_prefix para diagnosticos do ALB Controller.'
                fi
              fi
              if [[ "$PLATFORM_STAGE" == apps ]] && test -s /tmp/platform-failed-rollouts.tsv; then
                while IFS=$'\t' read -r namespace deployment selector; do
                  printf '\nDeployment com falha: %s/%s; selector: %s\n' "$namespace" "$deployment" "$selector"
                  kubectl describe deployment "$deployment" -n "$namespace" --request-timeout=30s || \
                    echo "::error::Nao foi possivel descrever Deployment ${namespace}/${deployment}."
                  if kubectl get pods -n "$namespace" -l "$selector" -o json --request-timeout=30s \
                    > /tmp/platform-rollout-pods.json; then
                    while IFS= read -r pod; do
                      kubectl describe pod "$pod" -n "$namespace" --request-timeout=30s || \
                        echo "::error::Nao foi possivel descrever pod ${namespace}/${pod}."
                      kubectl logs "$pod" -n "$namespace" --tail=100 --all-containers=true --request-timeout=30s || \
                        echo "::error::Nao foi possivel obter logs do pod ${namespace}/${pod}."
                    done < <(jq -r '.items[].metadata.name' /tmp/platform-rollout-pods.json)
                  else
                    echo "::error::Nao foi possivel listar pods do Deployment ${namespace}/${deployment}."
                  fi
                done < /tmp/platform-failed-rollouts.tsv
              fi
              printf '```\n\n### Last 200 log lines\n\n```text\n'
              if test -f "$PLATFORM_LOG"; then tail -n 200 "$PLATFORM_LOG"; fi
              printf '```\n'
            } 2>&1 | tee /tmp/platform-diagnostics.txt | tee -a "$GITHUB_STEP_SUMMARY"
            echo '::endgroup::'
          } 2>&1 | tee -a "$PLATFORM_LOG"

      - name: Upload plan, log and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/platform-plan.txt
            /tmp/platform.log
            /tmp/platform-diagnostics.txt
            /tmp/platform-receipts.json
          if-no-files-found: warn
          retention-days: 7
