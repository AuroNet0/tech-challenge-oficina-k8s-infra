name: Plan
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: phase4-demo-a-mutation
  cancel-in-progress: false
env:
  PLAN_ARTIFACT_KEY: ${{ secrets.PLAN_ARTIFACT_KEY }}
  SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
  GH_TOKEN: ${{ github.token }}
  AWS_EC2_METADATA_DISABLED: 'true'
  AWS_REGION: us-east-1
  REPORT_DIR: actions-report/execution
  PHASE: complete
  NETWORK_PROBE_IMAGE: ${{ vars.NETWORK_PROBE_IMAGE }}
  MONGODB_IMAGE: ${{ vars.MONGODB_IMAGE }}
  RABBITMQ_IMAGE: ${{ vars.RABBITMQ_IMAGE }}
  POSTGRES_IMAGE: ${{ vars.POSTGRES_IMAGE }}
  EKS_VPC_CNI_VERSION: ${{ vars.EKS_VPC_CNI_VERSION }}
  EKS_EBS_CSI_VERSION: ${{ vars.EKS_EBS_CSI_VERSION }}
  EKS_POD_IDENTITY_VERSION: ${{ vars.EKS_POD_IDENTITY_VERSION }}
  ALB_CERTIFICATE_ARN: ${{ vars.ALB_CERTIFICATE_ARN }}
  ALB_SERVER_NAME: ${{ vars.ALB_SERVER_NAME }}
  AUTH_SIGNING_SECRET_ARN: ${{ vars.AUTH_SIGNING_SECRET_ARN }}
  MERCADO_PAGO_TEST_SECRET_ARN: ${{ vars.MERCADO_PAGO_TEST_SECRET_ARN }}
  MERCADO_PAGO_SUCCESS_URL: ${{ vars.MERCADO_PAGO_SUCCESS_URL }}
  MERCADO_PAGO_FAILURE_URL: ${{ vars.MERCADO_PAGO_FAILURE_URL }}
  MERCADO_PAGO_PENDING_URL: ${{ vars.MERCADO_PAGO_PENDING_URL }}
  NEW_RELIC_SECRET_ARN: ${{ vars.NEW_RELIC_SECRET_ARN }}
  RECOVERY_ALARM_TOPIC_ARN: ${{ vars.RECOVERY_ALARM_TOPIC_ARN }}
  E2E_FIXTURE_SECRET_ARN: ${{ vars.E2E_FIXTURE_SECRET_ARN }}
jobs:
  bootstrap:
    environment: phase4-demo-a-bootstrap
    runs-on: ${{ fromJSON(vars.PHASE4_EXECUTOR_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      EXECUTOR_ROLE: bootstrap
      PROTECTED_ENVIRONMENT: phase4-demo-a-bootstrap
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/complete
        id: execute
        with:
          operation: plan-part
      - name: Consolidate diagnostics
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          STEPS_JSON: ${{ toJSON(steps) }}
          OPERATION: plan
        run: |
          if test -f scripts/environment-actions/finalize.py; then
            python scripts/environment-actions/finalize.py
          else
            mkdir -p actions-report
            printf '%s\n' '{"result":"FAIL","checks":[{"phase":"checkout-or-setup","status":"FAIL","reason":"EXECUTOR_UNAVAILABLE"}]}' > actions-report/report.json
            printf '%s\n' 'Falha no checkout ou setup; abra o log da etapa. Nenhuma prontidão foi comprovada.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: bootstrap-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: actions-report/
          retention-days: 7
          if-no-files-found: error
  provision:
    environment: phase4-demo-a-provision
    runs-on: ${{ fromJSON(vars.PHASE4_EXECUTOR_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      EXECUTOR_ROLE: provision
      PROTECTED_ENVIRONMENT: phase4-demo-a-provision
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/complete
        id: execute
        with:
          operation: plan-part
      - name: Consolidate diagnostics
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          STEPS_JSON: ${{ toJSON(steps) }}
          OPERATION: plan
        run: |
          if test -f scripts/environment-actions/finalize.py; then
            python scripts/environment-actions/finalize.py
          else
            mkdir -p actions-report
            printf '%s\n' '{"result":"FAIL","checks":[{"phase":"checkout-or-setup","status":"FAIL","reason":"EXECUTOR_UNAVAILABLE"}]}' > actions-report/report.json
            printf '%s\n' 'Falha no checkout ou setup; abra o log da etapa. Nenhuma prontidão foi comprovada.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: provision-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: actions-report/
          retention-days: 7
          if-no-files-found: error
  runtime:
    environment: phase4-demo-a-deploy
    runs-on: ${{ fromJSON(vars.PHASE4_EXECUTOR_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      EXECUTOR_ROLE: deploy
      PROTECTED_ENVIRONMENT: phase4-demo-a-deploy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/complete
        id: execute
        with:
          operation: plan-part
      - name: Consolidate diagnostics
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          STEPS_JSON: ${{ toJSON(steps) }}
          OPERATION: plan
        run: |
          if test -f scripts/environment-actions/finalize.py; then
            python scripts/environment-actions/finalize.py
          else
            mkdir -p actions-report
            printf '%s\n' '{"result":"FAIL","checks":[{"phase":"checkout-or-setup","status":"FAIL","reason":"EXECUTOR_UNAVAILABLE"}]}' > actions-report/report.json
            printf '%s\n' 'Falha no checkout ou setup; abra o log da etapa. Nenhuma prontidão foi comprovada.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: runtime-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: actions-report/
          retention-days: 7
          if-no-files-found: error
  complete:
    needs: [bootstrap, provision, runtime]
    runs-on: ubuntu-latest
    env:
      OPERATION: plan
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: complete-part-bootstrap
          path: plan-parts/bootstrap
      - uses: actions/download-artifact@v4
        with:
          name: complete-part-provision
          path: plan-parts/provision
      - uses: actions/download-artifact@v4
        with:
          name: complete-part-deploy
          path: plan-parts/deploy
      - name: Seal complete manifest and saved plans
        run: python scripts/environment-actions/complete.py assemble
      - uses: actions/upload-artifact@v4
        with:
          name: approved-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: actions-report/execution/bundle.json
          if-no-files-found: error
          retention-days: 7
      - name: Consolidate diagnostics
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          STEPS_JSON: ${{ toJSON(steps) }}
          OPERATION: plan
        run: |
          if test -f scripts/environment-actions/finalize.py; then
            python scripts/environment-actions/finalize.py
          else
            mkdir -p actions-report
            printf '%s\n' '{"result":"FAIL","checks":[{"phase":"checkout-or-setup","status":"FAIL","reason":"EXECUTOR_UNAVAILABLE"}]}' > actions-report/report.json
            printf '%s\n' 'Falha no checkout ou setup; abra o log da etapa. Nenhuma prontidão foi comprovada.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: complete-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: actions-report/
          retention-days: 7
          if-no-files-found: error
  report:
    if: ${{ always() }}
    needs: [bootstrap, provision, runtime, complete]
    runs-on: ubuntu-latest
    env:
      OPERATION: plan
      JOB_RESULTS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}'
          path: all-diagnostics
      - name: Consolidate diagnostics
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          if test -f scripts/environment-actions/complete_report.py; then
            python scripts/environment-actions/complete_report.py
          else
            mkdir -p all-diagnostics
            printf '%s\n' '{"result":"FAIL","checks":[{"phase":"checkout-or-setup","status":"FAIL","reason":"EXECUTOR_UNAVAILABLE"}]}' > all-diagnostics/report.json
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: plan-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: all-diagnostics/
          if-no-files-found: error
          retention-days: 7
