name: Terraform CI/CD

on:
  pull_request:
    branches:
      - homolog
      - main
  push:
    branches:
      - homolog
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: terraform
  EKS_CLUSTER_NAME: tech-challenge-oficina
  ENABLE_API_GATEWAY: ${{ vars.ENABLE_API_GATEWAY == 'true' && 'true' || 'false' }}
  API_BACKEND_URL: ${{ vars.API_BACKEND_URL }}
  NEW_RELIC_ENABLED: ${{ vars.ENABLE_NEW_RELIC == 'true' && 'true' || 'false' }}

jobs:
  terraform-ci:
    name: Terraform CI
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check

      - name: Terraform init without backend
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false -backend=false

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

  terraform-deploy:
    name: Terraform deploy
    runs-on: ubuntu-latest
    needs: terraform-ci
    if: github.event_name != 'pull_request' && (github.ref_name == 'homolog' || github.ref_name == 'main')
    environment: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}
    concurrency:
      group: terraform-${{ github.ref_name == 'main' && 'production' || 'homolog' }}
      cancel-in-progress: false

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Check EKS cluster
        id: check_eks_cluster
        if: env.NEW_RELIC_ENABLED == 'true'
        run: |
          if aws eks describe-cluster \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME" \
            >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Terraform plan base infrastructure
        if: env.NEW_RELIC_ENABLED == 'true' && steps.check_eks_cluster.outputs.exists != 'true'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_enable_new_relic: false
        run: terraform plan -input=false -var="enable_api_gateway=${ENABLE_API_GATEWAY}" -var="api_backend_url=${API_BACKEND_URL}" -var="enable_new_relic=false"

      - name: Terraform apply base infrastructure
        if: env.NEW_RELIC_ENABLED == 'true' && steps.check_eks_cluster.outputs.exists != 'true'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_enable_new_relic: false
        run: terraform apply -input=false -auto-approve -var="enable_api_gateway=${ENABLE_API_GATEWAY}" -var="api_backend_url=${API_BACKEND_URL}" -var="enable_new_relic=false"

      - name: Terraform plan
        if: env.NEW_RELIC_ENABLED != 'true'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_enable_new_relic: false
        run: terraform plan -input=false -var="enable_api_gateway=${ENABLE_API_GATEWAY}" -var="api_backend_url=${API_BACKEND_URL}" -var="enable_new_relic=false"

      - name: Terraform apply
        if: env.NEW_RELIC_ENABLED != 'true'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_enable_new_relic: false
        run: terraform apply -input=false -auto-approve -var="enable_api_gateway=${ENABLE_API_GATEWAY}" -var="api_backend_url=${API_BACKEND_URL}" -var="enable_new_relic=false"

      - name: Setup kubectl
        if: env.NEW_RELIC_ENABLED == 'true'
        uses: azure/setup-kubectl@v4

      - name: Validate New Relic API key
        if: env.NEW_RELIC_ENABLED == 'true'
        env:
          NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
        run: |
          if [ -z "$NEW_RELIC_API_KEY" ]; then
            echo "NEW_RELIC_API_KEY environment secret is required when New Relic is enabled."
            exit 1
          fi

      - name: Prepare New Relic license Secret
        if: env.NEW_RELIC_ENABLED == 'true'
        env:
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
        run: |
          if [ -z "$NEW_RELIC_LICENSE_KEY" ]; then
            echo "NEW_RELIC_LICENSE_KEY environment secret is required when New Relic is enabled."
            exit 1
          fi

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

          kubectl create namespace newrelic \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          kubectl create secret generic newrelic-license \
            --namespace newrelic \
            --from-literal=licenseKey="$NEW_RELIC_LICENSE_KEY" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Wait for EKS networking readiness
        if: env.NEW_RELIC_ENABLED == 'true'
        run: |
          kubectl wait nodes \
            --all \
            --for=condition=Ready \
            --timeout=300s

          kubectl get daemonset aws-node -n kube-system

          kubectl rollout status daemonset/aws-node -n kube-system --timeout=300s || {
            kubectl describe daemonset aws-node -n kube-system || true
            kubectl logs -n kube-system -l k8s-app=aws-node -c aws-node --tail=200 --prefix=true || true
            kubectl get events -A --sort-by=.lastTimestamp || true
            exit 1
          }

          kubectl get pods -n kube-system -l k8s-app=aws-node -o wide

      - name: Terraform plan New Relic
        if: env.NEW_RELIC_ENABLED == 'true'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_enable_new_relic: ${{ vars.ENABLE_NEW_RELIC }}
          TF_VAR_new_relic_account_id: ${{ vars.NEW_RELIC_ACCOUNT_ID }}
          TF_VAR_new_relic_api_key: ${{ secrets.NEW_RELIC_API_KEY }}
          TF_VAR_new_relic_region: ${{ vars.NEW_RELIC_REGION }}
          TF_VAR_new_relic_api_base_url: ${{ vars.NEW_RELIC_API_BASE_URL }}
        run: terraform plan -input=false -var="enable_api_gateway=${ENABLE_API_GATEWAY}" -var="api_backend_url=${API_BACKEND_URL}" -var="enable_new_relic=${{ vars.ENABLE_NEW_RELIC }}" -var="new_relic_account_id=${{ vars.NEW_RELIC_ACCOUNT_ID }}" -var="new_relic_api_base_url=${{ vars.NEW_RELIC_API_BASE_URL }}"

      - name: Terraform apply New Relic
        if: env.NEW_RELIC_ENABLED == 'true'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_enable_new_relic: ${{ vars.ENABLE_NEW_RELIC }}
          TF_VAR_new_relic_account_id: ${{ vars.NEW_RELIC_ACCOUNT_ID }}
          TF_VAR_new_relic_api_key: ${{ secrets.NEW_RELIC_API_KEY }}
          TF_VAR_new_relic_region: ${{ vars.NEW_RELIC_REGION }}
          TF_VAR_new_relic_api_base_url: ${{ vars.NEW_RELIC_API_BASE_URL }}
        run: |
          terraform apply -input=false -auto-approve \
            -var="enable_api_gateway=${ENABLE_API_GATEWAY}" \
            -var="api_backend_url=${API_BACKEND_URL}" \
            -var="enable_new_relic=${{ vars.ENABLE_NEW_RELIC }}" \
            -var="new_relic_account_id=${{ vars.NEW_RELIC_ACCOUNT_ID }}" \
            -var="new_relic_api_base_url=${{ vars.NEW_RELIC_API_BASE_URL }}" || {
              aws eks update-kubeconfig \
                --region "$AWS_REGION" \
                --name "$EKS_CLUSTER_NAME"

              kubectl get pods -n newrelic -o wide || true
              kubectl get events -n newrelic --sort-by=.lastTimestamp || true
              kubectl describe pods -n newrelic || true
              exit 1
            }
