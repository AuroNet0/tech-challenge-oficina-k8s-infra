name: Terraform CI/CD

on:
  pull_request:
    branches:
      - homolog
      - main
  push:
    branches:
      - homolog
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: terraform
  EKS_CLUSTER_NAME: tech-challenge-oficina
  NEW_RELIC_ENABLED: ${{ vars.ENABLE_NEW_RELIC == 'true' && 'true' || 'false' }}

jobs:
  terraform-ci:
    name: Terraform CI
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check

      - name: Terraform init without backend
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

  terraform-deploy:
    name: Terraform deploy
    runs-on: ubuntu-latest
    needs: terraform-ci
    if: github.event_name != 'pull_request' && (github.ref_name == 'homolog' || github.ref_name == 'main')
    environment: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}
    concurrency:
      group: terraform-${{ github.ref_name == 'main' && 'production' || 'homolog' }}
      cancel-in-progress: false

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Check EKS cluster
        id: check_eks_cluster
        if: env.NEW_RELIC_ENABLED == 'true'
        run: |
          if aws eks describe-cluster \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME" \
            >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Terraform plan base infrastructure
        if: env.NEW_RELIC_ENABLED == 'true' && steps.check_eks_cluster.outputs.exists != 'true'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_enable_new_relic: false
        run: terraform plan

      - name: Terraform apply base infrastructure
        if: env.NEW_RELIC_ENABLED == 'true' && steps.check_eks_cluster.outputs.exists != 'true'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_enable_new_relic: false
        run: terraform apply -auto-approve

      - name: Terraform plan
        if: env.NEW_RELIC_ENABLED != 'true'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_enable_new_relic: false
        run: terraform plan

      - name: Terraform apply
        if: env.NEW_RELIC_ENABLED != 'true'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_enable_new_relic: false
        run: terraform apply -auto-approve

      - name: Setup kubectl
        if: env.NEW_RELIC_ENABLED == 'true'
        uses: azure/setup-kubectl@v4

      - name: Prepare New Relic license Secret
        if: env.NEW_RELIC_ENABLED == 'true'
        env:
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
        run: |
          if [ -z "$NEW_RELIC_LICENSE_KEY" ]; then
            echo "NEW_RELIC_LICENSE_KEY environment secret is required when New Relic is enabled."
            exit 1
          fi

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

          kubectl create namespace newrelic \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          kubectl create secret generic newrelic-license \
            --namespace newrelic \
            --from-literal=licenseKey="$NEW_RELIC_LICENSE_KEY" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Terraform plan New Relic
        if: env.NEW_RELIC_ENABLED == 'true'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_enable_new_relic: ${{ vars.ENABLE_NEW_RELIC }}
          TF_VAR_new_relic_account_id: ${{ vars.NEW_RELIC_ACCOUNT_ID }}
          TF_VAR_new_relic_api_base_url: ${{ vars.NEW_RELIC_API_BASE_URL }}
          NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
          NEW_RELIC_REGION: ${{ vars.NEW_RELIC_REGION }}
        run: terraform plan

      - name: Terraform apply New Relic
        if: env.NEW_RELIC_ENABLED == 'true'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_enable_new_relic: ${{ vars.ENABLE_NEW_RELIC }}
          TF_VAR_new_relic_account_id: ${{ vars.NEW_RELIC_ACCOUNT_ID }}
          TF_VAR_new_relic_api_base_url: ${{ vars.NEW_RELIC_API_BASE_URL }}
          NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
          NEW_RELIC_REGION: ${{ vars.NEW_RELIC_REGION }}
        run: terraform apply -auto-approve
