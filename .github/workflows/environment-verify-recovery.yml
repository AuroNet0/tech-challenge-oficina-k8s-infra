name: Environment Verify Recovery
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type VERIFY demo-a RECOVERY. Requires an existing private cluster.
        type: string
        required: true
      mode:
        description: Prove private close first; after approved broker activation test independent expiry of a 300-second /32 lease
        type: choice
        default: closed-canary
        options:
          - closed-canary
          - lease-expiry
permissions:
  contents: read
concurrency:
  group: phase4-demo-a-mutation
  cancel-in-progress: false
jobs:
  verify:
    environment: phase4-demo-a-bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    env:
      CONFIRMATION: ${{ inputs.confirmation }}
      PHASE4_BOOTSTRAP_APPROVED: ${{ vars.PHASE4_BOOTSTRAP_APPROVED }}
      VERIFY_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scope and authorization
        run: |
          test "$GITHUB_REPOSITORY" = 'AuroNet0/tech-challenge-oficina-k8s-infra'
          test "$GITHUB_REF" = 'refs/heads/homolog'
          test "$CONFIRMATION" = 'VERIFY demo-a RECOVERY'
          test "$PHASE4_BOOTSTRAP_APPROVED" = 'true'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/environment-actions/requirements.txt
      - run: python scripts/environment-actions/package_recovery.py
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::446517826146:role/tc-oficina-p4-demo-a-bootstrap
          role-session-name: canary-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: us-east-1
          allowed-account-ids: '446517826146'
          unset-current-credentials: true
      - run: python scripts/environment-actions/verify_recovery.py
      - if: ${{ always() }}
        run: node scripts/environment-actions/diagnostics.mjs fallback verify-recovery
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: recovery-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            actions-report/report.json
            actions-report/summary.md
            actions-report/verification.json
          retention-days: 7
