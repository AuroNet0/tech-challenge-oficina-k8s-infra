name: Billing payment diagnostics

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: phase4-demo-a-mutation
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_WORKSPACE: default
      AWS_REGION: us-east-1
      AWS_PAGER: ''
      KUBECONFIG: /tmp/seed-kubeconfig
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: billing-diag-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Ler outputs da infra e da plataforma
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao ler outputs; confira se o Deploy esta de pe e as permissoes AWS."' ERR
          umask 077
          for stack in infra platform; do
            terraform -chdir="phase4/stacks/${stack}" init -input=false -no-color \
              -backend-config=bucket=tech-challenge-oficina-terraform-state-b1cfa326 \
              -backend-config="key=phase4/environments/demo-a/${stack}.tfstate" \
              -backend-config=region=us-east-1 \
              -backend-config=encrypt=true \
              -backend-config=use_lockfile=true > /dev/null
          done
          terraform -chdir=phase4/stacks/infra output -json platform_contract > /tmp/infra_contract.json
          terraform -chdir=phase4/stacks/platform output -json manifests > /tmp/platform-manifests.json
          account_id=$(aws sts get-caller-identity --query Account --output text)
          jq -e --arg account "$account_id" '.environment_id == "demo-a" and
            .aws_account_id == $account and .aws_region == "us-east-1" and
            (.name_prefix | type == "string" and length > 0)' /tmp/infra_contract.json > /dev/null
          jq -e '.bootstrap | fromjson | .items[0] | select(.kind == "Job")' \
            /tmp/platform-manifests.json > /tmp/job-base.json

      - name: Consultar estado dos pagamentos
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Falha ao consultar o banco do billing-service."' ERR
          cluster_name=$(jq -er '.eks.name' /tmp/infra_contract.json)
          namespace=$(jq -er '.name_prefix' /tmp/infra_contract.json)
          aws eks update-kubeconfig --name "$cluster_name" --region "$AWS_REGION"
          job_name="billing-diag-${GITHUB_RUN_ID}"
          printf '%s\n' "$job_name" > /tmp/diag-job-name
          sql="SELECT p.id, p.os_id, p.status, p.valor, p.created_at, s.next_sync_at, s.last_sync_at, s.attempts, s.last_error, s.review_reason FROM pagamentos p LEFT JOIN provider_sync s ON s.payment_id=p.id ORDER BY p.created_at DESC LIMIT 5; SELECT payment_id, state, created_at FROM provider_checkouts ORDER BY created_at DESC LIMIT 5; SELECT external_id, payment_id, status, provider_updated_at, observed_at FROM provider_payments ORDER BY observed_at DESC LIMIT 5; SELECT payment_id, external_id, status, observed_at FROM provider_observations ORDER BY observed_at DESC LIMIT 10; SELECT status, count(*) FROM provider_notifications GROUP BY status;"
          jq --arg namespace "$namespace" --arg name "$job_name" --arg sql "$sql" --slurpfile infra /tmp/infra_contract.json '
            .metadata.name = $name | .metadata.namespace = $namespace |
            .spec.template.spec.containers[0].command = ["psql", "-X", "--set=ON_ERROR_STOP=1", "-c", $sql] |
            .spec.template.spec.containers[0].envFrom = [] |
            .spec.template.spec.containers[0].env = [
              {name: "PGHOST", value: $infra[0].rds.address}, {name: "PGPORT", value: "5432"},
              {name: "PGDATABASE", value: $infra[0].rds.application_databases.billing.database},
              {name: "PGSSLMODE", value: "verify-full"}, {name: "PGSSLROOTCERT", value: "/rds-ca/ca.pem"},
              {name: "PGUSER", valueFrom: {secretKeyRef: {name: "billing-postgres", key: "username"}}},
              {name: "PGPASSWORD", valueFrom: {secretKeyRef: {name: "billing-postgres", key: "password"}}}] |
            .spec.template.spec.containers[0].volumeMounts = [{name: "rds-ca", mountPath: "/rds-ca", readOnly: true}] |
            .spec.template.spec.volumes = [{name: "rds-ca", configMap: {name: "rds-ca"}}]
          ' /tmp/job-base.json > /tmp/diag-job.json
          kubectl apply -f /tmp/diag-job.json
          kubectl wait --for=condition=complete "job/${job_name}" -n "$namespace" --timeout=300s
          {
            echo '### Estado dos pagamentos no billing-service'
            echo
            echo '```'
            kubectl logs "job/${job_name}" -n "$namespace"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Limpar Job temporario
        if: always()
        run: |
          namespace=$(jq -er '.name_prefix' /tmp/infra_contract.json 2>/dev/null) || exit 0
          job_name=$(cat /tmp/diag-job-name 2>/dev/null || true)
          if [ -n "$job_name" ]; then
            kubectl delete job "$job_name" -n "$namespace" --ignore-not-found --wait=false || true
          fi