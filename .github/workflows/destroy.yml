name: Destroy
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DESTROY demo-a
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: phase4-demo-a-mutation
  cancel-in-progress: false
jobs:
  destroy:
    environment: phase4-demo-a-destroy
    runs-on: ${{ fromJSON(vars.PHASE4_EXECUTOR_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      EXECUTOR_ROLE: destroy
      PROTECTED_ENVIRONMENT: phase4-demo-a-destroy
      CONFIRMATION: ${{ inputs.confirmation }}
      OPERATION: destroy
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_REGION: us-east-1
      REPORT_DIR: actions-report/execution
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Validate explicit destruction approval
        run: python scripts/environment-actions/pipeline.py gate
      - name: Complete owned teardown and destroy
        id: execute
        run: python scripts/environment-actions/complete.py destroy-all
      - name: Independently verify endpoint closure
        if: ${{ always() }}
        env:
          REPORT_DIR: actions-report/endpoint-close
        run: python scripts/environment-actions/complete.py close
      - name: Consolidate diagnostics
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          STEPS_JSON: ${{ toJSON(steps) }}
          OPERATION: destroy
        run: |
          if test -f scripts/environment-actions/finalize.py; then
            python scripts/environment-actions/finalize.py
          else
            mkdir -p actions-report
            printf '%s\n' '{"result":"FAIL","checks":[{"phase":"checkout-or-setup","status":"FAIL","reason":"EXECUTOR_UNAVAILABLE"}]}' > actions-report/report.json
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: execution-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: actions-report/
          retention-days: 7
          if-no-files-found: error
  report:
    if: ${{ always() }}
    needs: [destroy]
    runs-on: ubuntu-latest
    env:
      OPERATION: destroy
      JOB_RESULTS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}'
          path: all-diagnostics
      - name: Consolidate diagnostics
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          if test -f scripts/environment-actions/complete_report.py; then
            python scripts/environment-actions/complete_report.py
          else
            mkdir -p all-diagnostics
            printf '%s\n' '{"result":"FAIL","checks":[{"phase":"checkout-or-setup","status":"FAIL","reason":"EXECUTOR_UNAVAILABLE"}]}' > all-diagnostics/report.json
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: destroy-final-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: all-diagnostics/
          if-no-files-found: error
          retention-days: 7
